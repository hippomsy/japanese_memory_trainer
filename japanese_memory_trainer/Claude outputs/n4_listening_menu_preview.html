<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>N4 청해 메뉴 미리보기</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL@24,500,1&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#F7F3EC;--card:#fff;--ink:#1C2340;--soft:#6A7088;--line:#EAE3D6;--shu:#E2553F;--sora:#4A7BE0}
*{box-sizing:border-box;margin:0}
body{background:#d9d4cb;font-family:'Noto Sans KR',sans-serif;color:var(--ink);display:flex;flex-wrap:wrap;justify-content:center;gap:28px;padding:24px 12px}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}.cap{font-size:13px;font-weight:700;color:#4a4740}
.phone{width:390px;max-width:100%;background:var(--paper);border-radius:34px;overflow:hidden;box-shadow:0 20px 50px #0003;border:8px solid #222;display:flex;flex-direction:column}
.bar{padding:18px 18px 8px}.bar h1{font-size:22px;font-weight:900}.bar p{font-size:13px;color:var(--soft)}
.body{padding:6px 18px 20px;height:640px;overflow-y:auto}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 10px}.sec b{font-size:17px;font-weight:900}.sec span{font-size:12px;color:var(--soft)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;position:relative}
.top{display:flex;justify-content:space-between}.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center}
.ms{font-family:'Material Symbols Rounded';font-size:24px;font-style:normal}
.badge{color:#fff;font-size:10px;font-weight:900;padding:2px 7px;border-radius:10px;height:fit-content}
.ill{height:84px;border-radius:14px;margin:12px 0 10px;opacity:.18}
.t{font-size:15.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.s{font-size:12px;color:var(--soft);line-height:1.35;margin-top:3px}
.hl{outline:3px solid #D9692B;outline-offset:3px}
.arrow{position:absolute;top:-30px;left:8px;background:#D9692B;color:#fff;font-size:12px;font-weight:900;padding:3px 9px;border-radius:9px}
.nav{display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--line);height:68px;align-items:center;font-size:12px}
.nav div{display:flex;flex-direction:column;align-items:center;color:var(--soft)}.nav .on{color:var(--shu);font-weight:700}
.hero{margin:6px 16px;background:var(--ink);color:#fff;border-radius:24px;padding:20px}
.hero .ms{color:#FFCC94;font-size:32px}.hero h2{font-size:24px;font-weight:800;line-height:1.3;margin-top:6px}.hero p{font-size:12.5px;opacity:.8;margin-top:6px}
.list{padding:8px 16px 16px;height:470px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.it{background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 12px;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}
.n{width:34px;height:34px;border-radius:11px;background:#4A7BE01a;color:var(--sora);display:grid;place-items:center;font-weight:900;font-size:13px}
.it.new .n{background:var(--sora);color:#fff}
.tt{font-size:14.5px;font-weight:700}.fc{font-size:11.5px;color:var(--soft)}
.tag{font-size:10px;font-weight:900;color:#fff;background:#D9692B;border-radius:8px;padding:1px 6px;margin-left:6px}
.ab{display:flex;align-items:center;gap:10px;padding:16px 16px 4px}.ab h2{font-size:18px;font-weight:900}
</style></head><body>
<div class="col"><div class="cap">① 학습 탭 · N4 청해 50문제로 확장</div><div class="phone">

<div class="nav"><div><span class="ms">wb_sunny</span>오늘</div><div class="on"><span class="ms">grid_view</span>학습</div><div><span class="ms">insights</span>기록</div></div></div></div>
<div class="col"><div class="cap">② N4 청해 목록 · 새 문제 30개(파란 번호)</div><div class="phone">
<div class="ab"><span class="ms">arrow_back</span><h2>N4 청해</h2></div>

const g={};C.forEach(c=>(g[c[0]]??=[]).push(c));let h='';
