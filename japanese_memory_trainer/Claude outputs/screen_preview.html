 있어요.","私、年が明けたら海外に行こうと思ってるんです。"]]},{"no":43,"title":"실연","summary":"아사노는 누군가에게 선물을 주기 위해 열심히 물건을 고르는데...","kw":[["運気","운",""],["アドバイス","어드바이스",""],["変","이상함",""]],"s":[["아사노","小野寺さん！","오노데라씨!"],["아사노","じゃあ、これとこれだったら、どっちがいいですか？","그럼 이거랑 이거면 어느 쪽이 좋아요?"],["요리코","そうだなあ…","글쎄요..."],["요리코","私だったら…こっちかな？","저라 면... 이쪽이려나?"],["아사노","あぁ、そうですか…うん。","아, 그래 요... 음."],["아사노","小野寺さん。","오노데라씨."],["요리코","はい！","네!"],["아사노","ちなみに、これって、運気上がりますか？","참고로 이거는 운이 좋아지 나요?"],["아사노","あ、実は僕…その…","아,실은 저...그..."],["아사노","プレゼントしたい人がいまして…","선물하고 싶은 사람이 있어서요..."],["아사노","それで、是非、小野寺さんのアドバイスを頂きたいなと思いまして。","그래서 꼭 오노데라씨의 어드바이스를 받고 싶다고 생각해서."],["아사노","あ、なんて言うか、その…ブティックの齋藤さんなんですけど。","아, 뭐랄까... 그... 부티크의 사이토씨인데요."],["아사노","全然分かんないんですよね、こういうの。","전혀 모르거든요, 이런 거."],["아사노","それで、小野寺さん昨日、風水にお詳しそうなことおっしゃっていたので。","그래서, 오노데라씨 어제 풍수지리 잘 알고 있는 듯이 말씀하셔서."],["아사노","あぁ、、女の人ってみんなそういうの好きなのかなって思って。","아, 여자들은 모두 이런 거 좋아하는건가 싶어서."],["아사노","あ、変なお願いしちゃってすみません。","아, 이상한 부탁해서 죄송해요."],["요리코","あ、いいえ。","아. 아뇨."],["요리코","ラーん、そうか…","음... 그렇구나..."],["아사노","はい。","네."],["요리코","そうですねぇ。齋藤ちゃんだったら…","그렇군요. 사이 토씨라 면..."],["요리코","こっちの方がいいと思う。","이 쪽이 좋을 것 같아."],["아사노","え？はい。","네? 네."],["요리코","彼女、ピンク好きだし。","그녀는 핑크 좋아하니까."],["아사노","なるほど。あぁあ。","그렇군요. 아..."],["아사노","うん、いいですね。","응, 좋네요."],["아사노","ありがとうございます。","감사합니다."]],"r":[["運気","운","",""],["運気が上がる","운이 올라가다","",""],["運気が高まる","운이 높아지다","",""],["運気がアップする","운이 업 되다","",""],["アドバイス","어드바이스, 충고","",""],["助言","조언","",""],["忠告","충고","",""],["勧告","권고","",""],["変","이상함","",""],["変だ","이상하다","",""],["妙だ","이상하다, 묘하다","",""],["可笑しい","이상하다","",""]],"q":[["오노데라씨!","小野寺さん！"],["아, 그래 요... 음.","あぁ、そうですか…うん。"],["참고로 이거는 운이 좋아지 나요?","ちなみに、これって、運気上がりますか？"],["그래서 꼭 오노데라씨의 어드바이스를 받고 싶다고 생각해서.","それで、是非、小野寺さんのアドバイスを頂きたいなと思いまして。"],["아, 이상한 부탁해서 죄송해요.","あ、変なお願いしちゃってすみません。"]]},{"no":44,"title":"이별 택시","summary":"실연당한 요리코는 택시를 타고 집으로 향한다.","kw":[["ご馳走","식사, 대접",""],["別に","딱히, 별로",""],["最初","처음",""]],"s":[["아사노","あ、もし良かったら、お食事ご馳走させて下さい。","아, 혹시 괜찮으시 면 식사라도 대접하게 해주세요."],["요리코","あ、いや…","아,아뇨..."],["아사노","あ、でも、あの、ちゃんとお礼がしたいので。","아, 그래도 제대로 사례를 하고 싶어서요."],["요리코","ちょっと、用がありますから。","좀 볼일 이 있어서요."],["아사노","あぁ、そうですか。","아,그래요."],["아사노","あの、これ、本当にありがとうございました。","저, 이거 정말 감사했습니다."],["요리코","いいえ。","아뇨."],["아사노","じゃあ。","그럼."],["요리코","ここで。","여기서."],["택시운전사","はい。","네."],["스스무","ただいま！！！","다녀왔어!"],["요리코","おかえり！","어서 와!"],["요리코","ちょっと！飲むんだったらコップ使いなさい。","잠깐! 마실거면 컵 써."],["스스무","別にいいだろ。","뭐 어때."],["스스무","俺しか飲まないんだから。","나 밖에 안 마시니까."],["요리코","ったく…","참..."],["요리코","何？どうかした？","뭐? 무슨 일이야?"],["스스무","別に。","딱히."],["요리코","ご飯は？","밥은?"],["스스무","ん？あぁ食べて来た。","응? 아, 먹고 왔어."],["요리코","そう。じゃあ、いらないわね。","그래. 그럼 필요 없겠네."],["스스무","姉ちゃん食べんの？","누나 먹을 거야?"],["요리코","だって食べてないもん。","왜냐면 안 먹었는 걸."],["스스무","あ、じゃあ、俺も。","아,그럼 나도."],["요리코","もう…","진 짜..."],["요리코","だったら最初から食べるって言いなさいよ。","그러면 처음부터 먹는다고 해."]],"r":[["ご馳走","식사, 대접","",""],["ご馳走する","대접하다, 한턱내다","",""],["ご馳走になる","대 접을 받다","",""],["ご馳走さまでした","잘 먹었습니다","",""],["別〜","나뉘다","",""],["別に","딱히, 별로, 따로","",""],["別々に","따로","",""],["別途","별도","",""],["最〜","가장, 제일","",""],["最初","최초(처음)","",""],["最後","최후(마지막)","",""],["最高","최고","",""]],"q":[["아, 혹시 괜찮으시 면 식사라도 대접하게 해주세요.","あ、もし良かったら、お食事ご馳走させて下さい。"],["아, 그래도 제대로 사례를 하고 싶어서요.","あ、でも、あの、ちゃんとお礼がしたいので。"],["아,그래요.","あぁ、そうですか。"],["뭐 어때.","別にいいだろ。"],["그러면 처음부터 먹는다고 해.","だったら最初から食べるって言いなさいよ。"]]},{"no":45,"title":"그래도 괜찮아","summary":"스스무가 요리코의 생일 선물로 준비한 것은...","kw":[["手(を)離す","손을 떼다, 놓다",""],["外す","떼다,떼어내다",""]],"s":[["스스무","姉ちゃん、これ。","누나 이거."],["요리코","いや、今、手離せないから、そこ置いといて。","지금 손 놓을 수 없으니까 거기 놔둬."],["요리코","何？何なのよ。","뭐? 뭔데?"],["스스무","誕生日プレゼント。","생일 선물."],["요리코","え？","뭐?"],["스스무","それで作りなよ、歯。","그걸로 만들어, 이."],["요리코","プレゼントに現金って。","선 물로 현금이라니."],["요리코","進。","스스무. 스스무: 、 ㅅ? 응?"],["요리코","ごめんね。姉ちゃんふられちゃった。","미안해. 누나 차여버렸어."],["스스무","何言ってんだよ。","무슨 말 하는 거야."],["스스무","風呂洗ってくる。","욕실 청소하고 올게."],["요리코","ありがとう。","고마워."],["요리코","何？","왜그래?"],["스스무","これが、そうか。","이게 그거구나."],["요리코","何よ、気持ち悪い。","뭐야, 징그럽게."],["요리코","気をつけなさいよ。あんた、シャワーとカラン間違えんだから。","아! 조심해. 너 샤워랑 수도꼭지 헷갈려하니까."],["요리코","いっ！","아야!"],["요리코","ちょっ…どうすんのこれ？どうやって取んの？","잠깐... 어떻게 하는 거야 이거? 어떻게 빼는 거야?"],["스스무","ったく。","아이고, 정말이지."],["요리코","助けて！ちょっと。","도와줘! 좀."],["요리코","どうなってるのこれ、やだ、早く！","어떻게 된 거야 이거. 뭐야, 빨리!"],["스스무","わかっ、ちょ、わかった、ちょ。手放して放して。","알겠, 잠깐 알겠어 좀. 손 놔봐, 놔."],["요리코","どうなってんの？え？","뭐 어떻게 된 거야?"],["스스무","バタバタしないでよ！","움직이지마!"],["스스무","いや、ちょちょちょちょ動かない！動かない！動かない！","아니, 자자잠깐 움직이 지 마! 움직이지 마, 움직이지마."],["요리코","ほい。","네."],["요리코","もうこれ外そうか。","이제 이거 뗄까?"]],"r":[["離す","떼다","",""],["手離す","손 떼다, 놓다","",""],["見離す","돌아보지 않다, 못 본 체하다","",""],["引き離す","떼어놓다, 갈라놓다","",""],["風呂","욕조, 욕실","",""],["風呂場","욕실","",""],["風呂に入る","목욕을 하다(욕조에 들어가다)","",""],["風呂に浸かる","목욕을 하다(욕조에 몸을 담그다)","",""],["外す","떼다, 떼어내다","",""],["取る","떼다","",""],["取り外す","떼다,빼다","",""],["除く","없애다, 제거하다","",""]],"q":[["누나 이거.","姉ちゃん、これ。"],["지금 손 놓을 수 없으니까 거기 놔둬.","いや、今、手離せないから、そこ置いといて。"],["선 물로 현금이라니.","プレゼントに現金って。"],["고마워.","ありがとう。"],["잠깐... 어떻게 하는 거야 이거? 어떻게 빼는 거야?","ちょっ…どうすんのこれ？どうやって取んの？"]]}],"id":"v2","volume":"2","title":"오 브라더, 오 시스터!","ja_title":"姉ちゃんの恋人","description":"티격태격 오노데라 남매의 일상. 생생한 반말·직장 회화와 키워드 응용."},{"lessons":[{"no":1,"title":"안 좋은 예감","summary":"늦은 밤, 갓파 부자가 이야기를 나누고 있다.","kw":[["〜って","〜은/는, 〜을/를","〜は、〜を"],["小っちぇ","작다","小さい"],["ひでぇ","너무하다, 심하다","ひどい"],["おっかねぇ","무섭다","おっかない"],["食うんじゃねぇ","먹는 거 아니야","食べるんじゃない"],["話をすっから","이야기를 할 테니까","話をするから"],["おめぇ","너","おまえ"],["草ん中","풀 속","草の中"],["行きてぇ","가고 싶다","行きたい"],["こんなん","이런 거","こんなの"],["これくれぇ","이 정도","これくらい"],["ほれ","자","ほら"]],"s":[["쿠","父ちゃん、龍って見たことある？","아빠 용을 본적이 있어?"],["아빠","あぁ。小っちぇ頃一度だけな。","어.어렸을 때 한번만."],["아빠","ひでぇ日照りがあった時、長老たちが雨を降らせるために呼んだ。","심한 가뭄이 있었을 때 장로들이 비를 내리게 하기 위해서 불렀어."],["쿠","龍っつておっかねぇか？","용은 무서워?"],["아빠","あぁ、おっかねぇ。けど、いい神様だ。","어~ 무서워. 하지만 좋은 신이야."],["쿠","へえ〜",""],["아빠","バカ。蛍なんか食うんじゃねぇ。","바보. 반딧불 같은 거 먹는 거 아냐."],["아빠","龍もおっかねぇけど、今は人間の方がおっかねぇ。","용도 무섭지 만 지 금은 인간들이 더 무섭다."],["쿠","来た。","왔다."],["아빠","まず、父ちゃんが話をすっから、おめぇはこの辺の草ん中に隠れてろ。","우선 아빠가 이야기를 할 테니까 너는 이 근처 풀 속에 숨어 있거라."],["쿠","えぇ〜俺も一緒に行きてぇよ。","에~ 나도 같이 가고 싶어~"],["아빠","だんね、話がついたら呼ぶから、そしたら。","좋아, 얘기가 정리 되면 부를 테니까 그러면."],["쿠","これだね。","이거구나."],["아빠","あぁ、呼んだらこれを持って来い。おめぇから差し上げろ。","으응, 부르면 이걸 가지고 와. 너가 드려라."],["쿠","旨そうな鯉だよな。俺、こんなんもらえたら、何だって言う事聞くな。","맛있게 생긴 잉 어네. 나 이런 거 받으면 뭐든지 말 들을 거야."],["아빠","これくれぇおめぇだって、次期捕まえられるようになるさ。","이 정도 너도 다음에 잡을 수 있게 될 거야."],["쿠","そうかい。","그럴까?"],["아빠","あぁ。ほれ、早くその辺に隠れてろ。","어. 자, 빨리 그 근처에 숨어 있거라."],["쿠","うん。",""],["아빠","もっと下だ。","더 아래야."],["쿠","父ちゃん、今夜はなんだか変な感じの夜だよ。気を付けろ。","아빠, 오늘 밤은 왠지 이상한 느낌이 드는 밤이야. 조심해."],["아빠","分ってる。今夜はやけに皿が乾く。","알고 있어. 오늘 밤은 몹시 접시가 마르네."]],"r":[],"q":[["아빠 용을 본적이 있어?","父ちゃん、龍って見たことある？"],["용은 무서워?","龍っておっかねぇか？"],["으응, 부르면 이걸 가지고 와.","あぁ、呼んだらこれを持って来い。"],["나 이런 거 받으면 뭐든지 말 들을 거야.","俺、こんなんもらえたら、何だって言う事聞くな。"],["아빠, 오늘 밤은 왠지 이상한 느낌이 드는 밤이야. 조심해.","父ちゃん、今夜はなんだか変な感じの夜だよ。気を付けろ。"]]},{"no":2,"title":"갓파의 부탁","summary":"갓파가 기다리고 있던 인물이 등장하고, 그에게 부탁을 하는데...","kw":[["酔うた","취했다","酔った"],["作れん","만들 수 없다","作れない"],["疑われるやもしれん","의심 받을지도 모른다","疑われるかもしれない"],["たまがす","놀라게 하다","驚かす"],["ねがった","없었다","なかった"],["ちょっくら","조금, 잠깐","ちょっと"],["とこ","곳, 장소","ところ"],["頂けねぇでしょうか","〜해줄 수 없을까요?","頂けないでしょうか"],["できねぇ","할 수 없다","できない"],["くだせぇ","주세요","ください"]],"s":[["시미즈","いやぁ〜良い心持ちに酔うた。","이야~ 기분 좋게 취했다."],["남자","お引き留めして、申し訳ありませんでした。","만류해서 죄송했습니다."],["시미즈","何、こちらこそ長居した。","뭘, 나야말로 오래 머물러 있었지."],["남자","何をおっしゃいます。またいつでもお越し下さい。","무슨 말씀을하십니까. 또 언제든 오십시오."],["시미즈","そう度々とは金は作れんぞ。","그렇게 매번 돈을 만들지는 못 할거야."],["남자","いえ、決してそのようなつもりでは。","아니, 절대 그런 의미로 드린 말씀은..."],["시미즈","帳面を書き換えるのは容易だが、どこから疑われるやもしれんからな。","장부를 고쳐 쓰는 건 쉽지만, 어디서 의심을 받을지 모르니까 말야."],["시미즈","近頃は、上も何かとうるさい。","요 즘은 윗사람들도 시끄러워서."],["남자","ご用心を。","조심하세요."],["시미즈","バレない程度にやってはいるが、何しろ俺たちのやっているのは必要のない農地開拓だ。","들키지 않을 정도로 하고 있지만 아무튼 우리가 하고 있는 일은 필요 없는 농지개척이야."],["시미즈","百姓の懐ではなく、俺たちの懐を肥やしている。","농민 들의 주머 니가 아니라 우리들의 주머니를 챙기고 있지."],["남자","まったくで。","그러게 말입니다."],["아빠","おばんでやす。","좋은 밤입니다."],["아빠","あぁぁ、たまがすつもりはねがったです。勘弁してくだせぇ。","아... 놀라게 할 생각은 없었습니다. 용서해주세요."],["아빠","お手間は取らせません。ちょっくら話を聞いてくだせぇ。","번거롭게 해드리지 않겠습니다. 잠깐 얘기를 들어주십시오."],["아빠","実は、お役人様にお願いがございまして。","실은 나리께 부탁이 있어서 말입니다."],["시미즈","願い？どのような。","부탁? 어떤."],["아빠","へぇ。私は、竜神沼に住んでおる者でございます。","네. 저는 류징늪에 살고 있는 몸입니다."],["아빠","聞くところによると、この度、竜神沼を干拓し、田んぼにするお話が進んでいるとか。","얘기를 듣기로는 이번에 류징늦을 간척하고 논으로 만든다는 얘기가 진행이 되고 있다면서요."],["시미즈","ん。",""],["아빠","そのお話し、考え直しては頂けねぇでしょうか。","그 얘기, 다시 생각해주실 수 없을까요?"],["아빠","あの沼を奪われては、私共は生きていくことができねぇです。","저 늪을 뺏기면 우리는 살아갈 수가 없습니다."],["아빠","何卒、ご再考くだせぇ。","부디, 다시 생각해주십시오."],["시미즈","ふふ、妖怪風情が調子に乗りよって。","후후, 요괴 주제에 까불고 말이야."],["아빠","…これは失礼をお許しくだせぇ。","아, 아... 이건 실례를 용서해주십시오."]],"r":[],"q":[["만류해서 죄송했습니다.","お引き留めして、申し訳ありませんでした。"],["무슨 말씀을 하십니까. 또 언제든 오십시오.","何をおっしゃいます。またいつでもお越し下さい。"],["그렇게 매번 돈을 만들지는 못 할거야.","そう度々とは金は作れんぞ。"],["조심하세요.","ご用心を。"],["저 늪을 뺏기면 우리는 살아갈 수가 없습니다.","あの沼を奪われては、私共は生きていくことができねぇです。"]]},{"no":3,"title":"인간의 욕심","summary":"무사는 자신의 비리를 숨기고자 갑자기 무섭게 돌변한다.","kw":[["であろう","〜겠지, 〜겠죠","だろう"],["分かんねぇかった","몰랐다","分からなかった"],["やめねば","그만두지 않으면","やめなければ"],["くだせぇ","주세요","ください"],["あげっから","줄 테니까","あげるから"],["怒らねぇで","화내지 말고, 화내지 않고","怒らないで"],["いるやもしれません","있을지도 모른다","いるかもしれません"],["いねぇです","없어요","いないです"],["だけでやす","〜뿐입니다, 〜만입니다","だけです"]],"s":[["시미즈","おい、河童。貴様、俺たちの話を聞いておったであろう？","이봐, 갓파. 네놈 우리 얘기를 듣고 있었지?"],["아빠","ええ、何のお話かは分かんねぇかったですが、","네,무슨 이야기인지 모르겠습니다만,"],["아빠","何やら愉快そうにお話をされておりましたな。","뭔가 유쾌하게 이야기를 하고 계셨는데요."],["시미즈","嘘を申せ。","거짓말하지 마."],["시미즈","干拓をやめねば、聞いたことをお代官にでも訴えるか？い〜そうであろう？","개 척을 그만두지 않으면 들은 얘기를 대관에게 호소할 것인가? 그렇지!?"],["아빠","お待ちくだせぇ。何のお話で。私め、何にも聞いておりません。","잠깐만요. 무슨 얘기인지. 저 아무것도 듣지 않았습니다."],["시미즈","え〜い、白を切るな。主を脅すとは不埒千万。","어이, 시치미 떼지마. 무사를 위협하다니 괘씸하기 짝이 없군."],["쿠","堪忍して、堪忍して。","용서해주세요, 용서해주세요."],["아빠","バカ、来るな！","바보야,오지 마!"],["쿠","父ちゃん、これこれ、これ渡しなよ。","아빠 이거, 이거 줘."],["아빠","いいから、戻ってろ。","됐으니까 돌아가 있어."],["쿠","お侍様、この鯉あげっから怒らねぇで。父ちゃんを許してあげて。","무사님,이 잉어 줄 테니까 화 내지 말아줘. 아빠를 용서해줘."],["아빠","黙ってろ。","조용히 있어."],["남자","しみず様、ご油断なく、他にも仲間がいるやもしれません。","시미즈님, 방심하지 마시고 그 밖에도 무리들이 있을지 모릅니다."],["아빠","いねぇです。俺たちだけでやす。","없습니다. 우리 뿐입니다."],["남자","逃げましょう。今にも襲いかかって来ますぞ。","도망갑시다. 지금이라도 덤벼들러 올 겁니다."],["아빠","お役人様、お気をお静めくだせぇ。","나리, 마음을 진정시켜주십시오."]],"r":[],"q":[["잠깐만요.","お待ちくだせぇ。"],["저 아무것도 듣지 않았습니다.","私め、何にも聞いておりません。"],["아빠 이거, 이거 줘.","父ちゃん、これこれ、これ渡しなよ。"],["됐으니까 돌아가 있어.","いいから、戻ってろ。"],["아빠를 용서해줘.","父ちゃんを許してあげて。"]]},{"no":4,"title":"코이치와 친구들","summary":"여름방학을 맞이해 여행 계획에 대해 이야기 하는 코이치와 친구들.","kw":[["俺んち","우리 집","俺の家"],["決まってねぇ","정하지 않았다","決まってない"],["やべぇ","큰일났다","やばい"],["すぐじゃん","금방이잖아","すぐじゃない"],["行かねぇ","가지 않는다","行かない"],["知らねぇ","모른다","知らない"],["どこにあんの / 何があんの / 気があんの","〜있어?","〜あるの"],["行きゃあ","가면","行けば"],["ふざけんなよ","까불지 마","ふざけるなよ"],["ぜってぇ","절대","ぜったい"],["ありえねぇ","그럴 리 없다, 있을 수 없다","ありえない"]],"s":[["코이치","いいなぁ〜バリ島かよ。","좋겠다~ 발리라니."],["친구1","うちは北海道。","우리 집은 홋카이도."],["친구2","俺んちはお父さんの田舎。","우리 집은 아버지 시골(고향)."],["코이치","何だよ、家だけかよ。何も予定決まってねぇの。","뭐야, 우리 집 뿐이야? 아무것도 일정이 안 정해진 거."],["코이치","超やべぇ〜もう7月だぜ。夏休みなんてすぐじゃん。","대박 큰일났어~ 벌써 7월이야. 곧 있으면 방학이잖아."],["친구2","親の田舎とか行かねぇの？","부모님 시 골이라도 안 가냐?"],["코이치","家の親、どっちも埼玉だから、近すぎるって。","부모님은 둘 다 사이타마니까 너무 가깝다고..."],["친구1","よう、バリ島ってどこにあんの？","야, 발리는 어디에 있냐?"],["친구3","知らねぇ。南の方だろ。","몰라. 남쪽이겠지."],["코이치","何があんの？","뭐가 있냐?"],["친구3","え？海とか。","어? 바다라든지..."],["코이치","バカじゃん、もっと知ってろって。","바보 아냐~, 더 알고 있어야지."],["친구3","行きゃあ、分かるからいいんだよ、へへ。","가면 아니까 괜찮아, 하하. 코이치: ㄴ023~ 이자식~"],["친구3","ゲッ、菊池ウザッ！こうちゃん菊池に気があんの？","웩, 키쿠치 재수 없어! 코우짱 키쿠치한테 마음이 있냐?"],["코이치","ふざけんなよ、ぜってぇありえねぇ〜。","까불지 마, 절대 그럴 리 없어~!"],["친구3","じゃあなぁ〜","그럼안녕~"],["친구1","おっさき〜","먼저간다~"]],"r":[],"q":[["아무것도 일정이 안 정해진 거.","何も予定決まってねぇの。"],["곧 있으면 방학이잖아.","夏休みなんてすぐじゃん。"],["부모님 시골이라도 안 가냐?","親の田舎とか行かねぇの？"],["야, 발리는 어디에 있냐?","よう、バリ島ってどこにあんの？"],["까불지 마, 절대 그럴 리 없어~!","ふざけんなよ、ぜってぇありえねぇ〜。"]]},{"no":5,"title":"의문의 돌","summary":"자꾸 발에 돌이 걸려 넘어지자 화가 난 코이치는 파묻혀 있는 돌을 빼내는데...","kw":[["いってぇ","아프다","いたい（痛い）"],["すげぇ","대단하다, 엄청나다","すごい"],["何でもねぇ","아무것도 아니다","何でもない"],["あんなとこ","저(그)런 곳, 저(그)런 장소","あんなところ"],["いけねぇ","안 된다","いけない"],["だろ","〜겠지, 〜겠죠","でしょ"],["気取ってんなよ","잘난 척 하지 마","気取ってるなよ"]],"s":[["코이치","うわっ、いってぇ〜。あ〜あ。","우와~ 아파. 아..."],["코이치","亀？の化石すげぇ〜へぇ〜。","거북이?의화석?굉장하네~헤~"],["키쿠치","上原君、何それ？","우에하라, 그거 뭐야?"],["코이치","何でもねぇよ〜。","아무것도 아냐."],["키쿠치","上がれる？","올라올 수 있어?"],["키쿠치","大丈夫？怪我とか。","괜찮아? 다친 데는?"],["코이치","お前が、あんなとこ歩いてるからいけねぇんだろ。","너가 그런 데 걷고 있으니까 안 되는 거잖아."],["키쿠치","え？","에?"],["코이치","気取ってんなよ、ブース！","예쁜 척하지 마. 못 생긴 게!"],["히토미","あっ！お兄ちゃんだ。","아! 오빠다!"],["엄마","確かめて開けて。","확인하고 열어."],["히토미","どちら様ですか？","누구 십니까?"],["코이치","俺へ","나야~"],["히토미","あぁ〜お兄ちゃん汚して来たぁ〜","아~오빠더럽히고왔어~."],["엄마","えぇ〜康一！","뭐~ 코이치!"],["코이치","ちょっと転んじゃって。","좀 넘어져서..."],["엄마","もーう、やめてよね。ただでさえ、洗濯物が乾かなくて困ってるのに。","이제 그만해. 안 그래도 빨래가 안 말라서 고생하는데."],["엄마","これ以上汚れ物増やさないで。","더 이상 빨랫감 늘리지 말고."],["코이치","ん、このやろ…","웅, 이 자식..."],["엄마","分かった？","알겠어?"],["코이치","うん。",""],["엄마","うんじゃなくて。","응이 아니라."],["코이치","はい。","네."],["엄마","早く着替えな。","빨리 갈아 입어."],["코이치","へ〜い。","네~."]],"r":[],"q":[["아무것도 아냐.","何でもねぇよ〜。"],["너가 그런 데 걷고 있으니까 안 되는 거잖아.","お前が、あんなとこ歩いてるからいけねぇんだろ。"],["확인하고 열어.","確かめて開けて。"],["누구 십니까?","どちら様ですか？"],["빨리 갈아 입어.","早く着替えな。"]]},{"no":6,"title":"갓파의 부활","summary":"화석인 줄만 알았던 돌이 씻기면 씻길수록 수상하게 느껴지는데...","kw":[["何してるの","뭐 하고 있어?","何しているの"],["見てた","보고 있었다","見ていた"],["洗ってた","씻고 있었다","洗っていた"],["やってんの","하고 있어?","やってるの"],["邪魔すんだ","방해한다","邪魔するんだ"],["したろ","했잖아, 했지","しただろ"],["どっか","어딘가","どこか"]],"s":[["코이치","え？えぇ〜？","어? 어~??"],["히토미","何してるの〜？","뭐하고있어~?"],["코이치","お前には、関係ないだろ。あっち行ってろ。","너랑은 상관없잖아. 저쪽 가 있어."],["엄마","康一！何やってんの？","코이치! 뭐하는 거야?"],["코이치","え〜、え〜と。","아...그게..."],["엄마","ん〜、鍵なんかかけて。開けなさい。","음... 문 잠그고 말이야. 열어봐."],["코이치","別に何でもないよ。ちょっと変わった石を拾ったから、洗ってただけだよ。","딱히 아무것도 아니야. 좀 이상한 돌을 주워서 씻고 있었을 뿐이야."],["엄마","ん〜？ん〜なんで鍵なんかかけたのよ？","음? 음... 왜 문을 잠갔어?"],["코이치","だって、こいつが邪魔すんだもん。","왜냐면 얘가 방해한단 말이야."],["히토미","してないもん。","안 했는 걸."],["코이치","したろ！","했잖아!"],["히토미","見てただけだもん！","보고 있었을 뿐이야!"],["코이치","え？","에?"],["엄마","何、何？ねぇ、何これ？","뭐,뭐야? 얘, 이게 뭐야?"],["엄마","ちょっと、やだ、やだやだやだ！やややや〜！いやぁぁぁ〜！！！","잠깐, 싫어... 싫어 싫어 싫어~!!! 싫어!!!!"],["엄마","ねぇ、早く早く捨てて来てよ〜どっかへ。","자, 빨리 빨리 버리고 와~ 어딘가에."],["엄마","いやいやいや〜ねえ早く〜！","싫어싫어싫어~얘,빨리~!"],["코이치","あっ！ねぇ、これ河童じゃない？","아! 있잖아, 이거 갓파 아냐?"],["엄마","河童〜？","갓파~??"],["코이치","うん。",""]],"r":[],"q":[["뭐하는 거야?","何やってんの？"],["딱히 아무것도 아니야.","別に何でもないよ。"],["왜냐면 얘가 방해한단 말이야.","だって、こいつが邪魔すんだもん。"],["안 했는 걸.","してないもん。"],["자, 빨리 빨리 버리고 와~ 어딘가에.","ねぇ、早く早く捨てて来てよ〜どっかへ。"]]},{"no":8,"title":"우리들의 비밀","summary":"약해진 갓파를 돌보기로 결정한 코이치 가족.","kw":[["力の出る","힘이 나다, 기운이 나다","力が出る"],["あげなきゃ","줘야 한다","あげなければ(いけない)"],["で","그래서","それで"],["弱ってる","약해져 있다","弱っている"]],"s":[["아빠","康一！早く水に戻してやれ！","코이치,빨리물에넣어줘라!"],["코이치","あ、うん。","아,응."],["엄마","ねぇ、しゃべったわよ、今！","저기, 말했지 지금!"],["아빠","…頭の皿に水をかけてやれ。河童は、皿が乾くと弱るらしいからな。","아... 머리의 접시에 물을 뿌려줘. 갓파는 접시가 마르면 약해진다고 하니까."],["코이치","え？あれって本当なんだ。","어? 그게 정말이구나."],["아빠","ん？あぁ〜ほら早く！","응? 아~ 자, 빨리!"],["코이치","お前、しゃべれたんだ。","너 말할 줄 아는구나."],["아빠","何か、食べ物はあげたのか？","뭐 먹을 건 줬어?"],["코이치","うん、河童といえばきゅりかなぁって思って、きゅうりを。","응, 갓파라고 하면 오이가 아닌가 싶어서 오이를."],["코이치","食べたよ、少し。","먹었어, 조금."],["아빠","おいおい、虫じゃないんだぞ。もっと力の出るものをあげなきゃ。","야야, 벌레가 아니란 말이야. 더 기운이 나는 걸 줘야지."],["코이치","何を？","뭘?"],["아빠","え〜と…何か…え〜","음... 뭔가... 어..."],["엄마","お刺身とか食べるかな？","회 같은 거 먹을까?"],["히토미","ねぇ〜ねぇ！","저기~있잖아!"],["코이치","ほら！あ〜食べた！","자! 아~ 먹었어!"],["아빠","さすが、お母さん！","역시 엄마!"],["엄마","まぁね〜","뭐 그렇지."],["아빠","で、どうする？","그래서... 어떻게 해?"],["엄마","康一！あんた、ホントに責任持てる？","코이치! 너 정말 책임 질 수 있어?"],["코이치","うん！持つよ〜持つ持つ！","응! 책임 질 수 있어, 책임질게!"],["아빠","康一！家に河童がいることは、当分秘密にしよう。","코이치! 집에 갓파가 있는 건 당분간 비밀로 하자."],["코이치","え？なんで？","어?왜?"],["아빠","こんな状状態で、騒がれたら河童が可哀そうだろ。","이런 상태로 시끄러워지면 갓파가 불쌍하잖아."],["코이치","うーん。",""],["히토미","ねぇ〜飼うの〜？","있지, 키울 거야?"],["엄마","お兄ちゃんがね、飼いたいんだって。","오빠가 말야, 키우고 싶대."],["히토미","えぇ〜","에~"],["아빠","こんなに弱ってるんだ、助けてあげようよ。","이렇게 약해졌는데, 도와주자."],["여자1","ちょっと〜","잠깐~"],["여자2","マジうざいんですけど。","진짜 재수 없는데..."],["여자1","いなくなれよ。","사라져라."]],"r":[],"q":[["저기, 말했지 지금!","ねぇ、しゃべったわよ、今！"],["더 기운이 나는 걸 줘야지.","もっと力の出るものをあげなきゃ。"],["그래서... 어떻게 해?","で、どうする？"],["오빠가 말야, 키우고 싶대.","お兄ちゃんがね、飼いたいんだって。"],["이렇게 약해졌는데, 도와주자.","こんなに弱ってるんだ、助けてあげようよ。"]]},{"no":9,"title":"쿠의 과거","summary":"조금씩 건강을 되찾는 쿠가 밝힌 그의 과거는...","kw":[["あんやろ","저(그) 자식, 저(그) 녀석","あのやろう"],["ありがとうごぜぇやす","감사합니다","ありがとうございます"],["近くけぇ","근처인가","近くか"],["んで","그래서","それで"],["落っこちて","떨어져서","落ちて"],["そりゃ","그것은","それは"],["呼んでた","부르고 있었다","呼んでいた"],["生きてた","살아 있었다","生きていた"]],"s":[["엄마","も〜う、まったくあんやろ〜夕べあんなに言ったのに。","어우, 정말 그 녀석~ 어젯밤에 그렇게 말했는데."],["엄마","入るよ。ご飯よ〜","들어 갈게. 밥이야~"],["엄마","ご飯よ。自分で食べられる？","밥이야. 혼자서 먹을 수 있어?"],["쿠","ありがとうごぜぇやす。","감사합니다."],["엄마","いいえーどういたしまして。","아니 요~ 천만에요."],["쿠","あの、ここはどこ？","저기... 여기는 어디?"],["엄마","何？","뭐?"],["쿠","くるめ川の近くけぇ？","쿠루메강 근처 인가?"],["아빠"," ],["쿠","マイマイか。","마이마이(달팽이)구나."],["히토미","でんでん虫！バ〜カ！","덴덴무시~ 바보~!"],["엄마","バカじゃないでしょ！マイマイとも言うのよー","바보가 아니지~ '마이마이'라고도 하는 거야."],["히토미","え、えぇ〜〜","에, 에~~~"],["히토미","うわぁ〜〜ダメ！食べた！でんでん虫食べた！","우와~ 안 돼! 먹었어! 덴덴무시 먹었어!"],["쿠","クゥに取って来たんじゃねぇのけぇ？人間は、マイマイ食わねぇのか？","쿠에게 잡아온 거 아니었어? 인간들은 마이마이 안 먹는 거야?"],["엄마","そりゃ、食べることもあるけど。","그건, 먹을 때도 있지만."],["엄마","えっ、生じゃ食べないわよ！ちゃんとお料理するの。エスカルゴっていう。","아, 생으로는 안 먹지. 제대로 요리를 하는 거야. '에스카르고'라고 하는."]],"r":[],"q":[["그건 말할 수 없어.","それは言えねぇ。"],["오랫동안 흙 속에 있던 탓에 진짜 이름을 잊어버렸다.","長えこと、土ん中いたせいで、ホントの名前忘れちまった。"],["결국 내가 돌봐주고 있잖아.","結局、あたしが面倒みてるじゃない。"],["식비도 만만치 않은데.","食費もバカんならないし"],["그건, 먹을 때도 있지만.","そりゃ、食べることもあるけど。"]]},{"no":12,"title":"바깥 여행","summary":"쿠는 코이치와 함께 바깥으로 나가게 되고, 너무나도 달라진 풍경에 놀라는데...","kw":[["うめぇ","맛있다","うまい"],["隠れてなきゃ","숨어 있어야 해","隠れていなければ"],["とこ","곳, 장소","ところ"],["埋まってたんだ","묻혀 있었다","埋まっていたんだ"],["呼んでる","부르고 있다","呼んでいる"],["行っちまった","가버렸다","行ってしまった"],["そりゃ","그것은","それは"],["暮らしてた","살고 있었다","暮らしていた"],["でっかい","크다","でかい"],["ここら","이 주변, 이 근처","この辺、この辺り"],["いねぇ","없다","いない"]],"s":[["엄마","しめじだってば…お家でカタツムリなんか出さないって。","버 섯이라니까~ 집에서 달팽이 같은 거 안 한다니까."],["아빠","けっこう旨いよ〜エスカルゴ。今度食べに行く〜？","꽤 맛있 어~ 에스카르고. 다음에 먹으러 갈래?"],["히토미","いやいやいやいやいや〜！","싫어 싫어 싫어~!!!"],["아빠","クウ！虫とか他にどんなの食べる？","쿠! 벌레라든지 그 밖에 어떤 거 먹어?"],["엄마","もーう、やめてよー","이제 그만해~"],["쿠","ゲンゴロウとか、たがめとか。トンボも結構うめぇよ。あと、みみずとか。","물방개라든지 물장군이라든지. 잠자리도 꽤 맛있어. 그리고 지렁이라든지."],["아빠","あっ。","아..."],["쿠","康一、何だこれ？","코이치, 뭐야 이거?"],["코이치","ダメだよ！ちゃんと隠れてなきゃ。","안 돼! 제대로 숨어 있어야지."],["코이치","これは自転車。乗り物だよ。顔出さないでよ！声もダメ。","이건 자전거. 탈 것이야. 얼굴 내밀지 마. 목소리도 안돼."],["쿠","康一、なんか来た！","코이치, 뭔가 왔어!"],["코이치","車だよ。","자동차야. 쿠 ; 572 우와~"],["코이치","あれも乗り物。何もしないよ。","저것도 탈 거야. 아무것도 안 해."],["코이치","ここがクゥを見つけたとこ。あの穴のとこに埋まってたんだ。","여기가 쿠를 발견했던 곳. 저 구멍이 있는 곳에 묻혀 있었어."],["쿠","これは、くるめ川か？","이건 쿠루메강이야?"],["코이치","うん。今は、くろめ川って呼んでるけど。","응. 지금은 쿠로메강이라고 부르고 있지만."],["쿠","ここが竜神沼と〜？何だ、この建物は？竜神沼はどこへ行っちまった！","여기가 류징늦이라고? 뭐야, 이 건물은? 류징늦은 어디로 가버린 거야!"],["코이치","声が大きいよ！場所はここなの？","목 소리가 커! 장소는 여기야?"],["쿠","ああ、ここで俺と父ちゃんは暮ら暮らしてた。","응, 여기서 나랑 아빠는 살고 있었어."],["코이치","ふ〜ん、埋められちゃったのかなぁ。この辺に沼なんてないもんな。","흐음... 묻혀버렸나...? 이 주변에 늦같은 건 없는데."],["코이치","あっ！クゥ！電車。あれあれ、でっかい乗り物。","아,쿠! 전철. 저거, 저거. 커다란 탈 것."],["코이치","この辺とかは、昔と大して変わらないんじゃない？","이 주변은 옛날이랑 크게 안 변하지 않았어?"],["쿠","出てもいいか？","나가도 될까?"],["코이치","ダメだよ！人来るし、家とかあるし。","안 돼. 사람도 오고 집도 있고."],["쿠","どこへ行っても、人だらけだなぁあ。","어디에 가도 사람 뿐이구나."],["코이치","そりゃ、いるよ。","그야 있지."],["쿠","ここらにはもういねぇなぁ。河童が。","이 주변에는 이제 없네... 갓파가."]],"r":[],"q":[["잠자리도 꽤 맛있어.","トンボも結構うめぇよ。"],["안 돼! 제대로 숨어 있어야지.","ダメだよ！ちゃんと隠れてなきゃ。"],["류징늦은 어디로 가버린 거야!","竜神沼はどこへ行っちまった！"],["응, 여기서 나랑 아빠는 살고 있었어.","ああ、ここで俺と父ちゃんは暮らしてた。"],["이 주변에는 이제 없네... 갓파가.","ここらにはもういねぇなぁ。河童が。"]]},{"no":13,"title":"쿠무룩","summary":"가족들의 관심을 한 몸에 받는 쿠에게 히토미는 질투가 나는데.","kw":[["経ってる","지났다","経っている"],["〜じゃん","〜잖아","〜じゃない"],["連れてった","데리고 갔다","連れていった"],["見られなかったろうな","보지 않았겠지","見られなかっただろうな"],["うっさい","시끄럽다","うるさい"],["何すんだよ","뭐 하는 거야","何するんだよ"],["何やってんの","뭐 하는 거야","何やってるの"]],"s":[["코이치","しょうがないじゃん。何百年も経ってるんだから。","어 수 없잖아. 몇 백년이나 지났으니까."],["쿠","俺は、どこへ行ったらいいだぁ…","나는 어디로 가면 좋은가..."],["코이치","家にいればいいじゃん。","우리 집에 있으면 되잖아."],["쿠","母ちゃんも人間に殺された。","엄마도 인간들이 축였어."],["코이치","俺、そんなことしないよ！家の家族だって。","나 그런 짓 하지 않아! 우리 집의 가족들도."],["코이치","ここにいれば、安心だからね！ホントだよ！","여기에 있으면 안심이라니까. 정말이야!"],["엄마","康一、ご飯！","코이치~ 밥이야!"],["코이치","食って元気出そうぜぇ〜あれ？お父さん、最近早いじゃん！","먹고 기운 내자~ 어? 아빠 요즘 빠르잖아?"],["아빠","お、おい！乱暴なことするな！","야,야! 난폭한 짓 하지 마."],["코이치","平気だよ。","아무렇지 않아."],["아빠","ほら、クゥ！椅子だよ。どうしたんだ、クゥは？具合でも悪いのか？","자, 쿠! 의자야. 무슨 일이야, 쿠는? 몸이 안 좋은 거야?"],["코이치","違うんだよ、今日ね、外に連れてったんだよ。","아니야. 오늘 밖에 데려갔었거든."],["아빠","誰にも見られなかったろうな？","아무도 보지 못했지?"],["코이치","54.大丈夫だと思うけど。","응, 괜찮을 것 같은데."],["아빠","思うじゃダメだろ！","같다...면 안 되지!"],["히토미","あぁ〜あたしの、あたしの〜！","아~ 내 거야, 내 거야~!"],["코이치","なんだよ、うっさいなぁ〜！","뭐야~ 시끄러~!"],["아빠","もう使ってないんだから、貸してあげようよ。","이제 안 쓰니까 빌려주자."],["히토미","ううん、いや！","아니, 싫어!"],["아빠","ひとみ！","히토미!"],["코이치","何すんだよ！","뭐하는 거야!"],["엄마","も〜う、、何やってんの？","참~ 뭐하는 거야?"],["히토미","いやあぁあーいやあー","싫어싫어~"]],"r":[],"q":[["우리 집에 있으면 되잖아.","家にいればいいじゃん。"],["야, 야! 난폭한 짓 하지 마.","お、おい！乱暴なことするな！"],["아무도 보지 못했지?","誰にも見られなかったろうな？"],["뭐하는 거야!","何すんだよ！"],["이제 안 쓰니까 빌려주자.","もう使ってないんだから、貸してあげようよ。"]]},{"no":14,"title":"작은 고추가 맵다","summary":"몸집이 작은 쿠에게 어마어마한 힘이 숨겨져 있었으니...","kw":[["〜けぇ","〜인가?, 〜냐?","〜かぁ"],["よえぇ","약하다","よわい"],["〜ねぇ","〜아니다, 〜없다","〜ない"],["いっちょ","하나, 한 번","ひとつ、いっかい"],["うっさい","시끄럽다","うるさい"],["強すぎんだよ","너무 강하거든","強すぎるんだよ"]],"s":[["코이치","どうした、クゥ？","왜 그래, 쿠?"],["쿠","相撲けえ？","씨름이구나."],["아빠","そうかぁ！相撲だと思ったんだな。河童は相撲が大好きなんだ。","그렇구나! 씨름이라고 생각했구나. 갓파는 씨름을 엄청 좋아하거든."],["코이치","あぁ〜本に書いてあったね。","아~ 책에 써 있었지."],["엄마","へえー","호오~"],["아빠","本当だったんだな。","진짜였구나."],["쿠","何だ！よえぇなぁ〜ひとみ。","뭐야~!약하구나~ 히토미."],["코이치","すごい！強いんだね、クゥ。","대단해! 강하구나, 쿠."],["쿠","大したことねぇよ。","대단한 게 아니야."],["아빠","驚いたなぁ〜こんな小さいのに。","놀 랐네~ 이렇게 작은데."],["코이치","次、俺とやろうよ！","다음에 나랑 하자!"],["쿠","やんべぇ！","하자!"],["엄마","ちょっと待った！","잠깐 기다려!"],["코이치","え？お母さん、やりたい？","에? 엄마 하고 싶어?"],["엄마","違うって。先にご飯。ほら〜ひとみも。","아니라니까. 먼저 밥. 자~ 히토미도."],["코이치","よし！食って力付けてからやんべ！","좋아! 먹고 힘을 키우고 나서 하자!"],["쿠","そうすんべ！","그렇게 하자!"],["코이치","よっしゃ！やるかあ！","좋았어! 할까!"],["쿠","やんべ！","하자!"],["엄마","気をつけてよー","조 심해~"],["아빠","よし！見合って〜はっきょ〜い、のこった！","자! 마주 보 고~ 준비, 시작!"],["코이치","えぇ〜ウソ！油断した。もう一回。","에~ 거짓말! 방심 했어. 한번 더."],["쿠","ええよ。","좋아."],["쿠","どうした、康一！もういっちょ！","어떻게 된 거야, 코이치. 한번 더."],["코이치","参った…","졌다..."],["히토미","ダメ！お兄ちゃんのバカ！","안돼! 오빠 바보!"],["코이치","うっさいなあぁあーしょうがないだろ。クウが強すぎんだよ。","시끄러워~ 어쩔 수 없잖아. 쿠가 너무 강하다구."]],"r":[],"q":[["대단한 게 아니야.","大したことねぇよ。"],["놀랐네~ 이렇게 작은데.","驚いたなぁ〜こんな小さいのに。"],["에~ 거짓말! 방심 했어. 한번 더.","ええーウソ！油断した。もう一回。"],["시끄러워~ 어찔 수 없잖아.","うっさいなあぁあーしょうがないだろ。"],["쿠가 너무 강하다구.","クウが強すぎんだよ。"]]},{"no":15,"title":"술주정","summary":"씨름에서 이긴 쿠에게 아빠가 선물로 준 것은...?","kw":[["よくねぇ","좋지 않다","よくない"],["すんな","하지 마","するな"],["やられんぞ","당한다","やられるぞ"],["うめぇ","맛있다","うまい"],["こりゃ","이것은","これは"],["〜てんの","〜고 있어, 〜고 있니?","〜てるの"]],"s":[["히토미","う〜ん、ね〜え、お父さ〜ん！","우웅~아빠~!"],["아빠","よし！やるか！","좋아, 할까! 엄마 : ?/0~? 할 거야?"],["코이치","見合って〜、はっきょ〜い、のこった！","마주보고~,준비,시작!"],["쿠","力任せはよくねぇよ。","힘만 믿고 하는 건 좋지 않아."],["아빠","いや〜参った。強いなぁ〜クゥ。","이야~졌다.강하구나~쿠."],["코이치","ありえないよね。","말도 안돼."],["히토미","次！お母さん！","다음! 엄마!"],["엄마","え？無理無理！","에? 무리야, 무리."],["코이치","もうクウに意地悪すんなよ。またやられんぞ！","이제 쿠 괴롭히지 마! 또 당한다!."],["히토미","ふん！","흥!"],["쿠","それ、うめぇのか？","그거 맛있나?"],["아빠","あぁへ旨いよ。勝ったお祝いに、ちょっと飲ませてやるよ。","아~ 맛있어. 이긴 선물로 조금 마시게 해줄게."],["엄마","ちょっとやめて〜","좀 하지 마."],["아빠","じゃあ、お皿に少しだけかけてやるよ。","그럼 접시에 조금 뿌려 줄게."],["쿠","おお。","오~"],["아빠","はい、おめでとお…。","자, 축하해~"],["쿠","おぉ〜こりゃ活きがいい水だなぁ〜","오~ 이건 싱싱한 좋은 물이구나~"],["쿠","ふえぇ〜なんだか良いこんころもちだ〜","흐아~ 뭔가 좋은 기분이야."],["아빠","…お皿からアルコールがまわったみたいだ。","아... 접시로부터 취기가 돌았나 봐."],["엄마","えぇ〜","에~??"],["코이치","うわぁ〜真っ赤だ！","우와~ 새빨개!"],["엄마","あ〜あ、ほら見なさい！","아~아,거봐!"],["아빠","いや、でもまさか。","아니~ 근데 설마."],["쿠","竜神様にお願い申す。","류징님에게 부탁 말씀드린다."],["코이치","酔ってんの？","취한 거야?"],["쿠","お皿が乾くぞ雨降らせ〜","접시가마른다비를내리게하고~"],["쿠","よいよいこらさ〜へっへらへ〜ピッチョンピッチョン、ザァザァザァ〜ポタポタポッタン、ゾンゾロゲ〜","찰박찰박, 싸아-"],["쿠","踊りだす〜ピッチョンピッチョン、ザァザァザァ〜ポタポタポッタ…","춤 추기 시작한다~ 찰박찰박 싸-"],["코이치","クウ！","쿠!"],["엄마","大変！","큰일이야!"],["아빠","水、氷も！","물, 얼음도!"],["코이치","クウ、大丈夫？","쿠, 괜찮아?"]],"r":[],"q":[["힘만 믿고 하는 건 좋지 않아.","277任せはよくねぇよ。"],["이제 쿠 괴롭히지 마!","もうクウゥに意地悪すんなよ。"],["이긴 선물로 조금 마시게 해줄게.","勝ったお祝いに、ちょっと飲ませてやるよ。"],["아~ 아, 거봐!","あーあ、ほら見なさい！"],["취한 거야?","酔ってんの？"]]},{"no":16,"title":"텔레파시","summary":"누 군가의 도움으로 쿠는 밖으로 나가는 것에 성공하게 되는데...","kw":[["開かねぇ","열리지 않다","開かない"],["おめぇ","너","おまえ"],["〜もん","사람","〜者"],["ありがてぇ","감사하다, 고맙다","ありがたい"],["変わってん","특이하다","変わってる"],["見つからねぇ","들키지 않다","見つからない"],["外せねぇ","풀 수 없다","外せない"],["そうでもねぇ","그렇지도 않다","そうでもない"],["食わして","먹이고, 먹여서","食わせて"]],"s":[["옷상","押すだけじゃ開かねぇよ。","밀기만해선 열리지 않아."],["옷상","俺の言う通りやってみな。","내가 말하는 대로 해봐."],["옷상","よお。","어이."],["쿠","おめぇ様だったのか。","너 였구나."],["옷상","声を出すな。家のもんに気づかれる。おめぇも頭ん中でしゃべれ。","목 소리를 내지 마. 집주인한데 들켜. 너도 머릿속으로 말해."],["쿠","俺まだ使えないよ。","나 아직 사용할 수 없어."],["옷상","やってみろ。","해봐."],["쿠","聞こえるかい？","들려?"],["옷상","あぁあ。","어."],["쿠","ホントけぇ？","정말이야?"],["옷상","ああぁあ。ちゃんと聞こえる。","어,제대로 들려."],["쿠","俺たちの仲間には、こういう力のあるもんが多かったけど。","우리 무리에는 이런 힘이 있는 애들이 많았는데,"],["쿠","俺はまだ使えなかったんだ。長えこと土ん中いたせいかもな。","나는 아직 할 수 없었거든. 오랫동안 흙 속에 있었기 때문일지도."],["쿠","でも、犬にも使えるもんがいるとは知らなかっただ。","근데 개들 중에도 쓸 줄 아는 애가 있을 줄은 몰랐어."],["옷상","たまにいるのさ。この力のこと家のもんには言うなよ。","가끔 있는 거야. 이 능력을 집주인한테는 말하지 마라."],["쿠","うん、分かったよ。いい雨だなぁ。ありがてぇな。","응, 알겠어. 좋은 비구나. 감사하네."],["옷상","おめぇ、雨が好きなのか？変わってんな。","너 비를 좋아하는 거야? 특이하네."],["쿠","俺、ちょっとその辺歩いてくるよ。","나 잠깐 그 주변 걷다 올게."],["옷상","人間に見つからねぇよう、気を付けるんだぜ。","인 간에게 들키지 않게 조심해야 돼."],["쿠","うん。おめぇ様も行くかい？それ外して。","응. 너도 갈래? 그거 풀고."],["옷상","いや、この家のもんに義理があってな。これは外せねぇんだ。","아니, 이집 사람들한테 의리가 있어서 말이야. 이건 풀 수 없거든."],["쿠","不自由なことだね。","불편하겠다."],["옷상","そうでもねぇさ。これのおかげで、飯を食わしてもらってる。野良よりはましさ。","그렇지도 않아. 이것 덕분에 밥을 먹여주고 있어. 들개보다 나아."],["쿠","ふーん。",""],["옷상","おい、ちゃんと帰って来いよ。この家の連中は、そう悪い奴らじゃねぇ。","어이, 집에 잘 돌아와. 이 집 사람들은 그렇게 나쁜 놈들 아니야."],["쿠","うん。おめぇ様もいるしね。","응, 너도 있고."]],"r":[],"q":[["내가 말하는 대로 해봐.","俺の言う通りやってみな。"],["들려?","聞こえるかい？"],["감사하네.","ありがてぇな。"],["너 비를 좋아하는 거야? 특이하네.","おめぇ、雨が好きなのか？変わってんな。"],["나 잠깐 그 주변 걷다 올게.","俺、ちょっとその辺歩いてくるよ。"]]},{"no":18,"title":"마지막 희망","summary":"쿠는 코이치의 방에서 갓파에 대해 쓰여진 책자를 발견하게 된다.","kw":[["寄ってく","들렀다 가다","寄っていく"],["ほっとく","내버려두다","放っておく"],["知らねぇ","모른다","知らない"],["おけぇり","어서 와","おかえり"],["あっちぃ","덥다","あつい"],["たまんねぇ","참지 못하다","たまらない"],["すまねぇ","미안하다","すまない"],["書いてあんの","쓰여져 있니?","書いてあるの"],["会えん","만날 수 있다","会える"]],"s":[["친구1","帰ろう〜","집에가자~"],["친구2","どっか寄ってく？","어디 들렀다 갈래?"],["친구3","あっ、ごめーん！","아,미안~!"],["친구3","ウザッ。","재수 없어."],["친구2","菊池さん！怒った方がいいよ！","키쿠치! 화내는 게 좋겠어!"],["친구1","そうだよ！ほっとくと、調子に乗るよ！","그래! 내버려두면 더 까불 거야! 키쿠치: いい。 무도 ! 됐어, 괜찮아."],["친구2","なんで〜？","왜~?"],["친구1","暗いなあぁあー","어둡네."],["키쿠치","上原君！河童ってあの時に見つけたあれ？","우에하라! 갓파라니, 그 때 찾았던 그거?"],["코이치","知らねぇ。","몰라."],["키쿠치","守ってあげてね。","지켜줘."],["코이치","うっせぇんだよ！ブス！","시끄럽단 말이야~! 못 생긴 게!"],["코이치","よっ！","다녀왔어! 쿠 ; 1730! 어서 와!"],["코이치","2あっちぃ〜たまんねぇ〜","2층 덥다! 못 참겠다~"],["코이치","クウ！相撲取ろうぜ！","쿠 우~씨름하자!"],["쿠","やんべぇ〜！","하자!"],["배우1","すっかり凍えてるじゃないか。","완전히 얼어 있잖아."],["배우2","私を許してくれるの？","나를 용서해 줄 거야?"],["엄마","あいつら〜もう！","저것들이~ 증말!"],["쿠","それ！","그거야!"],["엄마","やかましい！2階で相撲取らないでって言ったでしょ！","시끄러워!2층에서 씨름하지 말라고 했잖아!"],["코이치","ごめん、なさい。","미안... 합니다. 쿠 ; 3490 미안."],["엄마","まったく〜いいとこだったのに。","참~ 한창 좋을 때였는데."],["쿠","そうだ、康一！あれ読んでくれ。","참, 코이치! 그거 읽어줘라."],["쿠","これ河童だんべ。河童のことが書いてあんのか？","이거 갓파야. 갓파에 대해 써져 있는 거야?"],["코이치","ホントだ！どこだろ、ここ。","진 짜다! 어디지, 여기."],["코이치","民話のふるさと遠野？河童に出会う旅？マジ？","민화의 고향 엔노? 갓파를 만나는 여행 するぞ。"]]},{"no":23,"title":"물 만난 고기","summary":"모처럼 깨끗한 강에서 마음껏 수영을 하는 코이치와 쿠.","kw":[["生きてる","살아 있다","生きている"],["持ってくりゃ","가져 오면","持ってくれば"],["冷たっ","차갑다","冷たい"],["みてぇ","〜같다","みたい"],["飲んじゃったろ","마셔버렸잖아","飲んでしまっただろ"],["あれくれぇ","저(그) 정도","あれくらい"],["おかしくねぇ","이상하지 않다","おかしくない"],["そっち","그 쪽","そちら"]],"s":[["코이치","おいおい、上がって来ないよ！ヤバいよ！ん？うぉっ！","어이, 어이. 안 올라와! 큰일 났네. 응? 우옷~!"],["쿠","あぁ〜生きてる魚はうめぇ〜！久しぶりに泳いでいい気持ちだ！川はいいなぁ〜康一！","아~ 살아 있는 물고기는 맛있다~! 오랜만에 수영해서 기분 좋다! 강은 좋구나~코이치!"],["코이치","うん。",""],["쿠","康一も一緒に泳ぐべ！泳ぐべよ〜！","코이치도 같이 수영하자! 수영하자~!"],["쿠","ほれ〜早く来〜い！","자~빨리와라~!"],["코이치","水着持ってくりゃよかった。ひい！冷たっ！","수영복 가지고 오면 좋았을 걸. 히익~ 차가워!"],["쿠","なんだなんだ！娘っ子みてぇだぞ！","뭐야, 뭐야. 여자아이 같아~."],["쿠","どうだ？河童の屁泳ぎは？","어때? 갓파의 방귀 수영은?"],["코이치","水飲んじゃったろ〜！","물 마셔 버렸잖아~!"],["코이치","クウの泳ぎ超すごいよ〜あり得ないよ！","쿠 수영은 진짜 대박이야~ 말도 안돼!"],["쿠","河童なら、だれでもあれくれぇ泳げるよ。","갓파라면 누구나 그 정도 수영할 수 있어."],["코이치","へぇ〜河童すごい！マジ感動！","헤에~ 갓파 대단해! 진짜 감동이야!"],["코이치","いないねぇ。","없네..."],["쿠","河童がいても、おかしくねぇ川なんだけど。","갓파가 있어도 이상하지 않은 강인데."],["코이치","他にも何か所か教えてもらったから、明日はそっちへ行ってみようよ。","그 밖에도 몇 군데 가르쳐줬으니까 내일은 그쪽으로 가보자."],["쿠","あぁあ。",""]],"r":[],"q":[["오랜만에 수영해서 기분 좋다!","夏久しぶりに泳いでいい気持ちだ！"],["수영복 가지고 오면 좋았을 걸.","水着持ってくりゃよかった。"],["물 마셔 버렸잖아~!","水飲んじゃったろ〜！"],["쿠 수영은 진짜 대박이야~ 말도 안돼!","クウの泳ぎ超すごいよ〜あり得ないよ！"],["그 밖에도 몇 군데 가르쳐줬으니까 내일은 그쪽으로 가보자.","他にも何か所か教えてもらったから、明日はそっちへ行ってみようよ。"]]},{"no":24,"title":"혼자서도 잘해요","summary":"혼자서 먼 곳까지 여행을 온 코이치는 칭찬을 받아 쑥스럽기만 하다.","kw":[["知ってる","알고 있다","知っている"],["住んでる","살고 있다","住んでいる"],["言われてる","말을 듣는다","言われている"],["おっかながらねぇ","무서워하지 않는다","おっかながらない"],["曲がってる","꺾여 있다","曲がっている"],["しっかりしてる","야무지다","しっかりしている"],["大したもん","대단한 거, 대단한 일","大したもの"]],"s":[["주인","この家は、江戸時代の終わり頃に建てられた曲り屋なんでやす。","이 집은 에도시대 끝날 무렵에 세워진 전통 가옥이거든요."],["코이치","へぇ〜曲り屋ですか。立派なものですねぇ〜","헤에~ 전통 가옥이군요. 훌륭한 건물이네 요~"],["주인","東京の子はしゃべることが違うな。","도쿄에 사는 아이는 말하는 게 다르네. 코이치: 조그! いや、そんなことないです。"],["주인","僕なんか全然。とんでもないですよ。","에? 아뇨, 그렇지 않아요. 나 같은 애는 전혀. 어림도 없어요."],["주인","いや、家なんか東京って言っても、周りは畑だらけで全然田舎なんですよ。","아니, 집이 도쿄라고 해도 주변은 밭뿐이고 완전 시골이거든요."],["주인","はい、こちらでやんす。","자, 이쪽이요."],["주인","座敷童って知ってるべか？","자시키와라시를 알고 있니?"],["코이치","はい、なんとなく。妖怪みたいなのですよね？","네,뭐 대충. 요괴 같은 거 맞죠?"],["주인","家には、座敷童が住んでると言われてるんだよ。","우리 집에는 자시키와라시가 살고 있다고 말을 듣거든."],["코이치","えっ？","에?"],["주인","もし座敷童を見ても、おっかながらねぇでほしいのさ。","만약 자시키와라시를 봐도 무서워하지 말아줬으면 해."],["주인","座敷童はその家に富をもたらすいい神様だから。","자시키와라시는 그 집에 부를 가져다 주는 좋은 신이니까. 코이치: 조 ~6... あの! どの辺が曲がってるんですか? 曲り屋って! 그... 저기! 어느 쪽이 꺾여 있는 거예요? 인 집이라니."],["손님1","東京から、一人で？","도쿄에서 혼자?"],["손님2","東京の子はしっかりしてるわねぇ〜","도쿄 아이들은 야무지네."],["코이치","いいえ、大したことないです。","아뇨. 대단한 게 아니에요."],["손님1","いやいや、大したもんだ。","아냐 아냐, 대단한 거야."],["손님2","大したもんよ！","대단한 거지."],["코이치","いや、僕なんか全然。","아뇨, 저 같은 애는 전혀."],["손님1","食べっぷりもいい〜","먹는 모습도 좋네."],["손님2","いいわ〜","좋네~"]],"r":[],"q":[["어림도 없어요.","とんでもないですよ。"],["우리 집에는 자시키와라시가 살고 있다고 말을 듣거든.","家には、座敷音が住んでると言われてるんだよ。"],["어느 쪽이 꺾여 있는 거예요?","どの辺が曲がってるんですか？"],["도쿄 아이들은 야무지네.","東京の子はしっかりしてるわねぇ〜"],["아냐 아냐, 대단한 거야.","いやいや、大したもんだ。"]]},{"no":26,"title":"따끔따끔한 추억","summary":"집으로 돌아가기 전, 코이치가 쿠를 데리고 간 곳은...?","kw":[["住んでたとこ","살고 있던 곳","住んでいたところ"],["でっけぇ","크다","でっかい"],["しょっぺぇ","짜다","しょっぱい"],["何言ってんだよ","무슨 소리 하는 거야","何言ってるんだよ"],["食べてる","먹고 있다","食べている"],["そだな","그렇네, 그래","そうだな"],["もっかい","한 번 더","もういっかい"],["してくっか","하고 올까","してくるか"]],"s":[["쿠","なぁ康一。帰るべぇよ。","응? 코이치. 돌아가자."],["코이치","夕方の新幹線なんだ。それまで無理。","저녁 신칸센이거든. 그 때까지 무리."],["코이치","ねぇ、クウは今まで住んでたとこから離れたことある？","있잖아, 쿠는 지금까지 살던 곳에서 떠난 적이 있어?"],["쿠","いや、これが初めてだ。","아니, 이게 처음이야."],["코이치","よし！","좋았어!"],["쿠","康一！どこへ行くんだ？","코이치, 어디로 가는 거야?"],["코이치","な、いいから、いいから。","응, 일단 따라와."],["쿠","康一！乱暴にするな。","코이치, 난폭하게 굴지 마."],["쿠","こりゃ…たまげた。なんてでっけぇ池だ。","이건... 놀랐어. 어찜 이렇게 연못이 크지."],["코이치","海だよ！","바다야."],["쿠","海？","바다?"],["코이치","泳いでくれば？","수영하고 오지 그래?"],["쿠","お、おお。","오,응."],["쿠","水！水、早く！水！","물,물 빨리! 물!"],["쿠","あぁ〜ひりひりする。なんてしょっぺぇ水だ。こんな水には魚はいねぇだろうな。","아~ 따끔따끔해. 어쩌면 이렇게 물이 짜냐. 이런 물에는 물고기는 없겠네."],["코이치","い〜っぱいいるよ！","많~이있어."],["쿠","へぇ〜？さぞや、しょっぺえ魚なんだろうな。","헤에~? 틀림없이 짠 물고기겠구나."],["코이치","何言ってんだよ〜。クゥがいつも食べてるのは、海で取れた魚だよ。","무슨 소리야~ 쿠가 맨날 먹고 있는 건 바다에서 잡힌 물고기야."],["쿠","ふえぇ〜！","에에~~~!"],["코이치","あのさ、帰ったらさ、またどっかへ河童を探しに行こうよ！","있잖아, 돌아가면 또 어딘가에 갓파를 찾으러 가자."],["쿠","そだな。","그래."],["쿠","もっかいひりひりしてくっか！","한번 더 따끔따끔하고 올까!"]],"r":[],"q":[["있잖아, 쿠는 지금까지 살던 곳에서 떠난 적이 있어?","ねぇ、クウは今まで住んでたとこから離れたことある？"],["수영하고 오지 그래?","泳いでくれば？"],["아~ 따끔따끔해.","ああひりひりする。"],["있잖아, 돌아가면 또 어딘가에 갓파를 찾으러 가자.","あのさ、帰ったらさ、またどっかへ河童を探しに行こうよ！"],["한번 더 따끔따끔하고 올까!","もっかいひりひりしてくっか！"]]},{"no":27,"title":"유명인사","summary":"여행에서 돌아온 코이치와 쿠는 집 앞에서 기자들을 마주치게 되는데...","kw":[["これじゃねぇか","이거 아니야?","これじゃないか"],["何やってんだ","뭐 하는 거야?","何やっているんだ"],["張ってた","진치고 있었다, 자리잡고 있었다","張っていた"],["言ってる","말하고 있다","言っている"],["どっち","어느 쪽","どちら"]],"s":[["기자1","ちょっと、君！","잠깐, 너!"],["코이치","えっつっ？",""],["기자1","上原康一君？こういう者ですが。","우에하라 코이 치군...? 이런 사람인데."],["코이치","ああ！","아!"],["기자1","河童のことで、話が聞きたいんだけど。","갓파에대해서, 얘기가 듣고 싶은데."],["기자1","ちょっとだけ。","조금만."],["기자2","おい、これじゃねぇかがか？","어이, 이거 아니야?"],["기자1","ごめんよー","미안하다~"],["기자1","撮れ！","찍어!"],["코이치","ああへ！","아~!"],["기자1","何やってんだ！","뭐하는 거야!"],["기자2","俺じゃねぇ！こいつが何か。","나 아니야! 이 자식이 뭔가."],["엄마","どうした？","무슨 일이야?"],["코이치","写真撮られた！","사진 찍혔어. 엄마 ： 20? 쿠~?"],["코이치","昼間来たのよ、写真誌の人たちが。きっと張ってたのね。","낮에 왔었거든, 사진 잡지사 사람들이. 분명 진 치고 있던거야."],["아빠","だから、載せないでほしいって言ってるでしょ！","그러니까 심지 않았으면 좋겠다고 말하잖아요!"],["코이치","クウの泳ぎ、超すごいよ！","쿠의수영 엄청 대단해. 엄마 ： 스초^~ㅇ 헤에."],["코이치","イルカみたいにジャンプできるんだ！","돌고래처럼 점프할 수 있어!"],["엄마","ええぇえー？！","에~?"],["코이치","ホントだって！な？クウ！","정 말이라니까! 맞지? 쿠."],["쿠","イルカって何だ？","돌고래가 뭐야?"],["히토미","さーかへな！バーカ！","물~고~기. 바~보!"],["엄마","コラっ！","어허!"],["코이치","どっちがバカだ！イルカは動物なんです。バーカ！","누가 바보냐! 돌고래는 동물이거 든 요. 바~보!"],["엄마","康一も！","코이치도!"],["히토미","嘘つき！イルカはお魚だよ！ねぇへお母さん？！","거짓말쟁이! 돌고래는 물고기야. 그치~ 엄마?"],["엄마","イルカは動物なのよ…。","돌고래는 동물이야."],["히토미","えっ？あ、あ、あああ…","에? 아,아,아..."],["엄마","今度、ちゃんと教えてあげるから。","다음에 제대로 가르쳐줄 테니까."],["코이치","とにかくホントすごいんだって、クウゥウ！おならで泳ぐんだよ…。","아무튼 정말 대단하다니까, 쿠! 방귀로 수영한다니까!"],["엄마","ええペーリリリリ","에~!!!"]],"r":[],"q":[["이런 사람인데.","こういう者ですが。"],["어이, 이거 아니야?","おい、これじゃねぇか？"],["그러니까 싣지 않았으면 좋겠다고 말하잖아요!","だから、載せないでほしいって言ってるでしょ！"],["돌고래처럼 점프할 수 있어!","イルカみたいにジャンプできるんだ！"],["다음에 제대로 가르쳐줄 테니까.","今度、ちゃんと教えてあげるから。"]]},{"no":28,"title":"알다가도 모를","summary":"사진을 찍히게 되어 잡지에 쿠가 실리기 일보 직전이지만...","kw":[["盛り上がってんだ","신이 나 있다","盛り上がっているんだ"],["載っちゃう","실려 버리다","載ってしまう"],["知られちゃう","알려져 버리다","知られてしまう"],["食っちまった","먹어 버렸다","食べてしまった"],["仲良くしねぇ","친하게 지내지 않는다","仲良くしない"],["めんどくせぇ","귀찮다","めんどくさい"],["分かってる","알고 있다","分かっている"],["なげぇこと","오랜 시간, 오랫동안","ながいこと"]],"s":[["아빠","は〜ぁ。何盛り上がってんだよ〜こんな時に！","하야... 뭘 신이 나 있는거야~ 이럴 때에!"],["엄마","クウがおならで泳ぐんだって！","쿠가 방귀로 수영한대."],["아빠","は〜ぁ？おいおい！クゥが雑誌に載っちゃうんだぞ！日本中に知られちゃうの！","하? 이봐! 쿠가 잡지에 실린다니까! 일본 전국에 알려지는 거야!"],["엄마","私たちに当たらないでよ〜ちゃんと今後の事、考えてよね！","우리한테 화풀이하지 마. 제대로 앞으로 어떻게 할지 생각해줘!"],["쿠","そうだ。瞳にみやげがあるんだ。","맞다. 히토미에게 선물이 있어."],["코이치","え？","에?"],["쿠","海で拾ったんだ。きれいな石だんべ？","바다에서 주웠어. 예쁜 돌이지?"],["쿠","この前、マイマイを食っちまったお詫びだ。","지난번 마이마이를 먹어버린 사과의 의미야."],["엄마","あら、きれいね。","어머~ 예쁘네."],["엄마","瞳、ありがとうは？","히토미, 고맙다는 말은?"],["코이치","あれって、ガラスだよね。","저거 유리 맞지?"],["엄마","ごめんね、ありがとう。","미안하고 고마워."],["쿠","いいだよ。","괜찮아."],["옷상","色気づいたか。よっしゃ。","여자한테 관심이 생겼나? 좋아!"],["옷상","おい、何だよ。せっかく気を利かせてやったのによ。","야, 뭐야. 모처럼 신경 써줬는데..."],["옷상","チェッ。ガキだなぁ…","칫, 아직 애구나."],["옷상","ま、康一もまだまだってことよ。","뭐, 코이치도 아직 멀었다는 거지."],["쿠","何で康一はその子と仲良くしねぇのかな。","왜 코이 치는 그 아이와 친하게 안 지낼까?"],["옷상","人間は何かとめんどくせぇ生き物なのさ。","인 간은 이래저래 귀찮은 생물인 거야."],["쿠","おめぇ様は人間のことがよく分かってるんだね。","너는 인간에 대해서 잘 알고 있구나."],["옷상","まぁな、人間となげぇこと暮らしてるからな。","뭐, 인간이랑 오랫동안 살고 있으니까."],["쿠","人間は時々おっかねぇことをする。","인 간은 가끔 무서운 짓을 해."],["옷상","そうだな。","그렇네."]],"r":[],"q":[["뭘 신이 나 있는거야~","何盛り上がってんだよー"],["우리한테 화풀이하지 마.","私たちに当たらないでよー"],["모처럼 신경 써줬는데...","せっかく気を利かせてやったのによ。"],["뭐, 코이치도 아직 멀었다는 거지.","ま、康一もまだまだってことよ。"],["인간은 이래저래 귀찮은 생물인 거야.","人間は何かとめんどくせぇ生き物なのさ。"]]},{"no":29,"title":"위기의 가족","summary":"쿠의 소문을 듣고 수많은 기자들이 코이 치네 집 앞에 모여든다.","kw":[["やなの","싫은 거야?","いやなの"],["なっちまって","되어 버려서","なってしまって"],["申し訳ねぇ","미안하다, 죄송하다, 면목 없다","申し訳ない"],["気にすんな","신경 쓰지 마","気にするな"],["光るもん","빛나는 것","光るもの"]],"s":[["엄마","やだ、老けて見える。髪型も変。まただ。","뭐야~ 늙어 보여. 머리 스타일도 이상해. 또야."],["엄마","はい、はい。","네,네."],["엄마","申し訳ありませんが、取材はお断りさせていただきます。失礼します","죄송합니다만, 취재는 거절하겠습니다. 실례하겠습니다."],["아빠","え〜せっかくおこしいただいたのに申し訳ないのですが…","그... 모처럼 와 주셨는데 죄송하지만..."],["기자","と言いますと？","라는 것은?"],["엄마","ほら、しっかり。","자, 정신 차리고."],["아빠","えーあのですね…本人が大変おびえておりまして、取材はお断りのさせていただきたいのですが。","그...그게 말이죠... 본인이 굉장히 무서워하고 있어서 취재는 거절하고 싶은데요."],["기자","本人って、河童のことですか。","본인이라니 갓파 말이에요?"],["아빠","失礼します。","실례하겠습니다."],["코이치","へへ、クウ、すごい人気じゃん。何でやなの、テレビ。","헤헷, 쿠, 엄청 인기 많은데. 왜 싫은 거야, 텔레비전이?"],["쿠","なんか、おっかねぇ…あの人たちや、あのでっけぇ目玉みてぇなのがおっかねぇよ。","뭔가 무서워... 저 사람들이나 저 커다란 눈알 같은 게 무서워."],["쿠","俺のせいでこんな大騒ぎになっちまって申し訳ねぇ…","나 때문에 이렇게 큰 소동이 되어버려서 죄송하네..."],["코이치","気にすんなって、結構面白いよ。","신경 쓰지 말라니까, 꽤 재미있어."],["코이치","あのさ、あの時のカメラ、ホントにクウが壊したの？","있잖아, 그 때 카메라 진짜 쿠가 망가뜨린 거야?"],["쿠","わかんね。俺はあの目玉とピカピカ光るもんに食いつかれるような心地がして、","모르겠어. 나는 그 눈알과 반짝거리는 것에 빠져 들 것 같은 느낌이 들어서"],["쿠","やたらおっかなかっただけだ。","몸시 무서웠던 것뿐이야."],["코이치","ふーん。ホントに超能力あったらカッコいいけどな。","흐음... 정말 초능력이 있으면 멋있겠지만."],["엄마","会社どうする？","회사 어떡해?"],["아빠","今日は休むよ。","오늘은 쉬게."],["코이치","何？","왜?"],["아빠","いや。","아니야."],["코이치","見ないの？","안 볼 거야?"],["엄마","見ない。んもぉ〜","안 봐. 어우 증말~"],["아빠","いいよ、出なくて。","됐어, 안 받아도."],["히토미","誰か来たよ。","누가 왔어."],["가족들","え？","어?"]],"r":[],"q":[["뭐야~ 늙어 보여. 머리 스타일도 이상해.","やだ、老けて見える。髪型も変。"],["나 때문에 이렇게 큰 소동이 되어버려서 죄송하네...","俺のせいでこんな大騒ぎになっちまって申し訳ねぇ…"],["신경 쓰지 말라니까, 꽤 재미있어.","気にすんなって、結構面白いよ。"],["안 볼 거야?","見ないの？"],["누가 왔어.","誰か来たよ。"]]},{"no":30,"title":"커져가는 의심","summary":"쿠에 대한 소문을 듣고 사람들은 몰려들지만, 모습을 보이지 않아 사람들의 의심은 커져간다.","kw":[["しょうがない","어쩔 수 없다","しようがない"],["てんだから","〜고 있으니까","ているんだから"],["すっごい","엄청","すごい"],["老けちまった","늙어버렸다","老けてしまった"],["分かんない","모르겠다","分からない"],["〜んじゃ","〜면","〜ければ"],["困ってんだ","곤란해 하고 있다","困っているんだ"],["迷惑はかけらんねぇ","폐는 끼칠 수 없다","迷惑はかけられない"]],"s":[["사람","あの家だ！","저 집이다!"],["리포터","河童ちゃんは、他にどんなものを召し上がりますか？","갓파는 그 밖에 어떤 걸 드십니까?"],["엄마","はい、きゅうりとか…","네... 오이라든지..."],["리포터","きゅうりです！河童と言えばきゅ010！あれは本当だったんですね〜","오이입니다! 갓파라고 하면 오이! 그 얘기는 정말이었군요."],["엄마","な〜んか、老けて見えるなぁ。","뭔~가 늙어 보이네..."],["코이치","しょうがないじゃん。老けてんだから。","어쩔 수 없잖아. 늙었으니까."],["코이치","いいよな〜お父さんとお母さんはテレビに出て。","좋겠다~ 아빠랑 엄마는 TV에 나와서."],["엄마","出たくて出てないわよ。すっごい恥ずかしかったんだから〜","나오고 싶어서 나온 게 아니야. 엄~청 부끄러웠다니까~"],["쿠","俺のせいだ。俺のせいで、ゆかりが老けちまった。","나 때문이야. 나 때문에 유카리(엄마)가 늙어버렸어."],["엄마","やだ、冗談よ。ほら、まだまだ若いでしょ？肌だって、つやつやでしょ？","뭐야~ 농담이야. 자 봐봐, 아직 젊지? 피부도 반들반들하지? 쿠 : 20? 쿠~?"],["엄마","何よ〜失礼ねー","뭐야~ 실례야."],["방송인","でも、何で姿を見せないんですかね。上原さんでしたっけ？","그런데 왜 모습을 보여주지 않는 걸까요? 우에하라씨였죠?"],["방송인","本当にあの家にいるのかどうかだって分かんないわけでしょ？","정말로 그 집에 있는지 어떤지도 모르는 거 잖아요?"],["방송인","これだけ話題になっても、姿が見えないんじゃ、そう簡単には信じられないでしょう。","이만큼 화제가 됐는데도 모습이 보이지 않으면 그렇게 쉽게 믿을 수는 없겠죠."],["방송인","何せ、河童ですよ、妖怪の。","어쨌든 요괴인 갓파니까요."],["아빠","テレビに出てくれとは言わないけど、うちのビデオで君を撮らせてもらえないか？","텔레비전에 나가 달라고는 안 하지만 우리 집 비디오로 너를 촬영하면 안될까?"],["쿠","やすお、困ってんだな。","야스오(아빠), 곤란해 하고 있구나."],["아빠","いや…","아니, 그게..."],["쿠","ええだよ。おめぇ様たちにこれ以上迷惑はかけらんねぇ。","좋아. 너희 들에게 더 이상 폐를 끼칠 수는 없어."],["아빠","そうか、ありがとう。","그렇구나, 고마워."]],"r":[],"q":[["어쩔 수 없잖아. 늙었으니까.","しょうがないじゃん。老けてんだから。"],["엄~청 부끄러 웠다니까~","すっごい恥ずかしかったんだから〜"],["그런데 왜 모습을 보여 주지 않는 걸까요?","でも、何で姿を見せないんですかね。"],["이만큼 화제가 됐는데도 모습이 보이지 않으면 그렇게 쉽게 믿을 수는 없겠죠.","これだけ話題になっても、姿が見えないんじゃ、そう簡単には信じられないでしょう。"],["야스오(아빠), 곤란해 하고 있구나.","やすお、困ってんだな。"]]},{"no":31,"title":"은혜 갚는 쿠","summary":"쿠의 존재에 확신이 생기자, 더욱 더 쿠를 원하는 사람들이 늘어나기 시작하는데...","kw":[["〜がってる","〜(해)하고 있다","〜がっている"],["わけにはいかねぇ","할 수는 없다","わけにはいかない"]],"s":[["아빠","クウ、ちょっと頭下げてくれる？","쿠,조금 머리 숙여 줄래? 쿠 : ㄴ217? 이렇게?"],["아빠","そうそう、これがお皿です。背中も見せてくれる？背中には甲羅があります。","그래그래, 이것이 접시입니다. 등도 보여 줄래? 등에는 등딱지가 있습니다."],["쿠","今更珍しくもなかんべよ。","이제 와서 신기하지도 않아."],["아빠","手広げて。手には水かきがあります。","손 펴봐. 손에는 물갈퀴가 있습니다."],["사회자","はい、河童は実在しました。どうですか、川上さん。","네, 갓파는 실제로 존재했습니다. 어떠세요? 카와카미씨."],["카와카미","驚きですね。まさに河童としか言いようがない生き物です。","놀랍네요. 틀림 없이 갓파라고 밖에 할 수 없는 생물이네요."],["카와카미","ますます、実際にこの目で見て確かめたくなりました。","더더욱 실제로 이 눈으로 보고 확인하고 싶어 졌어요."],["아빠","じゃ、行ってくる。","그럼 갔다 올게."],["엄마","気をつけて。","조심하고."],["아빠","すみません！通してください！","죄송합니다. 지나가게 해주세요!"],["사람1","上原さん〜クウちゃん主演で映画撮らせてください！","우에하라씨~! 쿠 주연으로 영화 찍게 해주세 요~!"],["사람2","CMにぜひ！","CF에 꼭!"],["사람3","ドラマの企画書です！","드라마 기획서입니다!"],["사람4","写真集出しませんか！","사진집 내지 않겠습니까?"],["사람5","せーの、クゥちゃん〜こっち見て〜クゥちゃん〜","시~작, 쿠~ 이쪽 봐~ 쿠~!"],["경찰","ご近所の方の迷惑になります。大きな声は出さないでください！","이웃 분들에게 민폐가 됩니다. 큰 소리는 내지 마세요!"],["사람6","うるさいのはそっちだ！","시끄러운 건 그쪽이야!"],["상사1","でね、提供する番組に、クウちゃんと君たち一家に出てもらえないかと言うんだ。","그래서 말이야, 협찬하는 방송에 쿠와 너희 집 식구들이 출연해줄 수 없냐고 하더라고."],["상사2","あそこはうちの大切な取引先だからな。何とか頼むよ。","거기는 우리 소중한 거래처니까 말이야. 어떻게든 부탁할게."],["아빠","はぁ…","하아..."],["쿠","ええだよ。","좋아."],["아빠","ホントかい？","정말이야?"],["쿠","おめぇ様たちには大きな借りがある。いつまでもおっかながってるわけにはいかねぇよ。","너희들에게는 큰 빚이 있어. 언제까지나 무서워하고 있을 수는 없어."],["코이치","やった！テレビだ！イエー！","앗싸~! 텔레비 전이다! 오예~!"]],"r":[],"q":[["네, 갓파는 실제로 존재했습니다.","はい、河童は実在しました。"],["더더욱 실제로 이 눈으로 보고 확인하고 싶어 졌어요.","ますます、実際にこの目で見て確かめたくなりました。"],["이웃 분들에게 민폐가 됩니다. 큰 소리는 내지 마세요!","ご近所の方の迷惑になります。大きな声は出さないでください！"],["어떻게든 부탁할게.","何とか頼むよ。"],["언제까지나 무서워하고 있을 수는 없어.","いつまでもおっかながってるわけにはいかねぇよ。"]]},{"no":32,"title":"진정한 친구","summary":"쿠로 인해 친구들과 멀어진 코이치에게 다가와준 친구는...","kw":[["〜すんの","〜하는 거야","〜するの"],["出らんなくて","나가(오)지 못해서","出られなくて"],["あんまり","별로, 그다지","あまり"]],"s":[["엄마","いい？何聞かれても無視すんのよ。","알 겠지? 뭘 물어봐도 무시하는 거야."],["코이치","うん。",""],["엄마","すみません、子供が出ます！撮らないでください！いいよ。","최송합니다. 아이가 나갑니다! 찍지 마세요. 됐어."],["엄마","道を空けてください！","길을 비켜주세요!"],["기자1","康一君、クゥちゃん元気？","코이치군! 쿠는 잘 지내?"],["기자2","ちょっと話聞かせてよ。","잠깐 얘기 들려줘."],["기자3","待ってよ、康一君。","잠깐만, 코이치군."],["코이치","よっ！いやーまいったよ。家出らんなくて。","야! 아니~ 참 힘들었어. 집을 나올 수가 없어서."],["학생","屁の河童！","방귀 갓파!"],["키쿠치","上原君。","우에하라."],["코이치","え？あ…","어? 아..."],["키쿠치","この前のワンちゃんの名前、おっさんだよね。","지난 번 강아지 이름 옷상이었지?"],["코이치","おお。","어."],["키쿠치","一年か二年の頃、上原君ちに行った時に会ったよ。","1학년 인가 2학년 때 우에하라 집에 갔을 때 만났어."],["코이치","ああ〜","아~"],["키쿠치","何で、おっさん？","왜 옷상이야?"],["코이치","拾った時、何となく顔がおっさんだったから。","주웠을 때 왠지 얼굴이 옷상(아저씨) 같았으니까."],["키쿠치","どっか行った？旅行とか。","어디 갔어? 여행이라든지."],["코이치","ああ、遠野。","아, 토오노."],["키쿠치","え？じゃ、花巻は行った？","에? 그럼 하나마키는 갔어?"],["코이치","いや、乗り換えただけ。","아니 갈아타기만 했어."],["키쿠치","そお…","그래..."],["코이치","花巻が何？","하나마키가왜?"],["키쿠치","宮沢賢治の故郷。","미야자와 켄지의 고향."],["코이치","ふ〜ん。好きなの？宮沢賢治。","흐응~, 좋아해? 미야자와 켄지."],["키쿠치","うん、好き。","응, 좋아해."],["코이치","え？ヘー","어?헤에~."],["키쿠치","読んだことない？","읽은 적 없어?"],["코이치","いやーあんまり。","아니~ 별로."]],"r":[],"q":[["알겠지? 뭘 물어봐도 무시하는 거야.","いい？何聞かれても無視すんのよ。"],["아니~ 참 힘들었어. 집을 나올 수가 없어서.","いやーまいったよ。家出らんなくて。"],["주웠을 때 왠지 얼굴이 옷상(아저씨) 같았으니까.","拾った時、何となく顔がおっさんだったから。"],["아니 갈아타기 만 했어.","いや、乗り換えただけ。"],["아니~ 별로.","いやーあんまり。"]]},{"no":33,"title":"사람은 변해","summary":"쿠는 TV 출연을 앞두고 들떠 있는 코이치가 낯설게만 느껴지는데...","kw":[["行けねぇ","갈 수 없다","行けない"],["連れてって","데려가서, 데려가 줘","連れていって"],["おねげぇ","부탁","おねがい"],["すっげぇ","굉장하다, 엄청나다","すっごい"]],"s":[["경찰","押さないでください！","밀지 마세요!"],["기자","今、クゥちゃんが出てきました！","지금 쿠가 나왔습니다."],["옷상","おい、おめぇ、大丈夫か？俺も一緒に行ってやる。そう頼め。","야,너 괜찮냐? 나도 같이 가 줄게. 그렇게 부탁해라."],["코이치","どうしたの？","무슨 일이야?"],["쿠","おっさんも一緒に連れて行けねぇか？","옷상도 같이 데려갈 수 없나?"],["코이치","え？","에?"],["아빠","おい、どうした？","어이, 무슨 일이야?"],["코이치","クウがおっさんも連れてって欲しいって。","쿠가 옷상도 데려갔으면 좋겠대."],["아빠","ええ？","에~?"],["쿠","おねげぇだよー","부탁이야~!"],["경찰","さがってください！","뒤로 물러나 주세요!"],["코이치","うわっ、こけた。すっげぇ〜。","우와, 넘어졌다. 굉장해!"],["코이치","そんな怖がるなって。大丈夫だよ。","그렇게 무서워하지 말라니까. 괜찮을 거야."],["쿠","康一、何か変だ。","코이치 뭔가 이상해."],["옷상","ああ、浮かれてやがる。人間は急に変わることがあるからな。","응, 들떠 있네. 인간은 갑자기 변하는 일이 있으니까 말이야."],["옷상","俺の前の飼い主がそうだった。","내 예전 주인이 그랬어."],["쿠","何があったんだい？","무슨 일이 있었던 거야?"],["옷상","子供の頃は仲が良かったんだぜ。二人でよく遊んだもんさ。","어렸을 때는 사이가 좋았단 말이야. 둘이서 잘 놀기도 했어."],["옷상","俺はあいつが大好きだったし、あいつも俺を可愛がってくれた。","나는 그녀 석을 엄청 좋아했고 그녀석도 나를 예뻐해줬어."],["옷상","ところが、あいつはそのうち、仲間からいじめられるようになった。","그런데 그녀 석은 점점 친구들한테 왕따 당하기 시작했어."],["옷상","何であいつがそんな目にあうのか、俺にはさっぱり分からなかった。悲しかったよ。","왜 그녀석이 그런 일을 당하는지 나는 전혀 몰랐어. 슬펐어."],["옷상","殴られるのも嫌だったし、そんなあいつを見るのも嫌だった。","맞는 것도 싫었고 그런 그녀석을 보는 것도 싫었어."],["옷상","俺は逃げた。走って走ってぶっ倒れてた所へ康一が来たんだ。","나는 도망쳤어. 뛰고 또 뛰다 푹 쓰러져 있던 곳에 코이치가 온거야."],["옷상","康一は子供の頃のあいつに似てた。","코이 치는 어렸을 때의 그녀석을 닮았었어."],["쿠","人間はなんで変わるんだろう。","인 간은 왜 변하는 걸까."],["옷상","なんでだろうな。","왜 그럴까."]],"r":[],"q":[["쿠가 옷상도 데려갔으면 좋겠대.","クゥウがおっさんも連れてって欲しいって。"],["우와, 넘어졌다. 굉장해!","うわっ、こけた。すっげぇへ…。"],["인간은 갑자기 변하는 일이 있으니까 말이야.","人間は急に変わることがあるからな。"],["어렸을 때의 그녀석을 닮았었어.","康一は子供の頃のあいつに似てた。"],["인간은 왜 변하는 걸까.","人間はなんで変わるんだろう。"]]},{"no":34,"title":"쿠, TV 출연!","summary":"코이치 가족과 쿠는 TV에 나오게 된다.","kw":[["っす","〜예요, 〜입니다","です"],["来ねぇ","오지 않다","来ない"],["上原んとこ","우에하라네","上原のところ"],["くせぇ","냄새나다","くさい（臭い）"]],"s":[["관계자","おはようございます。","안녕하세요."],["가족","おはようございます。","안녕하세요."],["관계자1","こちらへどうぞ。","이쪽으로 오세요."],["관계자1","じゃあ、お時間までお待ちください。","그럼 촬영 시간까지 기다려주세요."],["관계자2","では、後ほど。","그럼 이따 뵙겠습니다."],["관계자1","どうする？下半身。","어떻게 할래? 하반신."],["관계자2","丸出しはまずいっすよ。","노 출은 곤란해요."],["관계자1","まずいかな。","안되려나."],["관계자2","まずいっすよ、丸出しは。","곤란하죠, 노출은."],["강사1","子供たち、どうしたんだぁ？","아이 들은 어떻게 된 거냐?"],["강사2","あ、あれっすよ、上原んとこの河童ちゃんのテレビ。","아, 그거죠. 우에하라네 갓파 텔레비전."],["강사1","まじ？今日だっけ。こりゃ、今日は誰も来ねぇな。俺たちも見ようぜ。","진짜? 오늘이었나? 이건 오늘은 아무도 안 오겠네. 우리도 보자."],["강사2","そうっすね。","그렇네요."],["사회자1","さあ、それでは本日のスペシャルゲスト、河童のクゥちゃんに登場してもらいます。どうぞ！","자, 그러면 오늘의 스페셜 게스트 갓파 쿠 등장하겠습니다! 나오세요!"],["방청객1","かわいい！","귀여워!"],["방청객2","ほんと！","정말!"],["사회자1","はい、どうぞこちらへ。いや〜よくお越し下さいました。よろしくお願いいたします。","네,자, 이쪽으로. 이야~ 잘 오셨습니다. 잘 부탁드립니다."],["사회자2","よろしくお願いします。","잘 부탁합니다."],["시청자1","クゥちゃんだ！","쿠다!"],["시청자2","本当だね！","정말이네."],["시청자3","ロボットじゃねぇの？","로봇 아냐?"],["시청자4","え〜、本物だよ。","에~ 진짜야."],["시청자5","マジマジ。今出てるって。","진짜, 진짜야. 지금 나와 있다니까."],["아줌마","あの子…","저 아이... 아저씨: -ㅡㅜ72.... 천만엔..."],["주인","あの子でねか。","그 때 그 아이잖아?"],["연예인1","すっごい、感激〜。え、何？","대박이야~ 감격이야. 에, 뭐야?"],["쿠","なんかくせぇ。","뭔가 냄새 나."],["연예인1","え〜？","에~?"],["연예인2","香水だよ。","향수야."],["사회자1","クウちゃんは香水は苦手のようです。","쿠는 향수는 싫어하는 것 같습니다."],["연예인1","私、臭くないですから。","저 냄새 안 난다니까요."],["연예인2","どれどれ。","어디 어디."],["연예인1","いやー","싫어~"],["사회자2","さ、ここでゲストをお招きしたいと思います。","자, 여기서 게스트를 초대하려고 합니다."],["사회자2","民俗学の研究家で、河童は実在したという説を唱え続けてきた清水澄夫さんです。","민속학 연구가로, 갓파는 실제로 존재했다는 설을 계속 주장해 오신 시미즈 스미오씨 입니다."],["사회자","どうぞ。","나오세요."],["사회자2","どうぞ、こちらへ。","자, 이쪽으로 오세요."]],"r":[],"q":[["그럼 촬영 시간까지 기다려주세요.","じゃあ、お時間までお待ちください。"],["이건 오늘은 아무도 안 오겠네.","こりゃ、今日は誰も来ねぇな。"],["그렇네요.","そうっすね。"],["이야~ 잘 오셨습니다. 잘 부탁드립니다.","いや〜よくお越し下さいました。よろしくお願いいたします。"],["쿠는 향수는 싫어하는 것 같습니다.","クゥちゃんは香水は苦手のようです。"]]},{"no":35,"title":"원수는 외나무 다리에서","summary":"특별 게스트로 초대된 연구가를 보고 소스라치게 놀라는 쿠.","kw":[["見てぇ","보고 싶다","見たい"],["ってこと","〜란 거, 〜란 말","ということ"]],"s":[["사회자2","ようこそ。","잘 오셨습니다."],["시미즈","どうも。","반갑습니다."],["사회자2","このコーナーでは、河童という生き物の謎に迫りたいと思います。","이 코너에서는 갓파라는 생물의 수수께끼에 다가가보려고 합니다."],["사회자1","え、清水さんは長年、河童は実在した、という…","그, 시미즈씨는 오랫동안 갓파는 실제로 존재했다 라는..."],["옷상","おい、どうした。","야,무슨 일이야?"],["쿠","こいつ、俺の父ちゃんを殺した奴にそっくりだ。","이 녀석, 아빠를 죽인 놈이 랑 꼭 닮았어."],["옷상","何！？","뭐?"],["시미즈","いや〜感無量です。クゥちゃんにお礼を言いたいですね。","이야~감개무량합니다. 쿠에게 감사의 말을 하고 싶네요."],["사회자2","ご自分の説に自信はおありだったのですか？","자신의 설에 자신은 있으셨던 거예요? 시미즈: はい、我が家に代々伝わる 한 拠の品がありましたから。 네, 저희 집에 대대로 전해내려오는 증거품이 있었으니까요."],["사회자2","それは、どのような…","그건 어떤..."],["시미즈","河童の腕です。","갓파의 팔입니다."],["사회자1","河童の腕ですか？","갓파의 팔입니까?"],["시미즈","ええ。侍だったうちのご先祖が、いたずらものの河童を退治した時のものです。","네. 무사였던 조상님이 장난꾸러기였던 갓파를 퇴치했을 때의 것입니다."],["시미즈","これがそうなんですが…","이게 그 물건인데요..."],["시미즈","これが家にあったんで、僕はどうしても、河童が架空の妖怪とは思えなかったんです。","이게 집에 있어서 저는 아무래도 갓파가 상상 속의 요괴라고는 생각할 수 없었거든요."],["사회자1","清水さん、今からそれを見せていただけるんですか？","시미즈씨, 지금부터 그걸 보여주실 수 있는 건가요?"],["시미즈","ええ。クウちゃんは見たくないかもしれませんが…","네.쿠는 보고 싶지 않을 수도 있겠지만..."],["쿠","…見てぇだ。","...보고 싶어."],["쿠","父ちゃん…","아빠..."],["사회자1","え？その腕がお父さんの腕ってこと？","어? 그 팔이 아빠 팔이란 말이야?"],["시미즈","まさか、そんな…","설마 그럴 리가..."],["코이치","クゥ、ホントなの？それ、お父さんの腕なの？","쿠 정말이야? 그거 아빠 팔이야?"],["쿠","ホントだよお、父ちゃんの腕だよお。","정말이야, 아빠 팔이야."],["사회자1","なんでわかるんだい？","어떻게 알 수 있어?"],["쿠","分かるんだからしょうがねぇよぉ〜","알 수 있으니까 어 수 없잖아~."],["시미즈","そう言われても…いや、困ったな…ね、もういいかな？大切なものなんだ。","그렇게 말해도... 곤란하네... 얘, 이제 줄래? 소중한 거란 말이야."]],"r":[],"q":[["이야~감개무량합니다.","いや〜感無量です。"],["네, 저희 집에 대대로 전해내려오는 증거품이 있었으니까요.","はい、我が家に代々伝わる証拠の品がありましたから。"],["시미즈씨, 지금부터 그걸 보여주실 수 있는 건가요?","清水さん、今からそれを見せていただけるんですか？"],["...보고 싶어.","…見てぇだ。"],["어? 그 팔이 아빠 팔이란 말이야?","え？その腕がお父さんの腕ってこと？"]]},{"no":36,"title":"탈출","summary":"시미 즈가 보여준 갓파의 팔이 아빠의 팔이라는 것을 알고 쿠는 분노한다.","kw":[["〜なんかじゃねぇ","〜같은 게 아니다","〜なんかじゃない"],["の","〜이/가","が"]],"s":[["쿠","おめぇの先祖が父ちゃんを殺した！父ちゃんはいたずら者の河童なんかじゃねぇ。","너의 조상이 아빠를 죽였어! 아빠는 장난꾸러기 갓파 같은 게 아니야."],["쿠","魚捕りのうまい…優しい…立派な河童だ！","고기를 잘 잡는... 상냥한... 훌륭한 갓파야!"],["쿠","父ちゃんは俺たちの住んでいる竜神沼を田んぼにするのをやめてくれってお願いしただけなのに…","아빠는 우리가 살고 있는 류징늦을 논으로 개척하지 말아달라고 부탁했을 뿐인데..."],["쿠","おめぇの先祖はいきなり刀を抜いて父ちゃんを切った！","너의 조상이 갑자기 칼을 꺼내서 아빠를 베었어!"],["쿠","俺の大好きな父ちゃんを！","나의 사랑하는 아빠를...!"],["방청객1","ホンかな。","정말일까?"],["방청객2","偶然過ぎない？","너무 우연 같지 않아?"],["방청객3","あれってマジ？","그게 진짜야?"],["사회자1","清水さん、今のクウちゃんの言ったことは事実なんでしょうか？","시미즈씨, 지금 쿠가 말한 건 사실일까요?"],["시미즈","いや、それは…何せ江戸時代のことですから。","글쎄요, 그건... 어쨌든 에도시대 일이니까요."],["코이치","クウ。泣かないでよ。","쿠. 울지 마."],["쿠","やめろ！","하지 마!"],["관계자1","なになに？","뭐야 뭐야?"],["관계자2","おいおい、ちょっとやばくない？","야야, 큰일 아니야?"],["관계자3","CM行って！","CF 내보내!"],["관계자4","はい！","네!"],["사회자1","クウちゃん、落ち着こう。その腕をこっちへ…","쿠, 침착하자. 그 팔을 이쪽으로..."],["옷상","おい、何やってんだ！早くあいつを助けてやれ！くそっ！","야, 뭐하는 거야? 빨리 재를 도와주라고! 젠장!"],["스텝1","大丈夫、怖がらないで。","괜찮아, 무서워하지 마."],["스텝2","何もしないから。","아무것도 안 할테니까."],["옷상","乗れ！","타!"],["스텝3","待て！","기다려!"],["스텝4","に、逃げられました。ちょっと、オンエア中ですよ！","도, 도망갔어요! 잠깐만요, 방송 중이에 요~!"],["경비","え、河童と犬？おい、捕まえろ！","에, 갓파와개? 야, 잡아라!"]],"r":[],"q":[["아빠는 장난꾸러기 갓파 같은 게 아니야.","父ちゃんはいたずら者の河童なんかじゃねぇ。"],["고기를 잘 잡는... 상냥한... 훌륭한 갓파야!","魚捕りのうまい…優しい…立派な河童だ！"],["너무 우연 같지 않아?","偶然過ぎない？"],["시미즈씨, 지금 쿠가 말한 건 사실일까요?","清水さん、今のクウちゃんの言ったことは事実なんでしょうか？"],["야야, 큰일 아니야?","おいおい、ちょっとやばぱくない？"]]},{"no":37,"title":"안녕, 옷상","summary":"옷상의 도움으로 방송국에서 빠져나온 쿠.","kw":[["危ねぇ","위험하다","あぶない"],["やっべぇ","큰일이다","やばい"],["わりぃ","나쁘다, 미안하다","わるい（悪い）"],["こっから","여기서부터","ここから"],["殴られてりゃ","맞고 있었으면","殴られていれば"],["そうすりゃ","그렇게 하면","そうすれば"],["食っちまおう","먹어버리자","食ってしまおう"],["キモ","징그럽다","キモい"]],"s":[["옷상","どこへ行く？","어디로 갈래?"],["쿠","どっか、人間のいねぇ静かなとこ。","어딘가, 인간들이 없는 조용한 곳."],["옷상","よしっ！","좋았어!"],["사람들","おい、クウちゃんじゃん！","야, 쿠잖아!"],["옷상","なんだここは。どこもかしこも人と車だらけだぞ。","뭐야, 여기는. 여기도 저기도 사람과 자동차 뿐이야."],["사람","腕だ。うわっ、キモ…","팔이다. 으악, 징그러..."],["옷상","うるせぇな。","시끄럽네."],["옷상","ふ〜、危ねえ危ねえ、まったくおっかねぇとこだぜ。","휴~ 위험해, 위험해. 참 무서운 곳이구만."],["쿠","おっさん疲れたんべ？もういいよ〜","옷상,힘들지? 이제 됐어."],["옷상","なぁに、まだまだ。久々に走っていい気分だぜ。","뭐야~, 아직 팔팔해. 오랜만에 달려서 기분이 좋구만."],["사람1","おい、あれ河童じゃねぇ！？","야, 저거 갓파 아니야?"],["사람2","クウちゃんだ！","쿠다!"],["사람3","ああっ、クウちゃん！クウちゃんだ！","아아~쿠!쿠야~!"],["옷상","来んなよ。","오지 마라."],["남자","追っかけようぜ。","쫓아가자."],["남자","やっべぇ。","큰일이다."],["쿠","おっさん！","옷상!"],["옷상","おめぇ、大丈夫か？","너 괜찮냐?"],["쿠","うん。",""],["옷상","すまねぇ、へましちまって。わりいぃがこっからは一人で行ってくれ。","미안하다, 실수 해버려서. 미안하지만 여기서부터는 혼자서 가라."],["쿠","やだよ、起きてよ！","싫어, 일어나!"],["옷상","ああ、いてぇ、くそっ！","아아, 아파. 젠장!"],["쿠","俺のせいだ！俺のせいだよお！","나 때문이야. 나 때문인 거야!"],["옷상","あいつ、ちゃんと生きてるかな？あのまま殴られてりゃ良かったかな？","개는 잘 살고 있을까? 그대로 맞고 있었다면 좋았으려나?"],["옷상","そうすりゃ、あいつだって、少しは気が晴れて…","그랬으면 개도 조금은 기분이 풀려서..."],["옷상","また、あの頃みたいに…","또 다시 그 때처럼..."],["쿠","おっさん、おっさんよ〜！","옷상~옷상~!"],["까마귀1","お〜い、肉だ肉だ。はらわたが腐る前に食おうぜ。", 。","알겠어, 아빠. 아직 오지 말라고 하는 거지?"],["코이치","クウ！そこにいて！","쿠! 거기에 있어."],["코이치","もう、クウが怒るような事しないから！お願いだから、逃げないで！","이제 쿠가 화날 만한 짓은 안 할테니까. 부탁이니까 도망가지 마."],["구조대원","捕まって、さ。","잡아, 자."],["엄마","おっさんは、クウを助けたかったのね。","옷상은 쿠를 도와주고 싶었구나."],["아빠","俺たちができなかったことをやったんだ。","우리 들이 못 했던 것을 한 거야."],["앵커1","多くの方たちが龍を見たと証言しているのですが、","많은 분들이 용을 봤다고 증언하고 있습니다만,"],["앵커1","カメラやビデオにはまったく写っていませんでした。","카메라나 비디오에는 전혀 찍히지 않았습니다."],["앵커2","龍とクウちゃんの関係は不明ですが、クウちゃんの見せた不思議な力については、","용과 쿠의 관계는 알 수 없지만 쿠가 보였던 신기한 능력에 대해서는"],["앵커2","きちんと解明すべきだという声が高まっています。","제대로 해명해야 한다는 의견이 많아지고 있습니다."],["쿠","そうしたら、足をはらいながらひねるんだ。","그러면 다리를 후려치면서 비트는 거야."],["코이치","こう？なるほどね、よし、もういっちょ！","이렇게? 그렇구나. 좋아, 한번 더!"],["엄마","クウ、できたよ。","쿠, 다 됐어."],["쿠","あ、いいあんべえだ。","어,좋은 주머니다."],["코이치","いいじゃん。","좋네~"],["쿠","へへ、結構なもんもらっちまって。","헤헤, 좋은 걸 받아 버려서 어쩌나."],["엄마","いいって、そんな。","됐다니까,그런 말은."],["히토미","ひぃちゃんもほしい〜ほしい〜","히토미도갖고싶어~갖고싶어~"],["엄마","言うと思った！","그럴 줄 알았어."],["엄마","ほら、いつか、クウにもらったガラス、じゃなくて、石。これに入れときなさい。","자. 언젠가 쿠한테 받은 유리,가 아니라 돌. 여기에 넣어두렴."],["엄마","ひとみ！そこにもの入れるのやめて！","히토미! 거기에 물건 그만 넣어."],["히토미","はーーい。","네~"],["코이치","何やってんだよ。","뭐하는 거야."],["히토미","や〜い、お兄ちゃん仲間はずれ〜","에~이 , 오빠만 외톨이래요~"],["쿠","やーい！","야~이!"],["엄마","康一もなんかほしかった？","코이치도 뭔가 갖고 싶었어?"],["코이치","別に。","별로. 히토미: 、,[1&ㄴㄴ/672~8~! 아~ 갖고 싶구나~."],["코이치","うっせ！","시 끄러~!"]],"r":[],"q":[["쿠, 다 됐어.","クウ、できたよ。"],["헤헤, 좋은 걸 받아 버려서 어쩌나.","へへ、結構なもんもらっちまって。"],["그럴 줄 알았어.","言うと思った！"],["여기에 넣어두렴.","これに入れときなさい。"],["코이치도 뭔가 갖고 싶었어?","康一もなんかほしかった？"]]},{"no":40,"title":"평범한 일상","summary":"다시 일상으로 돌아온 코이치 가족과 쿠는 평범한 하루하루를 보낸다.","kw":[["〜てても","〜(하)고 있어도, 〜(해) 있어도","〜ていても"],["決めてない","정하지 않다, 정하지 않았다","決めていない"],["持ってく","가지고 가다","持っていく"],["〜たがってる","〜하고 싶어하다","〜たがっている"],["〜ちゃう","〜해 버리다","〜てしまう"]],"s":[["엄마","あのね、お父さんがね。もうこそこそしててもしょうがないから、","있잖아, 아빠가 말이야. 이제 숨어 있어도 소용이 없으니까,"],["엄마","今度の休み、みんなできれいな川にでも遊びに行こうって。","이번 쉬는 날에 다 같이 깨끗한 강이라도 놀러 가재."],["코이치","まじ！？やったぁ〜！やぁ〜！","진짜?앗싸~!"],["코이치","ね、どこ行くの？","그래서 어디 가?"],["엄마","まだ決めてないわよ。","아직 안 정했어."],["히토미","お弁当持ってく？","도시락 가져 가?"],["엄마","持ってくよ。","가져갈 거야."],["쿠","魚はとれるのか？","물고기는 잡힐까?"],["엄마","もちろん。","물론이지."],["코이치","テレビの人たちもついてくるだろうけど、かまわないって、お父さんが。","방송국 사람들도 따라오겠지만 상관 없대, 아빠가."],["키쿠치","楽しみだね。","기대 되겠네."],["키쿠치","今はみんながクウゥちゃんのこと、見たがってるけど、そのうち慣れちゃうよ、きっと。","지 금은 모두가 쿠를 보고 싶어하지만 조만간 익숙해질 거야, 꼭."],["키쿠치","そしたら、もっと普通に生活できるようになるんじゃない？","그러면 더 평범한 생활을 할 수 있게 되지 않겠어?"],["코이치","うん。俺も龍見たかったよ。それどころじゃなかったから、全然気付かなかったもんな。","나도 용 보고 싶었어. 그럴 여유가 없었으니까 전혀 몰랐거든."],["키쿠치","クウちゃんに頼めば？","쿠한테 부탁해보는 게 어때?"],["코이치","言ったんだよ、また呼んでって。","말했거든, 또 불러 달라고."],["코이치","そしたら、俺が呼んだんじゃねぇ。父ちゃんが呼んでくれたんだって。","그랬더니, 내가 부른 게 아니야. 아빠가 불러준 거야 라더라."],["코이치","本当かよって話だよな。","정말인가 싶은 얘기지."],["키쿠치","すごいね、クウちゃんとお父さん。","대단하네,쿠와아빠."],["코이치","え？あぁあ。","어? 아아..."]],"r":[],"q":[["이제 숨어 있어도 소용이 없으니까, 이번 쉬는 날에 다 같이 깨끗한 강이라도 놀러 가재.","もうこそこそしててもしょうがないから、今度の休み、みんなできれいな川にでも遊びに行こうって。"],["도시락 가져 가?","お弁当持ってく？"],["기대 되겠네.","楽しみだね。"],["쿠한테 부탁해보는 게 어때?","クウちゃんに頼めば？"],["정말인가 싶은 얘기지.","本当かよって話だよな。"]]},{"no":41,"title":"더 이상 못 참아!","summary":"코이치와 사이가 틀어진 친구들이 나타나 코이치와 키쿠치에게 험한 말을 하는데...","kw":[["〜かもしれねぇ","〜지도 모른다","〜かもしれない"],["こえぇ","무섭다","こわい（怖い）"]],"s":[["친구1","ヒューヒューラブラブじゃん、こうちゃん。","휘유~ 알콩달콩한데~ 코이치."],["친구2","仲良しクラブかよ。","친 목도모냐?"],["코이치","違うよ、そんなんじゃねぇよ。","아니야, 그런 게 아냐."],["친구3","よ！根暗のさちうすこと河童のあにき、お似合いだよ。","요! 음침한 사치우스코와 갓파 형 잘 어울리네."],["친구1","よう、こうちゃん。あの河童、超能力とか使って危ねえんじゃねぇの？","야~ 코이치. 그 갓파 초능력 같은 거 써서 위험한 거 아니야?"],["친구3","腕のミイラ抱いて泣いたりしてよ。見てて引いたよ。","미라 팔 안고 울기나 하고 말이야. 보면서 정 떨어졌어."],["코이치","だって、殺されたお父さんの腕なんだぞ。しょうがないだろ。","왜냐면 죽은 아빠의 팔이란 말이야. 어찔 수 없잖아."],["친구2","なんで分かんだよ。DNAとか調べたのかよ。","어떻게 알아. 유전자라도 검사 한 거냐?"],["친구들","そうだ、そうだ。","맞아, 맞아."],["코이치","クウには分かるんだよ。","쿠는 알 수 있는 거야."],["친구3","はあ？意味分かんねぇし。","뭐~? 무슨 말인지 모르겠어."],["친구1","河童菌でおかしくなったんじゃねえの？","갓파균 때문에 이상해 진 거 아니야?"],["코이치","なんだよ、河童菌って。","뭐야, 갓파균이라니."],["친구4","うちのお父さん言ってたぞ。","우리 아빠가 말했어."],["친구4","河童なんてエイリアンみたいなもんだから、変な病原菌とか持ってるかもしれねぇって。","갓파 따위 에일리언 같은 거니까 이상한 병균 같은 걸 갖고 있을 수도 있대."],["친구들","こえぇ〜！河童菌〜河童菌〜！","무서워~! 갓파균, 갓파균!"],["키쿠치","やめなさいよ！","그만해~!"],["친구3","さちうすこが怒った！","사치우스코가 화냈다!"],["친구4","何だよ、お前。生理か。お前んちのおやじ、浮気して家出てたんだって？","뭐야, 너. 그날이냐? 너네 집 아버지, 바람 나서 집 나갔다며?"],["키쿠치","何よ、関係ないでしょ！","뭐야, 상관 없잖아!"],["친구4","そしたらあれだって。お袋も？","그리고 그거라며. 어머 니도?"],["키쿠치","うるさい、ばか！やめろ！","시끄러워, 바보! 그만해."],["친구1","お〜パンツ丸見え！","오~ 속옷 보인다."],["친구4","何キレてんだ、バカ。お前も河童菌が移ったんじゃねぇの？な？","뭘 화내고 있냐, 바보. 너도 갓파균이옮은 거 아니야? 그치?"],["친구4","分かったよ、悪かったよ！","알겠어, 잘못했다고!"]],"r":[],"q":[["어떻게 알아.","なんで分かんだよ。"],["뭐~? 무슨 말인지 모르겠어.","はあ？意味分かんねぇし。"],["그만해~!","やめなさいよ！"],["뭐야, 상관 없잖아!","何よ、関係ないでしょ！"],["알겠어, 잘못했다고!","分かったよ、悪かったよ！"]]},{"no":42,"title":"변화의 조짐","summary":"겨우 친해진 키쿠치에게서 생각지도 못한 말을 듣게 되는 코이치.","kw":[["経ってる","지났다, 흘렀다","経っている"],["出てく","나가다","出ていく"]],"s":[["키쿠치","強いんだ。","강하구나."],["코이치","クウに教わったんだ。強いんだ、相撲。","쿠한테 배웠어. 씨름 잘하거든."],["키쿠치","そう。","그래."],["코이치","けんかなんて、初めてした。","싸움이라니처음해봤어."],["키쿠치","しないほうがいいよ。","안 하는 게 좋아."],["코이치","うん。",""],["키쿠치","ここって、あの時の場所だ。","여기는 그 때 그 장소다."],["코이치","え？","어?"],["키쿠치","この辺だったよね、クゥちゃん見つけたの。","이 주변이었지, 쿠를 발견한 곳."],["코이치","うん、たぶん。","응, 아마도."],["키쿠치","もうよく分からないね、跡。","이제 흔적을 잘 모르겠네."],["코이치","あれから結構経ってるからな。","그때부터 꽤 시간이 지났으니까."],["키쿠치","上原君、あのね。私、引っ越すの。","우에하라, 있잖아. 나 이사해."],["코이치","え？","어?"],["키쿠치","うちの親、別れることになって。お母さんの実家に行くの。","우리 부모님이 헤어지 게 되어서. 어머니 고향으로 가거든."],["코이치","うーん…","으음..."],["키쿠치","あさって引っ越しで、新学期からは向こうの学校に行くの。","모레 이사하고 새학기부터는 그쪽 학교에 가."],["코이치","そう。","그래."],["키쿠치","話してくれて、ありがとう…","얘기해줘서 고마워."],["코이치","おい、泣くなよ。","야,울지 마."],["코이치","色々あれだけど、頑張れよ。","여러가지 그렇겠지만, 힘내."],["코이치","じゃ、じゃ俺行くから。","그, 그럼 나 갈게."],["코이치","じゃな。菊池も早く帰れよ。","안녕. 키쿠치도 빨리 돌아가."],["코이치","え？","어?"],["엄마","だから、クウが出てくって言うのよ。","그러니까 쿠가 나간다고 한다니까."],["코이치","なんで？","왜?"],["엄마","なんか、手紙が来たのよ、クウに。それ見たら急に興奮して…","뭔가 편지가 왔거든, 쿠에게. 그거 보더니 갑자기 흥분해서..."],["쿠","康一！これ見てくれ！","코이치! 이거 봐 줘!"]],"r":[],"q":[["싸움이라니 처음 해봤어.","けんかなんて、初めてした。"],["그때부터 꽤 시간이 지났으니까.","あれから結構経ってるからな。"],["어머니 고향으로 가거든.","お母さんの実家に行くの。"],["여러가지 그렇겠지만, 힘내.","色々あれだけど、頑張れよ。"],["그러니까쿠가나간다고한다니까.","だから、クウが出てくって言うのよ。"]]},{"no":43,"title":"송별회","summary":"의 문의 편지를 받은 쿠는 코이치의 집을 떠나기로 결정하는데...","kw":[["ちゃう","〜해버리다","てしまう"],["てくれたろ","〜해 줬잖아","てくれただろう"]],"s":[["엄마","いたずらよね、これ。","장난이지? 이거."],["쿠","康一、それを書いたのは人間じゃねぇ。","코이치, 그걸 쓴 건 사람이 아니야."],["엄마","どう思う？どうした？なんかあった？","어떻게 생각해? 왜그래? 무슨 일 있었어?"],["코이치","ううん、別に。","아니, 딱히."],["엄마","なんで分かるの？誰かのいたずらだったらどうするのよ。","어떻게 알아? 누군가의 장난이면 어떡하려고."],["코이치","うん。","응."],["쿠","見れば分かるんだ。そうしたほうがいいってこともな。さっそく明日にでも行くだ。","보면 알아. 그렇게 하는 게 좋다는 것도. 당장 내일이라도 간다."],["코이치","明日？","내일?"],["엄마","そんなに急がなくても。ね。","그렇게 서두르지 않아도... 그치?"],["코이치","明日、川に行くはずだったじゃん。楽しみにしてたじゃん！","내일 강에 가기로 했잖아. 기대하고 있었잖아!"],["쿠","すまねぇだ。","미안하네."],["히토미","クウのバカ！早くどっかへ行っちゃえ！","쿠 바보! 빨리 어딘가로 가버려!"],["엄마","ひとみ！","히토미!"],["아빠","なんだか急にこんなことになってしまったが、クウが明日、旅立つことになった。","뭔가 갑자기 이렇게 돼 버렸지만, 쿠가 내일 떠나게 됐다."],["아빠","ささやかだけど、今夜は送別会だ。では、クウの前途を祝して。","조촐하지만 오늘 밤은 송별회다. 그럼 쿠의 앞날을 위하여."],["코이치","お父さん、なんで止めないの？なんでそんな簡単に出て行かせちゃうの？","아빠, 왜 안 말리는 거야? 왜 그렇게 쉽게 나가게 해버 리는 거야?"],["아빠","康一、お前が遠野の川でクウがどんなに生き生きしてたか話してくれたろ？","코이치, 너가 토오노 강에서 쿠가 얼마나 생기가 넘쳤는지 얘기해줬었지?"],["코이치","したけど…","했지만..."],["아빠","俺たちとクウは違うんだ。住むところも、生き方も。","우리 들과 쿠는 달라. 사는 곳도 사는 방법도."],["코이치","そういう場所に行けばいいじゃん。行くはずだったじゃん！","그런 장소에 가면 되잖아. 갈 예정이었잖아!"],["아빠","でも、毎日は行けない。クウはそういう所で毎日過ごしていたんだ。","하지만 매일은 못 가. 쿠는 그런 곳에서 매일 지냈었던 거야."],["아빠","今の暮らしはクウにとって自然じゃないんだよ。","지 금의 삶은 쿠에게는 자연스럽지 않은 거야."]],"r":[],"q":[["누군가의 장난이면 어떡하려고.","誰かのいたずらだったらどうするのよ。"],["그렇게 서두르지 않아도...","そんなに急がなくても。"],["왜 그렇게 쉽게 나가게 해버리는 거야?","なんでそんな簡単に出て行かせちゃうの？"],["코이치, 너가 토오노 강에서 쿠가 얼마나 생기가 넘쳤는지 얘기해줬었지?","康一、お前が遠野の川でクウがどんなに生き生きしてたか話してくれたろ？"],["갈 예정이었잖아!","行くはずだったじゃん！"]]},{"no":45,"title":"다음을 기약하며…","summary":"다음을 기약하며 코이치 가족은 쿠를 보내기로 한다.","kw":[["持ってって","가지고 가, 들고 가","持って行って"],["こっちこそ","이쪽이야말로, 저야말로","こちらこそ"]],"s":[["엄마","水と食べ物はこれで足りる？","물과 음식은 이걸로 충분해?"],["쿠","十分だ。","충분해."],["엄마","写真、持ってってね。","사진 가져가렴."],["엄마","昨日のも入ってるわ。","어제 것도 들어 있어."],["쿠","大事にするだ！","소중히 간직할게."],["아빠","よし、じゃそろそろ行こうか。","좋아, 그럼 슬슬 갈까?"],["쿠","お。行くべ。","어. 가자."],["히토미","ね、今度いつ来るの？","있잖아, 다음에 언제 와?"],["히토미","ね、今度いつ来るの？","있지, 다음에 언제 와?"],["엄마","ひとみ、クウはね。","히토미, 쿠는 말이야..."],["히토미","今度.…いつ…来るの…","다음에... 언제... 오는 거야..."],["쿠","ひとみ、泣くな。","히토미 울지 마."],["쿠","いつかはわかんねぇけど、俺はきっとまたおめぇたちに会いに来る。","언제인지는 모르지만 나는 꼭 다시 당신들을 만나러 올 거야."],["쿠","河童はうそはつか <div class="grid" style="margin-top:14px"><div class="card"><div class="badge" style="background:rgba(226,85,63,.13);width:38px;height:38px">🀄</div><div class="note" style="margin-top:8px">학습한 단어</div><b style="font-size:21px">124 / 1006</b></div><div class="card"><div class="badge" style="background:rgba(226,85,63,.13);width:38px;height:38px">🎧</div><div class="note" style="margin-top:8px">오늘 청해</div><b style="font-size:21px">2개</b></div></div>
<div class="sec"><b></b><h3>카테고리</h3><span>${CATS.length}개 메뉴</span></div>
<div class="shortcuts">${CATS.map((c,i)=>`<div class="sc" onclick="catTap(${i})"><div>${c[3]}</div>${c[1]}</div>`).join('')}<div class="sc" onclick="st.tab=1;render()"><div>▦</div>전체 보기</div></div>
<div class="feat row" onclick="push({p:'movies'})"><div class="badge" style="background:rgba(255,255,255,.2)">🎬</div><div style="flex:1"><div style="font-size:12px;opacity:.75;font-weight:800">NEW · 스크린 일본어</div><div style="font-size:17px;font-weight:800">영화 대사로 배우는 진짜 회화</div><div style="font-size:12.5px;opacity:.75">대사 듣기 · 해석 · 표현 · 퀴즈</div></div>›</div>
<div class="sec"><b></b><h3>내 페이스로 이어가기</h3></div>
${[['🎧','N4 청해 이어서 듣기','역에서 길 묻기','--sora'],['🔁','오늘의 단어 복습','12개 · 뜻·발음·듣기·한자 따로 복습','--yama'],['📖','하루의 일기','문장 듣기 · 단어 뜻 · 읽기 문제','--sakura']].map(a=>`<div class="card row" style="margin-bottom:10px"><div class="badge" style="background:color-mix(in srgb,var(${a[3]}) 13%,white)">${a[0]}</div><div style="flex:1"><b style="font-size:17px">${a[1]}</b><div class="note" style="margin:2px 0 0">${a[2]}</div></div>›</div>`).join('')}
</div>`}
function learn(){const g={};CATS.forEach((c,i)=>(g[c[0]]=g[c[0]]||[]).push([c,i]));return topBar('학습','오늘은 무엇을 공부할까요?')+`<div class="body">${Object.entries(g).map(([k,v])=>`<div class="sec"><b></b><h3>${k}</h3><span>${v.length}개</span></div><div class="grid">${v.map(([c,i])=>`<div class="tile" onclick="catTap(${i})">${c[5]?'<span class="new">NEW</span>':''}<div class="badge" style="width:42px;height:42px;background:color-mix(in srgb,var(${c[4]}) 13%,white)">${c[3]}</div><h4>${c[1]}</h4><p>${c[2]}</p></div>`).join('')}</div>`).join('')}</div>`}
function records(){return topBar('나의 기록','작은 공부가 쌓이는 곳')+`<div class="body"><div class="card"><b>이번 주 청해 기록</b><div class="row" style="justify-content:space-between;margin-top:14px">${'월화수목금토일'.split('').map((d,i)=>`<div style="text-align:center;color:var(--soft)">${d}<div style="width:30px;height:30px;border-radius:50%;margin-top:8px;background:${i<2?'var(--shu)':'#eee'};color:#fff;display:flex;align-items:center;justify-content:center">${i<2?'✓':''}</div></div>`).join('')}</div></div></div>`}
function movies(){const tot=DATA.reduce((s,m)=>s+m.lessons.length,0),dn=done.size;return topBar('스크린 일본어','영화 대사로 배우는 살아있는 회화',1)+`<div class="body">
<div class="hero" style="background:linear-gradient(135deg,#2B2D42,#4A3F6B)"><div class="big">🎬</div><div class="eb">🎬 SCREEN JAPANESE</div><h2>영화 속 한 장면,<br>그대로 따라 말해요</h2><p>${DATA.length}편 · ${tot}강 중 ${dn}강 완료</p><div class="bar"><i style="width:${dn/tot*100}%"></i></div></div>
<div class="sec"><b></b><h3>작품 선택</h3><span>대사 · 해석 · 표현 · 퀴즈</span></div>
${DATA.map((m,i)=>{const c=COLORS[m.volume];const d=m.lessons.filter(l=>done.has(m.id+l.no)).length;return `<div class="movie" style="background:linear-gradient(135deg,${c[0]},${c[1]});box-shadow:0 8px 18px ${c[1]}55" onclick="push({p:'lessons',m:${i}})"><div style="position:absolute;right:-10px;bottom:-30px;font-size:120px;opacity:.1">🎞</div><div class="row"><span class="pill">VOL.${m.volume}</span>${m.year?`<span class="pill">${m.year}</span>`:''}<span style="flex:1"></span><b>${m.lessons.length}강</b></div><div style="font-size:23px;font-weight:900;margin-top:14px">${m.title}</div><div style="opacity:.85;font-weight:600;font-size:14px">${m.ja_title}</div><div style="opacity:.85;font-size:13px;line-height:1.5;margin-top:8px">${m.description}</div><div class="row" style="margin-top:14px"><div class="bar" style="flex:1;margin:0;background:rgba(255,255,255,.25)"><i style="width:${d/m.lessons.length*100}%;background:#fff"></i></div><b style="font-size:12px">${d} / ${m.lessons.length}</b></div></div>`}).join('')}
<div class="note">강의 노트의 대사를 문자 인식으로 옮겨 정리했어요. 🔊 버튼은 일본어 음성으로 읽어 줍니다. (미리보기는 브라우저 음성 사용)</div></div>`}
function lessons(v){const m=DATA[v.m],c=COLORS[m.volume];return topBar(m.title,m.ja_title+' · '+m.lessons.length+'강',1)+`<div class="body">${m.lessons.map((l,j)=>{const dn=done.has(m.id+l.no);return `<div class="lesson" onclick="push({p:'lesson',m:${v.m},l:${j}})"><div class="num" style="background:${dn?c[0]:c[0]+'20'};color:${dn?'#fff':c[1]}">${dn?'✓':String(l.no).padStart(2,'0')}</div><div style="flex:1;min-width:0"><b style="font-size:16px">${l.title}</b><div style="font-size:12.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(l.summary)}</div></div>›</div>`}).join('')}</div>`}
function spk(text,id,col){const on=speaking===id;return `<button class="spk" style="background:${on?col:col+'1a'};color:${on?'#fff':col}" onclick="event.stopPropagation();speak(${esc(JSON.stringify(text))},'${id}')">${on?'〰':'🔊'}</button>`}
function lesson(v){const m=DATA[v.m],l=m.lessons[v.l],c=COLORS[m.volume],key=m.id+l.no;
let h=`<div class="top"><button class="back" onclick="pop()">←</button><h1 style="font-size:18px">#${String(l.no).padStart(2,'0')} ${l.title}<small>${m.title}</small></h1><button class="back" title="해석" onclick="korean=!korean;render()">${korean?'🈯':'🈳'}</button><button class="back" onclick="done.has('${key}')?done.delete('${key}'):done.add('${key}');render()" style="color:${done.has(key)?'var(--matcha)':''}">${done.has(key)?'✅':'☑️'}</button></div>
<div class="tabs">${['대본 '+l.s.length,'표현','퀴즈 '+l.q.length].map((t,i)=>`<button onclick="ltab=${i};render()" style="${ltab==i?`color:${c[1]};border-color:${c[0]}`:''}">${t}</button>`).join('')}</div><div class="body" style="padding-top:16px;--c1:${c[0]}">`;
if(ltab==0){h+=`<div class="hero" style="background:linear-gradient(135deg,${c[0]},${c[1]});border-radius:22px;padding:18px"><div class="eb" style="color:rgba(255,255,255,.7);letter-spacing:.5px">今日のあらすじ · 오늘의 줄거리</div><div style="margin-top:8px;font-weight:600;line-height:1.55">${esc(l.summary)}</div></div>`;
let prev=null;l.s.forEach((s,i)=>{const show=s[0]&&s[0]!==prev;prev=s[0];h+=`<div class="line ${speaking=='s'+i?'act':''}" style="${show&&i?'margin-top:12px':''}">${show?`<span class="chip" style="background:${c[1]}1f;color:${c[1]}">${esc(s[0])}</span>`:''}<div class="row" style="align-items:flex-start"><div style="flex:1;padding-top:4px"><div class="ja">${esc(s[1])}</div>${korean&&s[2]?`<div class="ko">${esc(s[2])}</div>`:''}</div>${spk(s[1],'s'+i,c[1])}</div></div>`})}
else if(ltab==1){const chk=l.kw.some(k=>k[2]);if(l.kw.length){h+=`<div class="sec" style="margin-top:0"><b></b><h3>${chk?'チェックポイント · 체크포인트':'今日のキーワード · 오늘의 키워드'}</h3><span>${l.kw.length}개</span></div><div class="card" style="padding:4px 0;cursor:default">${l.kw.map((k,i)=>`<div class="row" style="padding:8px 4px 8px 14px;${i?'border-top:1px solid var(--line)':''}"><div style="flex:1"><b style="font-size:17px">${esc(k[0])}</b>${k[2]?` <span style="color:var(--soft)">→</span> <b style="color:${c[1]}">${esc(k[2])}</b>`:''}<div class="ko" style="margin:0">${esc(k[1])}</div></div>${spk(k[0],'k'+i,c[1])}</div>`).join('')}</div>`}
if(l.r.length){h+=`<div class="sec"><b></b><h3>今日のおさらい · 오늘의 복습</h3><span>${l.r.length}개</span></div>`+l.r.map((r,i)=>`<div class="card" style="margin-bottom:10px;cursor:default"><div class="row"><span style="background:${c[0]}1f;color:${c[1]};font-weight:800;padding:4px 10px;border-radius:10px">${esc(r[0])}</span><span style="font-weight:600;font-size:14px">${esc(r[1])}</span></div>${r[2]?`<div class="row" style="margin-top:10px"><div style="flex:1"><div class="ja" style="font-size:16.5px">${esc(r[2])}</div><div class="ko">${esc(r[3])}</div></div>${spk(r[2],'r'+i,c[1])}</div>`:''}</div>`).join('')}}
else{h+=`<div class="card row" style="background:${c[0]}14;border-color:${c[0]}4d;cursor:default"><span style="font-size:20px">❓</span><div style="font-size:13.5px;line-height:1.5">다음 문장을 일본어로 말해 보세요.<br>떠올린 뒤 「정답」을 누르면 일본어와 발음이 나와요.</div></div>`;
l.q.forEach((q,i)=>{const op=revealed.has(i);h+=`<div class="card" style="margin-top:10px;cursor:default"><div class="row"><div class="qn" style="background:${c[1]}">${i+1}</div><b style="flex:1;font-size:16px;line-height:1.45">${esc(q[0])}</b><button class="tbtn" style="background:${op?'rgba(62,155,106,.15)':c[0]+'26'};color:${op?'var(--matcha)':c[1]}" onclick="revealed.add(${i});speak(${esc(JSON.stringify(q[1]))},'q${i}')">${op?'다시 듣기':'정답'}</button></div>${op?`<div class="ans"><span style="color:var(--matcha)">✓</span><b style="flex:1;font-size:18px;line-height:1.5">${esc(q[1])}</b>${spk(q[1],'q'+i,'#3E9B6A')}</div>`:''}</div>`});
h+=`<div class="row" style="margin-top:16px"><button class="btn" style="margin:0;background:#fff;color:var(--ink);border:1px solid var(--line)" onclick="revealed=new Set();render()">↻ 다시 풀기</button><button class="btn" style="margin:0;background:${done.has(key)?'var(--matcha)':c[1]}" onclick="done.add('${key}');render()">${done.has(key)?'✓ 완료함':'⚑ 학습 완료'}</button></div>`}
return h+'</div>'}
function render(){const sc=app.querySelector('.body')?.scrollTop;const v=st.stack[st.stack.length-1];let h;
if(!v)h=[today,learn,records][st.tab]();else h={movies,lessons,lesson}[v.p](v);
const same=app.dataset.k===JSON.stringify([st.tab,v,ltab]);app.innerHTML=h+nav();app.dataset.k=JSON.stringify([st.tab,v,ltab]);if(same&&sc)app.querySelector('.body').scrollTop=sc}
render();
</script></body></html>
