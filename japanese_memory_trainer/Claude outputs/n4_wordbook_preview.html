<div class="note"><h3 style="color:var(--ink)">N4 단어장 미리보기</h3>
실제 앱 화면을 HTML로 흉내 낸 미리보기예요. DAY 01의 실제 데이터(단어·한자 풀이·지문)와 원어민 녹음을 넣었어요.<br><br>
· <b>첫 화면</b>: 오늘의 학습(연속일·복습·새 단어 목표 선택) → 시작<br>
· <b>DAY 01</b>을 누르면 탭 5개: 단어 / 암기 카드 / 자동 학습 / 독해 / 퀴즈<br>
· 🔊는 원어민 음성이 나와요(브라우저에서 소리를 켜 주세요).<br><br>
※ 기록은 이 페이지 안에서만 유지돼요. 실제 앱의 디자인·문구와 조금 다를 수 있어요. DAY 02~30은 목록만 보여요.</div>

<div class="row" style="justify-content:center"><button class="btn o" style="width:70px" onclick="autoGo(-1)">⏮</button><button class="btn" style="width:150px" onclick="autoToggle()">${auto.run?'⏸ 멈춤':'▶ 자동 재생'}</button><button class="btn o" style="width:70px" onclick="autoGo(1)">⏭</button></div>
<p class="small" style="text-align:center">일본어 발음 → 잠깐 떠올리기 → 뜻(한국어 음성) 순서로 자동으로 넘어가요.</p>`}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function autoToggle(){auto.run=!auto.run;render();while(auto.run&&st.tab==2){const w=W[auto.i];auto.show=false;render();play(w.js);await wait((w.js[1]-w.js[0])*1000+1200);if(!auto.run)return;auto.show=true;render();if(w.ks){play(w.ks);await wait((w.ks[1]-w.ks[0])*1000+900)}else await wait(1500);if(!auto.run)return;if(auto.i>=W.length-1){auto.run=false;render();return}auto.i++}}
function autoGo(d){auto.i=Math.max(0,Math.min(W.length-1,auto.i+d));auto.show=false;render()}
const rd={ko:false,ans:{}};
function ruby(t){return t.p.map(([a,b])=>b?`<ruby>${a}<rt>${b}</rt></ruby>`:esc(a)).join('')}
function tabReading(){const r=D.reading;return `<h3 style="margin:6px 0 0">${r.title}</h3><div class="small">${r.titleKo}</div>
<div class="row" style="margin:8px 0"><button class="chip ${rd.ko?'on':''}" onclick="rd.ko=!rd.ko;render()">해석</button><span class="small">초록 밑줄 = 이 DAY 단어 (누르면 뜻·한자·발음)</span></div>
<div class="card">${r.sentences.map(s=>`<div class="sent">${s.t.map(t=>t.n?`<span class="tw" onclick="sheet('${t.n}')">${ruby(t)}</span>`:ruby(t)).join('')}</div>${rd.ko?`<div class="small" style="margin-bottom:8px">${s.ko}</div>`:''}`).join('')}</div>
<b style="border-left:4px solid var(--shu);padding-left:8px">내용 확인</b>${r.questions.map((q,qi)=>`<div class="card"><b>Q${qi+1}. ${q.ja}</b><div class="small">${q.ko}</div>${q.options.map((o,i)=>{const c=rd.ans[qi];const cls=c==null?'':i==q.answer?'ok':i==c?'ng':'';return `<button class="opt ${cls}" onclick="if(rd.ans[${qi}]==null){rd.ans[${qi}]=${i};render()}">${i+1}. ${o}</button>`}).join('')}${rd.ans[qi]!=null?`<div class="small" style="color:${rd.ans[qi]==q.answer?'var(--ok)':'var(--shu)'}">${rd.ans[qi]==q.answer?'⭕ 정답!':'❌ 정답은 '+(q.answer+1)+'번'} ${q.exp}</div>`:''}</div>`).join('')}`}
function sheet(id){const w=W.find(x=>x.id==id);play(w.js);const el=document.createElement('div');el.className='sheet';el.innerHTML=`<div class="small">${w.r!==w.ja?w.r:''}</div><div style="font-size:32px;font-weight:800">${w.ja}</div><div style="color:var(--n4);font-weight:800;font-size:18px;margin:4px 0 10px">${w.ko}</div>${ktiles(w)}<div class="row" style="justify-content:center;margin-top:12px"><button class="chip" onclick='play(${JSON.stringify(w.js)})'>🔊 발음</button>${w.ks?`<button class="chip" onclick='play(${JSON.stringify(w.ks)})'>🇰🇷 뜻</button>`:''}<button class="chip" onclick="this.closest('.sheet').remove()">닫기</button></div>`;app.appendChild(el)}
const qz={q:null,i:0,ok:0,ch:null};
function newQuiz(){const pool=[...W].sort(()=>Math.random()-.5).slice(0,10);qz.q=pool.map(w=>{const o=W.filter(x=>x.id!=w.id&&x.ko!=w.ko).sort(()=>Math.random()-.5).slice(0,3);return {w,c:[w,...o].sort(()=>Math.random()-.5)}});qz.i=0;qz.ok=0;qz.ch=null;render();play(qz.q[0].w.js)}
function tabQuiz(){if(!qz.q)return `<h3>사지선다 퀴즈</h3><p class="small">${W.length}단어 중에서 10문제. 답을 고르면 원어민 발음이 나와요.</p><button class="btn" onclick="newQuiz()">퀴즈 시작</button>`;
if(qz.i>=qz.q.length)return `<div class="card" style="text-align:center"><div style="font-size:40px">🎉</div><b style="font-size:30px;color:var(--n4)">${qz.ok*10}점</b><p class="small">10문제 중 ${qz.ok}문제 정답</p><button class="btn o" onclick="qz.q=null;render()">새 퀴즈</button></div>`;
const {w,c}=qz.q[qz.i];return `<div class="row"><b>${qz.i+1} / 10</b><span class="sp"></span><b style="color:var(--ok)">⭕ ${qz.ok}</b></div><div class="card" style="text-align:center"><div class="small">이 단어의 뜻은?</div><div style="font-size:40px;font-weight:800">${w.ja}</div><button class="spk" onclick='play(${JSON.stringify(w.js)})'>🔊</button></div>
${c.map((x,i)=>{const cls=qz.ch==null?'':x.id==w.id?'ok':i==qz.ch?'ng':'';return `<button class="opt ${cls}" onclick="pick(${i})"><b style="color:var(--n4)">${i+1}</b>  ${x.ko}</button>`}).join('')}
${qz.ch!=null?`<p style="font-weight:800;color:${c[qz.ch].id==w.id?'var(--ok)':'var(--shu)'}">${c[qz.ch].id==w.id?'정답이에요! 👏':`오답 — 정답: ${w.ja}(${w.r}) = ${w.ko}`}</p><div class="kl">${kline(w)}</div><br><button class="btn" onclick="qz.i++;qz.ch=null;render();if(qz.q[qz.i])play(qz.q[qz.i].w.js)">다음 문제</button>`:''}`}
function pick(i){if(qz.ch!=null)return;qz.ch=i;const {w,c}=qz.q[qz.i];const ok=c[i].id==w.id;if(ok)qz.ok++;rate(w.id,ok?3:1);play(w.js);render()}
render();
</script></body></html>
