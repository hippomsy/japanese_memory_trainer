const title=r=>r.nick===r.kr?r.kr:`${r.nick} (${r.kr})`;
function home(){ const stage=i=>i<10?(i<3?5:2):0;
 let h=`<div class="hero"><div class="eb">🧩 RADICALS · 部首</div><h2>부수를 알면<br>한자가 보여요</h2><div class="sub">외운 부수 3 / 97 · 배운 부수 10<br>지금 복습할 부수 4개</div><div class="bar"><i style="width:3%"></i></div><button class="btn w" onclick="show('quiz')">▶ 오늘의 학습 · 복습 4개 하기</button></div>
 <div class="box"><b>확실하게 외우는 3단계</b><br>① 카드로 배우기 — 획순 · 자리 · 이야기 · 예시 한자<br>② 확인 퀴즈 — 틀린 부수는 맞힐 때까지 다시 나와요<br>③ 간격 복습 — 10분 → 1일 → 3일 → 7일 → 14일 → 30일</div>
 <div class="row2"><div class="tool">▦ 부수 전체표</div><div class="tool" onclick="show('pairs')" style="cursor:pointer">⇄ 헷갈리는 부수</div></div><div class="sec">12과 <small style="margin-left:auto;color:#6A7088;font-weight:400">부수 97개</small></div>`;
 let n=0; R.lessons.forEach(l=>{ h+=`<div class="lesson" onclick="cur='${l.r[0]}';show('card')"><div class="lh"><span class="num">${l.no}</span>${String(l.no).padStart(2,'0')}과 · ${l.title}<small>${l.no==1?'복습 중':l.no==2?'6개 남음':'아직 안 배움'}</small></div><div class="minis">${l.r.map(f=>{const s=stage(n++);return `<div class="mini ${s>=5?'m':s>0?'l':''}">${glyph(f,28)}</div>`}).join('')}</div><div class="prog"><i style="width:${l.no==1?62:l.no==2?10:0}%"></i></div></div>`;});
 return h;}
let cur='氵';
function card(){const r=byF[cur]; const vars=r.forms.split('').filter(x=>x!==r.f);
 return `<div class="top"><div class="big">${glyph(r.f,140)}</div><div><div class="kr">${r.kr}</div>${r.nick!==r.kr?`<div class="nick">${r.nick}</div>`:''}<div class="ja">${r.ja} 🔊</div><div class="pos">${posBox(r.pos,30)} ${POS[r.pos]}</div><div style="color:#A34A32;font-weight:700;font-size:13.5px;margin-top:8px">✍️ 획순 보기 · ${K[r.f].s.length}획</div></div></div>
 <div class="lbl">🏷 뜻</div><div class="mean">${r.mean}</div>${vars.length?`<div style="color:#6A7088;font-size:13px;margin-top:4px">같은 부수의 다른 모양: ${vars.join(' · ')}</div>`:''}
 <div class="lbl">💡 기억 이야기</div><div class="story">${r.story}</div>
 <div class="lbl">▦ 이 부수가 들어간 한자 (앱 안에 ${r.n}자)</div><div class="exs">${r.ex.map(e=>`<div class="ex">${glyph(e.k,64,e.s)}<div>${e.h}</div></div>`).join('')}</div>
 <div style="font-size:11.5px;color:#6A7088;margin-top:6px">예시 한자를 누르면 부품으로 쪼개 볼 수 있어요.</div>
 <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:16px">${R.radicals.slice(0,24).map(x=>`<span onclick="cur='${x.f}';show('card')" style="cursor:pointer;border:1px solid #EAE3D6;border-radius:8px;background:#fff">${glyph(x.f,30)}</span>`).join('')}</div>`;}
let qa=null; const Q={r:'氵',ex:R.radicals.find(x=>x.f=='氵').ex[0],opts:['冫','氵','木','亻'],ans:1};
function quiz(){const r=byF[Q.r]; let h=`<div class="prog" style="margin-top:6px"><i style="width:25%"></i></div><div class="q">이 한자에 들어 있는 부수는?</div><div style="display:flex;justify-content:center"><div class="big">${glyph(Q.ex.k,130,qa!=null?Q.ex.s:null)}</div></div><div class="opts">`;
 Q.opts.forEach((o,i)=>{h+=`<div class="opt ${qa!=null&&i==Q.ans?'ok':qa===i?'ng':''}" onclick="if(qa==null){qa=${i};show('quiz')}">${glyph(o,60)}</div>`;}); h+='</div>';
 if(qa!=null){const ok=qa==Q.ans; h+=`<div class="fb ${ok?'ok':'ng'}">${glyph(r.f,54)}<div><b style="color:${ok?'#3E9B6A':'#E2553F'}">${ok?'정답이에요!':'다시 기억해요 — 조금 뒤에 또 나와요'}</b><br><b>${title(r)} · ${r.ja}</b><br><span style="color:#6A7088;font-size:12.5px">${POS[r.pos]} · ${r.mean}</span><br>${r.story}</div></div><button class="btn r" style="margin-top:12px" onclick="qa=null;show('quiz')">다음 문제</button>`;}
 else h+=`<div style="text-align:center;color:#6A7088;font-size:12.5px;margin-top:14px">헷갈리는 짝 冫(얼음)이 오답 보기로 먼저 나와요</div>`;
 return h;}
const PAIRS=[['礻','衤','礻(보일 시)는 점 하나 → 신·제사·복.  衤(옷 의)는 점 둘 → 옷.  「옷은 단추가 하나 더!」'],['冫','氵','冫(얼음)은 점 둘, 氵(물)은 점 셋.  「얼음은 물보다 한 방울 적다」'],['宀','冖','宀은 지붕 위에 점(굴뚝)이 있는 집.  冖은 점 없는 덮개'],['⻖','⻏','똑같이 생긴 阝도 왼쪽이면 언덕(阜), 오른쪽이면 고을(邑).  「왼쪽 언덕, 오른쪽 마을」'],['广','厂','广은 점 있는 큰 집(店·庭).  厂은 점 없는 절벽(原·厚)'],['⻌','廴','⻌(책받침)은 점이 있는 「길 가다」(道·近).  廴(민책받침)은 점 없는 「길게 끌다」(建·延)']];
function pairs(){return '<div class="pairs">'+PAIRS.map(([a,b,t])=>`<div class="pc"><div class="two"><div>${glyph(a,72)}<br>${title(byF[a])}<br><span style="color:#A34A32;font-size:16px">${byF[a].ex.slice(0,3).map(e=>e.k).join(' ')}</span></div><b style="color:#6A7088">vs</b><div>${glyph(b,72)}<br>${title(byF[b])}<br><span style="color:#A34A32;font-size:16px">${byF[b].ex.slice(0,3).map(e=>e.k).join(' ')}</span></div></div><p>${t}</p></div>`).join('')+'</div>';}
function show(v){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));
 const T={home:['기본 부수','부수를 알면 한자가 쪼개져요'],card:['01과 사람과 몸 ①','부수 카드'],quiz:['오늘의 복습','1 / 4'],pairs:['헷갈리는 부수','닮은 짝을 나란히 비교해요']}[v];
 document.getElementById('t').textContent=T[0];document.getElementById('st').textContent=T[1];
 document.getElementById('b').innerHTML={home,card,quiz,pairs}[v](); document.getElementById('b').scrollTop=0;}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.v));
const v=new URLSearchParams(location.search).get('v'); show(v||'home');
</script></body></html>
