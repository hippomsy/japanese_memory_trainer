<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>하루 일본어 미리보기</title>
<style>
:root{--paper:#F7F3EC;--card:#fff;--ink:#1C2340;--soft:#6A7088;--line:#EAE3D6;--shu:#E2553F;--matcha:#3E9B6A;--sora:#4A7BE0;--fuji:#8B6CD9;--yama:#E9A23B;--sakura:#E56B8F;--waka:#3FA88B;--night:#2B2D42;--gram:#3D5A98}
*{box-sizing:border-box}body{margin:0;background:#d9d4cb;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Noto Sans JP",sans-serif;color:var(--ink);display:flex;justify-content:center;padding:20px 0}
.phone{width:390px;height:820px;background:var(--paper);border-radius:36px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.25);border:8px solid #111;display:flex;flex-direction:column}
@media(max-width:420px){body{padding:0}.phone{width:100vw;height:100vh;border-radius:0;border:0}}
.top{padding:14px 18px 8px;display:flex;align-items:center;gap:8px;min-height:58px}
.top h1{font-size:21px;margin:0;font-weight:800;flex:1;line-height:1.2}.top small{display:block;font-size:12.5px;color:var(--soft);font-weight:500}
.back{border:0;background:none;font-size:22px;cursor:pointer;color:var(--ink);padding:4px 8px 4px 0}
.body{flex:1;overflow-y:auto;padding:4px 18px 24px}
.nav{display:flex;background:#fff;border-top:1px solid var(--line);height:68px}
.nav button{flex:1;border:0;background:none;font-size:12px;color:var(--soft);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.nav button .ic{font-size:19px;padding:2px 18px;border-radius:14px}
.nav button.on{color:var(--shu);font-weight:800}.nav button.on .ic{background:rgba(226,85,63,.13)}
.hero{border-radius:28px;padding:22px;color:#fff;position:relative;overflow:hidden;box-shadow:0 10px 20px rgba(0,0,0,.18)}
.hero .eb{color:#FFD29E;font-size:11.5px;letter-spacing:2px;font-weight:800}.hero h2{font-size:25px;margin:12px 0 6px;line-height:1.3;font-weight:900}
.hero p{margin:0;opacity:.8;line-height:1.6;font-size:14px}.hero .big{position:absolute;right:-16px;top:-22px;font-size:130px;opacity:.08}
.bar{height:6px;border-radius:6px;background:rgba(255,210,158,.25);margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:#FFD29E}
.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:800;font-size:15px;cursor:pointer;background:var(--shu);color:#fff;width:100%;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 6px 16px rgba(28,35,64,.05);cursor:pointer}
.row{display:flex;align-items:center;gap:12px}
.badge{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.sec{display:flex;align-items:center;gap:8px;margin:22px 0 10px}.sec b{width:4px;height:18px;background:var(--shu);border-radius:4px}.sec h3{margin:0;font-size:18px;font-weight:800;flex:1}.sec span{font-size:12px;color:var(--soft)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;cursor:pointer;box-shadow:0 6px 16px rgba(28,35,64,.05)}
.tile h4{margin:12px 0 3px;font-size:15.5px}.tile p{margin:0;font-size:12px;color:var(--soft);line-height:1.35}
.new{float:right;background:var(--night);color:#fff;font-size:10px;font-weight:900;padding:2px 7px;border-radius:10px}
.shortcuts{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}.sc{width:72px;flex:none;text-align:center;font-size:11.5px;font-weight:600;cursor:pointer}
.sc div{width:56px;height:56px;margin:0 auto 6px;border-radius:18px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px}
.feat{border-radius:24px;padding:18px;color:#fff;background:linear-gradient(135deg,#F2876B,#8B6CD9);cursor:pointer;margin-top:18px}
.movie{border-radius:24px;padding:18px 20px;color:#fff;margin-bottom:14px;cursor:pointer;position:relative;overflow:hidden}
.pill{display:inline-block;background:rgba(255,255,255,.2);padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800;margin-right:6px}
.lesson{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.num{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px}.tabs button{flex:1;border:0;background:none;padding:12px 0;font-weight:800;color:var(--soft);border-bottom:3px solid transparent;cursor:pointer;font-size:14px}
.line{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 6px 10px 14px;margin-top:6px;transition:.2s}
.line.act{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 10%,white)}
.chip{display:inline-block;font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:20px;margin-bottom:6px}
.ja{font-size:18px;font-weight:600;line-height:1.5}.ko{font-size:14px;color:var(--soft);line-height:1.5;margin-top:3px}
.spk{width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;font-size:17px;flex:none}
.qn{width:30px;height:30px;border-radius:10px;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.ans{margin-top:12px;background:rgba(62,155,106,.08);border:1px solid rgba(62,155,106,.35);border-radius:14px;padding:10px 6px 10px 14px;display:flex;align-items:center;gap:8px}
.tbtn{border:0;border-radius:14px;padding:9px 14px;font-weight:800;cursor:pointer;flex:none}
.note{font-size:12px;color:var(--soft);line-height:1.6;margin-top:10px}
</style></head><body><div class="phone" id="app"></div>
<script>
const DATA=[{"lessons":[{"no":1,"title":"기적의 시작","summary":"현재 고등학생 인 유지가 과거 있었던 일을 회상하며 본격적으로 영화가 시작된다.","kw":[["長い間","오랫동안",""],["お誕生日","생일",""],["(店を)閉める","(가게를)닫다",""],["幻","환상",""],["(約束を)果たす","(약속을) 지키다",""]],"s":[["유지","そろそろ起きて、たっくん！","슬슬 일어나 탁군!"],["유지","遅刻するよ。","지각한다니까."],["유지","はい！","네!"],["빵집 아저씨","おはようございます。","안녕하세요."],["유지","おはようございます。","안녕하세요."],["유지","ずいぶん早いっすね。","꽤 일찍오셨네요."],["빵집 아저씨","いや、実は店を今日で閉めることになりましてね。","그게... 실은 오늘 가게를 닫게 되어서요..."],["유지","そうなんですか。","그래요..."],["빵집 아저씨","でも、よかった。","그래도 다행이야."],["빵집 아저씨","約束、最後まで果たせて。","약속 끝까지 지킬 수 있어서."],["유지","長い間、ありがとうございました。","오랫동안 감사했습니다."],["빵집 아저씨","お誕生日おめでとうございます。","생일 축하합니다."],["유지","ありがとうございます。","감사합니다."],["타쿠미","佑司！新しい歯ブラシンどこだっけ。","유지! 새로운 칫솔 어디 갔지?"],["유지","昨日言ったろ。","어제 말했잖아."],["유지","あの年、雨の季節に僕たちに訪れた奇跡は、この森から始まったんだ。","그 해, 비의 계절에 우리에게 찾아왔던 기적은 이 숲에서 시작됐다."],["유지","たった6週間の奇跡。","단 6주간의 기적."],["유지","もしかしたら、あれは霧の向こうの幻だったのかもしれない。","어쩌면 그건 안개 너머의 환상이었을지도 모른다."],["유지","けど…僕たちは確かにママに会ったんだ。","하지 만...우리는 분명히 엄마를 만났다."]],"r":[["ずいぶん","꽤","今日は、ずいぶん遅いですね。","오늘은, 꽤 늦네요."],["〜っけ","~였더라","明日の会議、何時からだっけ？","내일 회의, 몇 시부터였더라?"],["もしかしたら / 〜かもしれない","~ 어쩌면~일지도 모른다","もしかしたら、夢かもしれない。","어쩌면 꿈일지도 모른다."]],"q":[["지각한다니까!","遅刻するよ。"],["꽤 일찍오셨네요.","ずいぶん早いっすね。"],["그래도 다행이야.","でも、よかった。"],["오랫동안 감사했습니다.","長い間、ありがとうございました。"],["어제 말했잖아.","昨日言ったろ。"]]},{"no":2,"title":"아카이브 별","summary":"미 오가 떠난 지 1년, 유지는 엄마가 아카이브 별에서 비의 계절이 되면 돌아올 거라 믿고 있다.","kw":[["亡くなる","돌아가다, 죽다",""],["難産","난산(어렵게 출산함)",""],["絵本","그림책",""]],"s":[["친척1","澪ちゃんが亡く亡くなって、もう1年ね…","미 오가 떠난 지 벌써 1년이네..."],["친척2","大丈夫なのかな、巧君と佑司君は。","괜찮으려나? 타쿠미와 유지는."],["친척2","巧君はあんなだし。","타 쿠미는(몸이) 저런데다가..."],["친척1","やっぱり無理して佑司君産んだのがいけなかったのよね。","역시 무리해서 유지를 낳은 게 안 좋았나봐."],["친척1","相当難産だったみたいだし。","상당히 난산이었던 것 같은데..."],["친척2","佑司君産む前は元気だったもんなぁ。","유지 낳기 전엔 건강했었는데 말야."],["유지","ねえ、死んだ人はみんなどこにいるの？","있잖아, 죽은 사람은 다 어디에 있는 거야?"],["타쿠미","アーカイブ星にいるんだよ。","아카이브 별에 있을 거야."],["타쿠미","ママが書いた絵本にそう書いてあったろ？","엄마가 쓴 그림책에 그렇게 써 있었잖아?"],["유지","ねえ、本当にママもアーカイブ星にいるの？","그럼 정말 엄마도 아카이브 별에 있는 거야?"],["타쿠미","そうじゃないかな。","그렇지 않을까?"],["타쿠미","ママはうそつかないでしょ。","엄마는 거짓말 안 하잖아."],["유지","じゃあ、雨の季節になったら、ママはかえってくるんだね、本当だよね。","그럼 비의 계절이 되면 엄마가 돌아오는 거지? 정말이지?"],["타쿠미","うん…うん。","으음... 응."],["타쿠미","よし、食べよう。","자 먹자."],["타쿠미","ごめん、また失敗しちゃった。","미안, 또 실패해버렸어."],["유지","大丈夫だよ。食べられるよ。","괜찮아, 먹을 수 있어."],["타쿠미","いただきます。","잘 먹겠습니다."],["유지","いただきます。はい。","잘 먹겠습니다. 자."],["타쿠미","ありがとう。","고마워."],["유지","たっくん、先行くね！","탁군,먼저 갈게!"],["타쿠미","いってらっしゃい！","잘 다녀와."],["유지","たっくん！","탁군!"],["타쿠미","はい。","네."],["유지","遅刻しちゃだめだよ。","늦으면(지각하면) 안돼."],["타쿠미","分かった。","알았어."],["유지","行ってきます。","다녀오겠습니다."],["타쿠미","はーーい、よし。","네~, 좋아."],["타쿠미","行ってきます！","다녀오겠습니다!"]],"r":[["〜(だ)し","(이)고","今日は、日曜日だし、雨だし…","오늘은 일요일인데다가 비도 오고 말이야..."],["〜でしょ","~잖아","さっきも言ったでしょ。","아까도 말했잖아."],["ちゃだめ","~하면 안돼","忘れちゃだめだよ。","잊으면 안돼."]],"q":[["벌써 1년이네.","もう1年ね。"],["아카이브별에 있을 거야.","アーカイブ星にいるんだよ。"],["엄마는 거짓말 안 하잖아.","ママはうそつかないでしょ。"],["미안, 또 실패해버렸어.","ごめん、また失敗しちゃった。"],["늦으면(지각하면) 안돼.","遅刻しちゃだめだよ。"]]},{"no":3,"title":"비의 계절","summary":"곧 비의 계절이 시작될 것이라는 일기예보 소식을 듣고, 타쿠미와 유지는 미오의 약속이 신경쓰인다.","kw":[["順番","순번, 차례",""],["季節外れ","계절에 맞지 않음",""],["冬物","겨울 옷",""],["梅雨入り","장마철이 됨",""],["逆さま","거꾸로 됨",""]],"s":[["상사","秋穂君！","아이오군!"],["타쿠미","はい。","네."],["상사","これ、出しといて。","이거, 보내 놔."],["타쿠미","はい。","네."],["나가세","この方が。","이러는 편이..."],["타쿠미","あっ。","아."],["나가세","この順番で行く方が効率いいですから。","이 순서대로 가는 게 효율적이니까요."],["타쿠미","ありがとう。","고마워."],["나가세","いいえ。あと…","아뇨. 그리고..."],["타쿠미","すいません。","죄송해요."],["나가세","あ、いいえ。","아,아니에요."],["나가세","それから、ちょっと季節外れかなって。","그리고, 계절에 맞지 않다고 할까..."],["타쿠미","え？","에?"],["나가세","冬物だし。","겨울 옷이고..."],["타쿠미","あ、すいません。","죄송해요."],["나가세","あ、いえ。","아, 아뇨."],["기상캐스터","いよいよ梅雨入り間近、雨の季節到来ということ(ㅎㅎ","이제 곧 장마가 얼마 남지 않아 비의 계절에 들어가게 됩니다."],["타쿠미","雨の季節かあ…","비의 계절이구나..."],["나가세","雨が好きなんですか。","비를 좋아하세요?"],["타쿠미","ええ、まぁあ。","예? 예... 뭐..."],["나가세","へぇ、でも週末はお祭りですよね。","그러시구나, 하지만 주말은 축제잖아요."],["나가세","佑司君、行きたいとか言ってませんか。","유지, 가고 싶다고 하지 않아요?"],["나가세","あの、もしよかったら、私、佑司君を連れて…","저, 혹시 괜찮으시다면 제가 유지를 데리고..."],["나가세","秋穂さん…？","아이오씨?"],["타쿠미","えっ。","네?"],["나가세","あ、いえ、これ、できました。","아, 아니에요. 이거 다 됐어요."],["타쿠미","あ…ありがとう。","아.. 고마워."],["나가세","いえ。","아뇨."],["학생","お祭り行く人。","축제 가는 사람?"],["학생들","はーい！","나!"],["아야","秋穂君は行かないの？お祭り。","아이오는안 가? 축제."],["유지","うん…うちは、お父さんが人がいっぱいのところはだめなんだ。","으응...우리 집은 아빠가 사람이 많은 곳은 안되거든."],["아야","そうなんだ…","그렇구나..."],["선생님","チャイム鳴ったわよ。","종 울렸어."],["선생님","何、あれ。","뭐야, 저거?"],["학생들","逆さまだよ。","거꾸로 됐어."],["학생들","佑司君がつけてました。","유지가 걸었어요."],["선생님","可愛いじゃん。","귀엽구나."],["선생님","さ、授業を始めましょう。","자, 수업 시작합시다."],["선생님","次は、算数です。","다음은 산수입니다."]],"r":[["〜といて","해 놔(둬)","あとで聞いといて。","나중에 물어봐 둬."],["〜かなって","랄까","その服ちょっと似合わないかなって。","그 옷 좀 안 어울린달까..."],["〜じゃん","잖아, 〜구나","すごいじゃん。","굉장하구나."]],"q":[["이거 보내 놔.","これ、出しといて。"],["비의 계절이구나.","雨の季節かぁ…"],["사람이 많은 곳은 안되거든.","人がいっぱいのところはだめなんだ。"],["이거 다 됐어요.","これ、できました。"],["거꾸로 됐어.","逆さまだよ。"]]},{"no":4,"title":"훌륭한 아빠","summary":"타쿠미가 주치의 인 노구치 선생님과 함께 이야기를 나누고 있다.","kw":[["不幸せ","불행함",""],["反対を押し切る","반대를 무릅쓰다",""],["言い残す","(말을) 남기다",""]],"s":[["유지","ね、先生。どうしてパパは色んなことができないの？","있잖아요, 선생님. 왜 아빠는 못하는 일이 많아요?"],["유지","病気なの？","병인거야?"],["노구치","うん…そうだよ。","응... 그렇단다."],["노구치","パパは、そうだな。","아빠는 말이야... 그렇지."],["노구치","車でいうとガソリンがうまく回らないみたいな感じかな。","자동차로 치면 가솔린이 잘 안도는 느낌이랄까..."],["노구치","頭の病気や心の病気じゃないんだ。","머리의 병이나 마음의 병은 아니야."],["노구치","わかる？","알겠니?"],["유지","うーん。",""],["노구치","でも、パパは人不幸せなわけじゃないぞ。","하지만 아빠는 불행한 건 아니란다."],["유지","どうして？","왜요?"],["노구치","君がいるから。","네가 있으니까."],["타쿠미","佑司！","유지!"],["타쿠미","すいません、先生、遅くなっちゃって。","죄송해요, 선생님. 늦어져서."],["노구치","いいんですよ。ゆっくりで。","괜찮아요, 천천히 해도."],["타쿠미","かわいそうですよね、佑司。","불쌍하죠, 유지..."],["노구치","どうして？","왜요?"],["타쿠미","親が、こんなだから…","부모가 이 모양이라서..."],["노구치","そんなことないですよ。","그렇지 않아요."],["노구치","秋穂君は、周囲の反対押し切って、充分立派に父親やってると感心してます。","아이오군은 주위 반대를 무릅쓰고 충분히 훌륭하게 아빠 역할을 하고 있다고 감탄하는걸요."],["타쿠미","いえ、全然…","아뇨, 전혀..."],["타쿠미","もっと普通の親みたいに、色んな事してやれたらいいのに。","좀 더 보통 부모들처럼 여러 가지 해주고 싶은데..."],["노구치","澪さんが亡くなられて、もう一年ですね。","미 오씨가 떠난 지 벌써 1년이네요."],["타쿠미","最近、澪のことで思い出せないことが増えてきています。","최 근에 미오 일로 기억 못하는 일이 많아지고 있어요."],["타쿠미","ビデオや写真の中でしか、澪を感じることが出来ない。","비디오나 사진 속으로 밖에 미오를 느낄 수가 없어. 노구치: 근 그... 그렇군..."],["타쿠미","でも、澪は戻ってくるんですよ、もうすぐ。","하지만 미오는 돌아올 거예요. 이제 곧."],["노구치","雨の季節にって話ですか？","비의 계절에...말인가요?"],["타쿠미","ええ。","네."],["노구치","雨の季節に戻ってくると言い残されたんですよね。","비의 계절에 돌아온다는 말을 남겼지요."],["타쿠미","はい。","네."],["노구치","佑司君の絵本にも、そう書いて。","유지의 그림책에도 그렇게 쓰고."],["타쿠미","はい。","네."],["노구치","信じているんですか？","믿고 있나요?"],["타쿠미","佑司は、信じています。","유지는 믿고 있어요."],["노구치","そうですか…","그렇군요."]],"r":[["ちゃって","~해버려서","私また食べすぎちゃって。","나 또 과식해버려서..."],["みたいに","~처럼","私も先生みたいに、日本語を話したい。","나도 선생님처럼 일본어를 말하고 싶어."],["〜でしか","~로 밖에","日本語は、テレビでしか聞いたことないんです。","일본어는, 텔레비전으로밖에 들어 본 적 없어요."]],"q":[["병인거야?","病気なの？"],["하지만 아빠는 불행한 건 아니란다.","でも、パパは不幸せなわけじゃないぞ。"],["최근에 미오 일로 기억 못하는 일이 많아지고 있어요.","最近、澪のことで思い出せないことが増えてきています。"],["비의 계절에 돌아온다는 말을 남겼지요.","雨の季節に戻ってくると言い残されたんですよね。"],["믿고 있나요?","信じているんですか？"]]},{"no":5,"title":"서로의 배려","summary":"타쿠미는 유지를 위해서 몸이 안 좋은데도 불구하고 축제에 가게 되는데...","kw":[["ありえない","있을 수 없다",""],["科学的(に)","과학적(으로)",""],["一応","일단",""],["負担をかける","부 담을 주다",""],["調子","(몸) 상태",""]],"s":[["타쿠미","ありえないと思います？やっぱり。","있을 수 없다고 생각하시나요? 역시..."],["노구치","まぁ、科学的には、一応医者なんで。","뭐... 과학적으로는요. 일단 의사이기 때문에."],["타쿠미","やっぱり、そうですよね…","역시 그렇군 요..."],["노구치","秋穂君、君も澪さんに戻ってきてほしい？","아이오군, 당신도 미오씨가 돌아오길 바라나요?"],["타쿠미","はい…僕は、澪を幸せにしてやれなかったから、全然。","네... 저는 미오를 행복하게 해주지 못했으니까, 전혀..."],["노구치","そうでしょうか？","그런가요?"],["타쿠미","僕がこんなだから、澪に負担ばっかりかけてしまって。最初から最後まで。","제 몸이 이러니까 미오에게 부담만 줘서... 처음부터 끝까지."],["타쿠미","一度でいいから、僕と一緒に生きてよかったって思ってもらいたかった。","한번이라도 좋으니까 저와 함께라서 좋았다고 생각해주길 바랐어요."],["타쿠미","だから、もし戻ってきたら、そんな思いをさせてやりたいなって思うんです。","그러니까 혹시 돌아온다면 그런 생각을 하게 해주고 싶어요."],["타쿠미","普通の夫婦みたいに、一緒に電車に乗って旅行に行ったりとか。","보통 부부들처럼 함께 전철을 타고 여행을 간다든지..."],["노구치","なるほど。","그렇군요."],["타쿠미","先生、僕の体のこと聞かないんですね、医者なのに。","선생님, 제 몸 상태에 대해서 안 물어보시네요, 의사인데."],["노구치","どうですか？調子は。","어떠세요? 상태는."],["타쿠미","変わりないです。","변함 없어요."],["타쿠미","まずいね。","맛 없지?"],["유지","そんなことないよ。","그렇지 않아."],["타쿠미","まずいよ。","맛 없어."],["타쿠미","ごめんな、佑司。","미안해, 유지."],["유지","大丈夫だよ。食べられるよ。","괜찮아, 먹을 수 있어."],["유지","ごちそうさま。","잘 먹었습니다."],["타쿠미","はい。","네."],["타쿠미","お、ね、佑司！今度の土曜日さ、お祭り行かないか？","있잖아~유지! 이번 주 토요일에 말이야, 축제 가지 않을래?"],["유지","え？","어?"],["타쿠미","ほら、前もさ。ママと一緒に行ったじゃない。","왜, 전에도 말야. 엄마랑 같이 갔잖아."],["타쿠미","楽しかったって言ってただろ？","즐거웠다고했잖아?"],["유지","でも…たっくん、大丈夫なの？","하지만... 탁군, 괜찮아?"],["타쿠미","大丈夫だよ。行きたいもんな。","괜찮아. 가고 싶지?"],["유지","うん！！","응!"],["아야","秋穂君！","아이오!"],["유지","あやちゃん！","아야!"],["아야","あっち見に行こう。","저쪽 보러 가자."],["타쿠미","佑司！","유지!"],["유지","たっくん、これやりたい！","탁군,이거 하고 싶어!"],["유지","たっくん！！たっくん！！","탁군!! 탁군!!"],["나가세","佑司君！？","유지?!"]],"r":[["〜てもらいたい","~해주길 바라다,~해줬으면 좋겠다","誰かに手伝ってもらいたいけど。","누군가가 도와줬으면 좋겠는데."],["〜ないか","~지 않을래?","週末、飲みに行かないか。","주말에 한잔하러 가지 않을래?"],["〜もん(な)","~는 걸(~지?)","遊びに行きたいもん。","놀러 가고 싶은 걸."]],"q":[["있을 수 없다고 생각하시나요?","ありえないと思います？"],["저는 미오를 행복하게 해주지 못했으니까... 전혀.","僕は、澪を幸せにしてやれなかったから、全然。"],["저와 함께라서 좋았다고 생각해주길 바랐어요.","僕と一緒に生きてよかったって思ってもらいたかった。"],["어떠세요? 상태는?","どうですか？調子は。"],["이번 주 토요일에 말이야, 축제 가지 않을래?","今度の土曜日さ、お祭り行かないか？"]]},{"no":6,"title":"지켜진 약속","summary":"타쿠미와 유지는 무언가를 찾으러 온 숲에서, 미오와 만나게 되 는데...","kw":[["親戚の人","친척(사람)",""],["四つ葉のクローバー","네 잎 클로버",""],["(願いが)叶う","(소원이)이 루 어지다",""],["(病気が)治る","(병이)낮다",""],["印","표시",""]],"s":[["유지","たっくん！","탁군!"],["타쿠미","佑司。ごめん。","유지. 미안해."],["유지","たっくんは、たっくんはいなくなったりしないよね、いなくならないよね。","탁군은, 탁군은 떠나거나 하지 않을 거지? 떠나지 않지?"],["타쿠미","うん…いなくならないよ、絶対に。","응... 떠나지 않아, 절대로."],["타쿠미","ごめん、ごめんね、佑司。","미안, 미안해, 유지."],["유지","ねえ、たっくん。","있잖아,탁군."],["타쿠미","ん？","응?"],["유지","ママは僕のせいで死んじゃったんでしょ？","엄마는 나 때문에 죽은 거지?"],["타쿠미","えっ？","에?"],["유지","そうなんでしょ？","그런거지?"],["타쿠미","佑司、どうしてそんなこと。","유지, 왜 그런 말을..."],["유지","だって…親戚の人がそうゆってたんだもん。","왜냐면... 친척들이 그렇게 말했는 걸."],["타쿠미","違うよ、ママは佑司のせいで死んだんじゃない。","아냐, 엄마는 유지 때문에 죽은 게 아니야."],["타쿠미","それに、パパはいなくならない絶対に。","그리고 아빠는 떠나지 않아, 절대로."],["유지","うん…ママに会いたいなぁあぁ。","엄마 보고 싶다."],["타쿠미","何探してるの？","뭐 찾는 거야?"],["유지","四つ葉のクローバー。","네 잎 클로버."],["유지","願いが叶うんだって。","소원이 이루어진대."],["타쿠미","どんなお願いするの？","어떤 소원을 빌거야?"],["유지","ママの病気が治りますようにって。","엄마 병이 낮도록 이라고..."],["미오","ありがとう。","고마워."],["타쿠미","澪。大丈夫？","미오. 괜찮아?"],["미오","大丈夫。","괜찮아."],["유지","じゃあ、水！","그럼, 미즈(물)!"],["타쿠미","ず？ずわいがに。","즈? 즈와이가니(대게)."],["유지","あ、んがついた。","아, 응( ん) 이 붙었다."],["타쿠미","佑司！危ないよ！","유지! 위험해!"],["유지","大丈夫！","괜찮아!"],["타쿠미","何を探してるの？","뭘 찾고 있는 거야?"],["유지","絶対ヒミツ。ママと約束したんだ。","절대 비밀이야. 엄마랑 약속했거든."],["타쿠미","ママと？","엄마랑?"],["유지","54…でも、どこだかわからなくなっちゃったんだ。","응... 근데 어디인지 잊어버렸어."],["타쿠미","印をつけなきゃ。","표시를 해야지."],["유지","そっか…","그렇네..."],["유지","ママ。","엄마."],["타쿠미","澪。","미오."],["유지","ママ！","엄마!"],["타쿠미","澪。","미오."],["타쿠미","本当に澪なの？","정말 미오 맞아?"],["미오","澪？それ、私の名前？","미오? 그게 내 이름?"],["유지","ママ。","엄마."],["미오","ママ？","엄마?"],["미오","あなたたち、誰？","당 신 들... 누구야?"]],"r":[["〜たりしない","~(하거나) 하지 않다","私のこと嫌いになったりしないよね。","나 싫어(하거나) 하지 않을 거지?"],["〜だって","래, 〜대","努力すれば夢が叶うんだって。","노력하면 꿈이 이루어진대."],["〜なきゃ","해야지","早く行かなきゃ。","발리 가야지."]],"q":[["탁군은 떠나거나 하지 않을 거지?","たっくんはいなくなったりしないよね。"],["엄마는 나 때문에 죽은 거지?","ママは僕のせいで死んじゃったんでしょ？"],["엄마 병이 낮도록 이라고...","ママの病気が治りますようにって。"],["근데 어디인지 잊어버렸어.","でも、どこだかわからなくなっちゃったんだ。"],["표시를 해야지.","印をつけなきゃ。"]]},{"no":7,"title":"잃어버린 기억","summary":"다시 만나게 된 미오는 모든 기억을 잃은 듯, 타쿠미와 유지를 기억 하지 못한다.","kw":[["着替える","(옷) 갈아입다",""],["内緒","비밀",""],["幽霊","유령",""],["仕組み","구조",""],["綺麗好き","깔끔한 사람",""]],"s":[["타쿠미","覚えてないの？澪。","기억 안 나? 미오."],["타쿠미","君は…僕の妻で.…佑司の母親なんだ。","너는... 나의 아내고... 유지 엄마야."],["미오","私が妻…？母親…？","내가 아내...? 엄마...?"],["타쿠미","あ、ほら。","아, 이것 봐."],["미오","私だ…","나다..."],["유지","ねえママ、アーカイブ星ってどんなところだった？","있잖아, 엄마, 아카이브별은 어떤 곳이었어?"],["미오&타쿠미","え？","어?"],["타쿠미","あ、澪。あの、風邪引くといけないから、着替えて。","아, 미오. 저기 감기 걸리면 안되니까 옷 갈아입어."],["타쿠미","ここは君のものがそのままになってるから。","여기는 너의 물건들이 그대로니까."],["미오","そのまま？","그대로?"],["타쿠미","そう。えっと…とにかく、早く着替えて。","그래. 그러니까... 어쨌든, 빨리 갈아입어."],["타쿠미","佑司、ちょっとおいで。","유지, 잠깐 이리와봐."],["유지","何？","뭐야?"],["타쿠미","いいから。","알겠으니까."],["유지","何？","뭐야?"],["타쿠미","あ、佑司。あの、ママが戻ってきたことは、とりあえず皆には内緒にしておこう。","아, 그게, 유지. 저기, 엄마가 돌아온 건 일단 사람들에게 비밀로 해두자."],["유지","なんで？","왜?"],["타쿠미","皆、アーカイブ星の事知らないから、幽霊かと思っちゃうだろ。","모두 아카이브별에 대해 모르니까 유령이라고 생각할 수도 있잖아."],["유지","そうか。","그렇구나."],["타쿠미","うん…それから、ママ何も覚えてないみたいなんだ。","응... 그리고 엄마 아무것도 기억을 못하는 것 같아."],["타쿠미","パパのことも、佑司のことも、自分が一度死んでしまったことも。","아빠도 유지도 자기가 한번 죽은 것도."],["유지","どうして？","왜?"],["타쿠미","アーカイブ星がそういう仕組みなんじゃないかな。","아카이 브별이 그런 구조인가봐."],["유지","どうしてそんな仕組みなの？","왜 그런 구조인데?"],["타쿠미","そんなこと、パパにだって分からないよ！","그런 거, 아빠도 몰라!"],["유지","ごめんなさい…","미안해요..."],["타쿠미","ごめん。","미안..."],["유지","僕の事覚えてないんだ…","나 기억 못하는구나..."],["타쿠미","うん…",""],["유지","そうなんだ…","그렇구나..."],["타쿠미","これから、今日から、好きになってもらえばいい、佑司の事も、パパの事も。","이제부터, 오늘부터 좋아하게 만들면 돼, 유지도 아빠도."],["미오","質問があるんだけど…","질 문이 있는데..."],["타쿠미","どうぞ。","물어봐."],["미오","私は、ここで暮らしていたの？三人で。","나는 여기서 살고 있었던 거야? 셋이서?"],["타쿠미","うん。",""],["미오","どうしてこんなにむちゃくちゃなの、この家は。","어째서 이렇게 엉망인 거야, 이 집은."],["타쿠미","え。","에?"],["미오","私は、こんなにだらしない人なの？","나는 이렇게 깔끔하지 못한 사람인거야?"],["타쿠미","そんなことないよ。","그렇지 않아."],["타쿠미","澪は綺麗好きだから。","미 오는 깔끔한 사람이야."],["타쿠미","君はずっと病気で寝ていて。なぁ…？","너는 계속 아파서 누워 있어서... 그치?"],["유지","え？うん。","에? 응..."],["미오","そう…それにしても…ひどい。","그래... 그래도 그렇지... 심하다."],["타쿠미","だよね。","그렇지..."]],"r":[["といけない","~하면 안되다","失くすといけないから、かばんに入れました。","잃어버리면 안되니까 가방에 넣었어요."],["ておこう","~해 두자","この店の名前を覚えておこう。","이 가게 이름을 기억해두자."],["〜ばいい","~면 된다","これから、少しずつ慣れればいい。","앞으로 조금 씩 익숙해지면 돼."]],"q":[["감기 걸리면 안되니까 옷 갈아입어.","風邪引くといけないから、着替えて。"],["그리고 엄마 아무것도 기억을 못하는 것 같아.","それから、ママ何も覚えてないみたいなんだ。"],["어째서 이렇게 엉망인 거야, 이 집은.","どうしてこんなにむちゃくちゃなの、この家は。"],["미오는 깔끔한 사람이야.","澪は綺麗好きだから。"],["그래도 그렇지... 심하다.","それにしても…ひどい。"]]},{"no":8,"title":"우리들만의 비밀","summary":"기 억을 잃어 가족이라는 것을 믿지 못하는 미오에게 타쿠미와 유지는 열심히 설명을 한다.","kw":[["具合","(몸) 상태",""],["記憶","기억",""],["目玉焼き","달갈 프라이",""]],"s":[["미오","ね、私は、あの森で何をしていたの？","저기, 나는 그 숲에서 뭐하고 있었던 거야?"],["타쿠미","え？あ、散歩してたんだ。三人で。","0? 아... 산책하고 있었어. 셋이서."],["미오","散歩？","산책?"],["유지","散歩。","산책."],["타쿠미","そしたら、なんか、具合が悪くなって、しばらく休んでいて。","그러자, 뭔가, 몸 상태가 안 좋아져서 잠깐 쉬고 있었어..."],["유지","うん、休んでて。","응... 쉬고 있었어."],["타쿠미","そしたら、記憶をなくしちゃったみたい。","그러더니 기억을 잃어버린 것 같아."],["유지","みたい。","그런 것 같아."],["타쿠미","うん…そうみたい。","응... 그런 것 같아."],["미오","そう…","그래...?"],["유지","そう。","그래."],["미오","可愛い子ね。佑司君？","귀여운 애네.유지?"],["유지","うん。",""],["미오","私は澪。あなたの奥さんであり、佑司君のお母さん。","나는 미오. 당신의 아내이자, 유지의 엄마."],["타쿠미&유지","うん。",""],["미오","そう…","그래..."],["미오","さ、できたよ。","자, 다 됐어."],["유지","すごい！","굉장해."],["미오","そう？はい、これゆうじの。","그래? 자, 이건 유지 거."],["유지","おはよう。","좋은 아침."],["타쿠미","おはよう。","좋은 아침."],["미오","おはよう。","좋은 아침."],["타쿠미","おはよう。","좋은 아침."],["유지","たっくん！","탁군!"],["타쿠미","うん？","응?"],["유지","きれいな目玉焼き、久しぶりだね。","예쁜 달갈 프라이, 오랜만이지."],["타쿠미","そうだね。","그렇네."],["미오","なんか変。","뭔가 이상해."],["타쿠미","うん…？あ、これ。","응...? 아, 이거."],["미오","服じゃなくて、あなたたち。","옷 말고, 당신들."],["타쿠미&유지","そんなこと&.","그렇지 않아."],["유지","行ってきます！","다녀오겠습니다!"],["미오","行ってらっしゃい！","잘 다녀와!"],["타쿠미","あ、澪。","아, 미오."],["미오","はい。","네."],["타쿠미","まだ外には出ないほうがいいんじゃないかな。","아직 밖에는 안 나가는 게 좋지 않을까..."],["타쿠미","ほら、また具合悪くなったりすると困るし。","그... 또 몸이 안 좋아지면 곤란하니까."],["미오","はい。","네."],["타쿠미","じゃあ、行ってきます。","그럼 다녀오겠습니다."],["미오","あ、紐！","아,끈!"],["타쿠미","え？あ。","어? 아..."],["미오","行ってらっしゃい。巧さん…","다녀오세요, 타쿠미씨..."],["타쿠미","うん。行ってきます。","응. 다녀올게."]],"r":[["〜ちゃったみたい","~해버린 것 같아,~해버렸나 봐","もう閉まっちゃったみたいね。.","벌써 닫아버렸나 봐."],["であり","이자","私は、会社員であり、学生だ。","난 회사원이자 학생이다."],["〜ないほうがいい","~하지 않는 게 좋다","今日は、仕事に行かないほうがいい。","오늘은 일하러 안 가는 게 좋아."]],"q":[["그러자, 뭔가, 몸 상태가 안 좋아져서 잠깐 쉬고 있었 어...","そしたら、なんか、具合が悪くなって、しばらく休んでいて。"],["그러더니 기억을 잃어버린 것 같아.","そしたら、記憶をなくしちゃったみたい。"],["자, 다 됐어.","さ、できたよ。"],["예쁜 달갈 프라이, 오랜만이지.","きれいな目玉焼き、久しぶりだね。"],["아직 밖에는 안 나가는 게 좋지 않을까...","まだ外には出ないほうがいいんじゃないかな。"]]},{"no":9,"title":"천천히 한걸음씩","summary":"유지와 타쿠미에게는 “미오`라는 비밀이 생기게 된다.","kw":[["大変","큰일",""],["秘密","비밀",""],["知り合う","알게 되다",""],["結ばれる","맺어지다",""]],"s":[["유지","先生！","선생님!"],["선생님","おはよう。","좋은 아침."],["유지","大変なんだよ、凄いんだよ、昨日さ。","큰일이야, 굉장해, 어제 말이야..."],["선생님","何？","뭐?"],["유지","あ、内緒。","아... 비밀이야."],["친구들","何だよ、何にもないくせに。","뭐야~ 아무것도 없으면서."],["유지","あるよ、あるけど内緒なの！","있어, 있는데 비밀이야!"],["선생님","うらやましいな、秘密があって。","부럽구나, 비밀이 있어서."],["선생님","いいもんだよ、秘密って。","좋은 거야, 비밀이라는 건."],["타쿠미","おはようございます！","좋은 아침입니다."],["나가세","おはようございます。","좋은 아침이에요."],["나가세","なんか、いいことでもあったんですか。","뭔가 좋은 일이라도 있었어요?"],["타쿠미","はい。","네."],["나가세","何が。","무슨 일이...?"],["타쿠미","内緒です。","비밀이에요."],["나가세","そうですか。","그래요."],["나가세","あ、この方が。","아... 이러는 편이."],["타쿠미","ありがとう。","고마워."],["나가세","いいえ。","아뇨."],["유지","おいしい！","맛있어!"],["미오","本当？","정말?"],["타쿠미","おいしいよ。","맛있어."],["미오","そう…","그래...?"],["유지","うん。",""],["미오","ねえ、私料理上手だった？","있잖아, 나 요리 잘했어?"],["타쿠미","上手かった。","잘했어."],["미오","そう…","그래..."],["유지","これ、僕？","이거 나야?"],["미오","そう。","맞아."],["유지","じゃあ、これ誰？","그럼 이건 누구?"],["미오","巧さん。","타쿠미씨."],["미오","じゃあ、私はピンク…","그럼 나는 핑크..."],["유지","こっちも。","이쪽도."],["미오","可愛い。","귀여워."],["타쿠미","君の子だよ。","당신 아이야."],["미오","そうね。私が産んだのよね。","그렇지. 내가 낳았지."],["타쿠미","うん。",""],["미오","夫婦だったのよね、私たち。","부부였던 거지, 우리."],["타쿠미","そうだよ。","그래 맞아."],["미오","あなたたちと家族なんだって事は何となくわかるし…本当なんだと思う。","당신들과 가족이라는 건 어 쩌 알겠고... 진짜라고 생각해."],["타쿠미","うん。",""],["미오","でも、ごめんなさい。","하지만, 미안해요."],["미오","思い出せないの、まだ何も。","기 억이 나지 않아, 아직 아무것도."],["타쿠미","ゆっくりで。ゆっくりでいいよ。","천천히. 천천히 하면 돼."],["미오","私たちのこと教えて。","우리 들에 대해 알려줘요."],["타쿠미","ぼくたち？","우리들?"],["미오","そう。どうやって知り合って、どうやって恋をして…どうやって結ばれたのか。","응. 어떻게 알게 되고, 어떻게 사랑을 하고... 어떻게 결혼 했는지."]],"r":[["〜くせに","~면서","どうせ買わないくせに、また見てるの。","어차피 사지 않을 거면서 또 보고 있어?"],["〜でも","라도","明日、食事でもどうですか。","내일 식사라도 어때요?"],["〜のか","~는지","この前の旅行、どうだったのか教えてください。","얼마 전의 여행, 어땠는지 알려주세요."]],"q":[["뭐야~ 아무것도 없으면서.","何だよ、何にもないくせに。"],["부럽구나, 비밀이 있어서.","うらやましいな、秘密があって。"],["뭔가 좋은 일이라도 있었어요?","なんか、いいことでもあったんですか。"],["기억이 나지 않아, 아직 아무것도","思い出せないの、まだ何も。"],["어떻게 알게 되고, 어떻게 사랑을 하 고...어떻게 결혼 했는지","どうやって知り合って、どうやって恋をして.…どうやって結ばれたのか。"]]},{"no":10,"title":"짝사랑","summary":"타쿠미와 미오가 같은 고등학교를 다녔다는 얘기부터 이야기가 시작된다.","kw":[["出会う","(처음) 만나다",""],["同級生","동급생, 동창생",""],["生徒","학생",""],["不機嫌","불쾌함",""],["片思い","짝사랑",""],["変わり者","이 상한(특이한) 사람",""],["浮く","겉돌다",""]],"s":[["타쿠미","高2の春に僕らは出会ったんだ。","고2 봄에 우리들은 처음 만났어."],["미오","じゃあ、同級生だったの？","그럼 동창이었던거네?"],["타쿠미","そうだよ。二年間ずっと同じクラスだった。","맞아.2년간 계속 같은 반이었어."],["타쿠미","しかも偶然、ずっと隣の席だったんだ。","게다가 우연히 계속 옆자리였어."],["타쿠미","好きになったのは、僕の方からだった…","좋아하게 된 건, 내 쪽에서부터였어."],["타쿠미","澪は明るくて、可愛くて、成績も良くて、模範的な生徒。","미 오는 밝고 귀엽고 성적도 좋고, 모범적인 학생."],["타쿠미","でも、なんだかいっつもどこか不機嫌で、いつも何かに怒っているみたいに僕には見えた。","하지만 뭔가 항상 어딘가 불쾌하고, 항상 뭔가에 화내고 있는 것처럼 나에겐 보였어."],["타쿠미","そこが好きだった。","그런 점이 좋았어."],["타쿠미","うん、好きだったんだな。","응 좋아했던 거지."],["미오","私はあなたのことを好きではなかったの？","나는 당신을 좋아하진 않았던 거야?"],["타쿠미","多分…僕の片思いだったんだよ。","아마도... 나의 짝사랑이었을 거야."],["미오","片思い？","짝사랑?"],["타쿠미","うん…僕は、変わり者だったから。","응... 나는 특이한 애였으니까."],["타쿠미","部活の陸上以外には全く興味がないっていうか、","부활동인 육상 이외에는 전혀 관심이 없다고나 할까,"],["타쿠미","もともと人と付き合うのも苦手だし、なんか、浮いてて。","원래 사람들하고 사귀는 것도 서투르고, 뭔가 겉돌아서."],["타쿠미","いつも一人だったから。","항상 외톨이었으니까."],["미오","そう。足が速かったの？","그렇구나. 달리기 잘했어?"],["타쿠미","うん、県の記録持ってたんだ。","응. 현(뿌)의 기록을 가지고 있었어."],["타쿠미","でも…高校1年の大会で…","하지만 고1 때 대회에서..."]],"r":[["〜の方から","~쪽에서","私の方から先に誘ったんで。","내쪽에서 먼저 만나자고 했으니까요."],["っていうか","~랄까","最近、仕事がおもしろくないっていうか…","요즘 일이 재미 없 달까..."],["〜なんか","뭔가","この服、なんかちょっと似合わない感じ。","이 옷 뭔가 좀 안 어울리는 느낌."]],"q":[["고2 봄에 우리들은 처음 만났어.","高2の春に僕らは出会ったんだ。"],["좋아하게 된 건, 내 쪽에서부터였어.","好きになったのは、僕の方からだった…"],["그런 점이 좋았어. 응 좋아했던 거지.","そこが好きだった。うん、好きだったんだな。"],["아마도... 나의 짝사랑이었을 거야.","多分…僕の片思いだったんだよ。"],["그렇구나. 달리기 잘했어?","そう。足が速かったの？"]]},{"no":11,"title":"졸업식","summary":"타쿠미는 미오와 별 진전 없이 졸업식을 맞이하게 된다.","kw":[["悔しい","분하다, 억울하다",""],["めちゃくちゃ","엄청나게",""],["興味","흥미, 관심",""],["(言葉を)交わす","(말을) 주고받다",""],["(卒業を)迎える","(졸업을) 맞이하다",""]],"s":[["타쿠미","それ以来、悔しくて、毎日めちゃくちゃトレーニングして、","그 이후, 분해서 매일 엄청나게 트레이닝 하고"],["타쿠미","ますます速く走ることしか考えない変な奴になっていたんだ。","더욱 더 빨리 달리는 것 밖에 생각 하지 않는 이상한 녀석이 되어있었지."],["미오","そう。","그렇구나."],["타쿠미","君は、そんな奴のことは好きになってなかっただろうし、","너는 그런 애를 좋아하지는 않았을 거고,"],["타쿠미","いや、僕の事が好きではないとか、他に好きな人がいるとかではなく、","아니, 나를 좋아하지 않았다든지 다른 좋아하는 애가 있다는 게 아니라,"],["타쿠미","澪は…恋愛とかに興味なさそうに見えたな。","미 오는... 연애라던가 관심 이 없어 보였어."],["타쿠미","でも、そこが好きだった。","하지만, 그런 점이 좋았어."],["타쿠미","僕は、澪の隣の席にいられるだけで幸せだった。","나는 미오 옆 자리에 있을 수 있다는 것 만으로도 행복했어."],["타쿠미","でも、結局僕たちは","하지만 결국 우리는..."],["미오","おはよう。","좋은 아침."],["타쿠미","おはよう。","좋은 아침."],["타쿠미","それ以外の言葉を交わすこともなく、卒業を迎えた。","그 이외의 말을 나누는 일 없이 졸업을 맞이했어."],["타쿠미","僕は体育推薦で地元の大学に行くことになり、","난 체육 추천(특기 생)으로 동네 대학교에 가게 되고,"],["타쿠미","澪は東京の大学に行くことになったんだ。","미 오는 도쿄의 대학교(도쿄에 있는 대학교)로 가게 되었어."],["친구","私も書く！","나도 쓸게."],["미오","はい。","자."],["친구","ありがとう。","고마워."],["미오","書いて。","써줘."],["타쿠미","あ、はい。","아..네."],["타쿠미","「ありがとう…君の隣はいごこちがよかったです」-秋穂巧-","'고마워... 너의 옆자리는 있기에 편안했어.' -아이오 타쿠미-"],["타쿠미","はい。","자."],["미오","ありがとう。","고마워."],["타쿠미","あ、いえ。","아,아니요."],["타쿠미","そして澪はそのまま東京へ行ってしまった。","그리고 미오는 그대로 도쿄로 가버렸어."],["미오","ちょっと待って。","잠깐만."],["미오","私たちの恋はいつ始まったの？","우리 연애는 언제 시작된 거야?"],["타쿠미","もうちょっと我慢して聞いてくれるかな…","조금만 참고 들어줄래?"],["미오","はい。","네."]],"r":[["〜とか〜とかではなく","~라든지 ~라는 게 아니라","好きとか嫌いとかではなく、ただ興味がないんです。","좋아 한다든지 싫어하는 게 아니라 그냥 관심이 없거든요."],["そうに見える","~해 보이다","今日は、なんだか嬉しそうに見えるよ。","오늘은 왠지 기뻐 보이네."],["〜ことになる","~하게 되다","私は、この春就就職することになったんです。","저는 이번 봄에 취직하게 되었거든요."]],"q":[["연애라던가 관심이 없어 보였어.","恋愛とかに興味なさそうに見えたな。"],["나는 미오 옆 자리에 있을 수 있다는 것 만으로도 행복했어.","僕は、澪の隣の席にいられるだけで幸せだった。"],["그 이외의 말을 나누는 일 없이 졸업을 맞이했어.","それ以外の言葉を交わすこともなく、卒業を迎えた。"],["난 체육 추천(특기생)으로 동네 대학교에 가게 되고, 미오는 도쿄의 대학교(도쿄에 있는 대학교)로 가게 되었어.","僕は体育推薦で地元の大学に行くことになり、澪は東京の大学に行くことになったんだ。"],["우리 연애는 언제 시작된 거야?","私たちの恋はいつ始まったの？"]]},{"no":12,"title":"첫 데이트","summary":"대 학 생이 된 타쿠미는 용기를 내 미오에게 전화를 한다.","kw":[["偶然","우연히",""],["突然","갑자기",""],["サイン帳","메모장",""],["実現","실현",""]],"s":[["타쿠미","最初の夏休み…僕は澪が帰ってきてることを偶然聞いて。","첫 여름방학 때... 나는 미오가 돌아왔다는 얘기를 우연히 듣고."],["미오","もしもし…？","여보세요?"],["미오","まだなんだ。","아직이구나."],["타쿠미","もうすぐ、もう少しだから。","이제 곧. 조금만 더 들으면 되니까."],["미오","はい。","네."],["미오","もしもし。","여보세요?"],["타쿠미","あ、秋穂と言いますが。","아, 아이오라고 하는데요."],["타쿠미","秋穂です。覚えてますか。","아이오입니다. 기억하나요?"],["타쿠미","あ、はい、あの、突然で申し訳ないんだけど、","아, 네, 저기, 갑자기 죄송한데,"],["타쿠미","ほら、卒業式の日にサイン帳書いたとき、ペンをそのままにしちゃって…","그 왜, 졸업식 날 메모장에 글 썼을 때, 펜을 그대로 줘버려서..."],["타쿠미","あれ、返してもらえます？","그거 돌려 받을 수 있어요?"],["타쿠미","もちろん、口実だった。","물론 핑계였어."],["타쿠미","どうでもいいペンだったしね。","어 찌되든 상관 없는 펜이었고 말이지."],["타쿠미","ただ…もう一度だけ君に会いたかったんだ。","단지... 한 번만 더 너를 만나고 싶었던 거야."],["타쿠미","もう一度だけね。","한 번만 더 말이지..."],["미오","秋穂君！","아이오!"],["미오","はい。","자."],["타쿠미","ありがとう。","고마워."],["미오","ごめんなさい。大事なペンを。","미안해요,소중한펜을."],["타쿠미","ううん、いや、いいんだ。ありがとう。","으응 아니야, 괜찮아. 고마워,"],["타쿠미","久しぶりだね。元気だった？","오랜만이네. 잘 지냈어?"],["미오","ええ。",""],["타쿠미","あ、そう。","아. 그래."],["타쿠미","じゃ。","그럼 이만."],["미오","じゃあ。","그럼."],["타쿠미","0…コーヒーとか飲む時間ない？","저기... 커피라든가 마실 시간 없어?"],["미오","ある。","있어."],["타쿠미","自分でもよくそんな勇気出たなって思うんだ。","스스로도 잘도 그런 용기가 났구나 싶어."],["타쿠미","でも、ま、こうして記念すべき第1回目のデートが、出会ってから二年半かかって、ようやく実現したんだ。","하지만 뭐,이렇게 기념할만한 첫 데이 트가 만난 지 2년 반 걸려서 겨우 이루어진거야."],["미오","それで？それで？","그래서? 그래서 요?"]],"r":[["もう","더","もう一日休みたいなぁ。","하루 더 쉬고 싶다~"],["〜だけ","만, 〜뿐","私には、この人だけなんです。","저에겐 이 사람뿐이거든요."],["〜てから","~한 지,~하고 나서","日本に来てから、もう2年経ちました。","일본에 온 지 벌써 2년이 지났어요."]],"q":[["나는 미오가 돌아왔다는 얘기를 우연히 듣고.","僕は澪が帰ってきてることを偶然聞いて。"],["이제 곧. 조금만 더 들으면 되니까.","もうすぐ、もう少しだから。"],["물론 핑계였어.","もちろん、口実だった。"],["단지... 한 번만 더 너를 만나고 싶었던 거야.","ただ…もう一度だけ君に会いたかったんだ。"],["저기...커피라든가 마실 시간 없어?","あの.…コーヒーとか飲む時間ない？"]]},{"no":13,"title":"행복한 일상","summary":"미 오가 돌아오고 난 뒤, 행복한 일상을 보내는 타쿠미와 유지.","kw":[["決壊","무너짐",""],["喋る","수다 떨다",""],["お邪魔する","실례하다",""],["寮","기숙사",""],["慣れる","익 숙해지다",""],["ピシッとする","깔끔하다, 말쑥하다",""]],"s":[["타쿠미","なんだか、ダムが決壊したみたいに僕は喋りつづけたんだ。","왜 그런지, 댐이 무너진 것처럼 나는 계속 얘기를 했어."],["타쿠미","もう止まらないんだ。","더 이상 멈출 수가 없어."],["타쿠미","止まっちゃうと、君が「帰るね」って言い出しそうで、それが怖くて。","멈춰버리면 너가 '갈게'라고 할 것 같아서.. 그게 두려워서."],["타쿠미","陸上のこと、好きな音楽のこと、最近読んだ本の話。そして…","육상 이야기, 좋아하는 음악, 최근에 읽은 책 이야기. 그리고..."],["타쿠미","澪をずっと見ていたことも。","미오를 쭉 보고 있었던 것도."],["미오","秋穂君。","아이오."],["타쿠미","うん？","응?"],["미오","寒いね。","춥네."],["타쿠미","あ、よかったら、どうぞ。","아. 괜찮으면, 여기 넣어."],["미오","じゃあ、お邪魔します。","그럼 실례할게요."],["타쿠미","また会えるかな。","또 만날 수 있을까?"],["미오","また寮に戻っちゃうの。","또 기숙사로 돌아가거든."],["미오","でも…手紙を書きます。","하지만... 편지 쓸게요."],["타쿠미","そんな風に始まったんだ。僕と澪は。","그렇게 시작 된 거야. 나와 미오는."],["미오","その時みたいに、少しずつあなたに慣れていきたい。","그 때처럼, 조금씩 당신에게 익숙해져 가고 싶어."],["미오","もう一度、好きになっていきたいの。","다시 한번 더 좋아하게 되고 싶어."],["타쿠미","うん。ありがとう。","응,고마워."],["유지","ママ、あがったよ！拭いて。","엄마, 나왔어요! 닭아줘."],["타쿠미","佑司、自分で拭きなさい。","유지, 알아서 닭아야지."],["미오","あ。ばんざい。はい。","아. 만세. 자."],["나가세","あの。","저기."],["타쿠미","はい？","네?"],["나가세","ピシッとしてますよね、最近。","깔끔해지셨네요, 요즘."],["타쿠미","はい。","네."],["나가세","誰か、素敵な人でも現れたんですか。","누군가 좋은 사람이라도 나타나셨어요?"],["타쿠미","はい。","네."],["미오","こぼさないできれいに食べて。","흘리지 말고 깨끗이 먹어."],["타쿠미","ほら、パパがいつも言ってるでしょ？","거봐, 아빠가 늘 말했었지?"],["미오","巧さんも。","타쿠미씨도."],["타쿠미","え？","에?"]],"r":[["そう(で)","것 같다(같아서)","今朝、遅刻しそうでびっくりしたよ。","오늘 아침 지각할 것 같아서 놀랐어."],["〜かな","일까,려나","日曜日、晴れるかな。","일요일날 날씨 좋을까?"],["〜ていきたい","~해가고 싶다","これから、もっと仲良くなっていきたい。","앞으로 더 친해져 가고 싶어."]],"q":[["더 이상 멈출 수가 없어.","もう止まらないんだ。"],["그럼 실례할게요.","じゃあ、お邪魔します。"],["그 때처럼, 조금씩 당신에게 익숙해져 가고 싶어.","その時みたいに、少しずつあなたに慣れていきたい。"],["누군가 좋은 사람이라도 나타나셨어요?","誰か、素敵な人でも現れたんですか。"],["거봐, 아빠가 늘 말했었지?","ほら、パパがいつも言ってるでしょ？"]]},{"no":15,"title":"이대로 영원히","summary":"미오와 유지의 타임캡슐을 찾기 위해 숲으로 향하는 타쿠미와 미오, 유지.","kw":[["照る照る坊主","종이 인형(비가 오지 말라고 만드는 인형)",""],["鍵","열쇠",""],["タイムカプセル","타임캡슐",""],["奥さん","아내(남의 아내를부를 때)",""],["不思議","신기함",""]],"s":[["미오","佑司君！","유지!"],["유지","はい！","네!"],["미오","どうして、うちの照る照る坊主は、みんな逆さまなの？","왜 우리 집 인형은 모두 거꾸로 되어 있는 거야?"],["유지","ママはどこにも行かないよね。","엄마는 아무데도 안 갈 거지?"],["미오","行かないわよ、バカね。","안 가지. 바보구나."],["미오","ねえ、これは何の鍵なの？","근데 이게 무슨 열쇠야?"],["유지","タイムカプセル。ママと一緒に埋めたんだ。たっくんには内緒で。","타임캡슐. 엄마랑 같이 묻었거든. 탁군에게는 비밀로."],["미오","へえ、タイムカプセルがかがか。","그렇구나, 타임캡슐이구나."],["유지","でも、どこに埋めたか、分からなくなっちゃったんだ。","하지만 어디에 묻었는지 까먹어버렸어."],["미오","そう…見つかるといいね。","그래... 찾았으면 좋겠네."],["타쿠미","すずめ。","스즈메(참새)."],["유지","め…めだか。","메... 메다카(송사리)."],["미오","めだか？か、か、がかみ。","메다카(송사리)? 카, 카, 카미(종이)"],["타쿠미","み、み…みどり。","미, 미... 미도리(녹색)."],["유지","り。りんご。","리. 링고(사과)."],["미오","もし、このまま…","만약 이대로..."],["미오","このまま、記憶が戻らなくてもいいの。","이대로, 기억이 돌아오지 않아도 돼."],["타쿠미","え？","어?"],["미오","あなたも、佑司君も、好き。","당신도유지도좋아해."],["미오","このまま二人と一緒にいられれば、それでいいの。","이대로 두 사람과 함께 있을 수 있다면 그걸로 됐어."],["미오","あなたの奥さんでいられれば、いい。","당신의 아내로 있을 수 있으면, 괜찮아."],["타쿠미","澪。","미오."],["미오","なあぁに？","왜?"],["타쿠미","キスしていい？","키스해도 돼?"],["타쿠미","いや？","싫어?"],["미오","ううん。","아니."],["타쿠미","どうしたの？嫌だった？","왜그래? 싫었어?"],["미오","なんだか、不思議な気分。","어쩐지 이상한 기분이야."],["타쿠미","え？","어?"],["미오","初めてのキスみたい。","첫 키스 같아."],["타쿠미","そうだね。","그렇네."]],"r":[["〜か","~구나","もうすぐ夏休みか。","곧 여름방학이구나."],["〜か","~인지","この前行った店、どこだったか忘れちゃったの。","지 난 번에 갔던 가게가 어디였는지 까먹었어."],["〜なくてもいい","지 않아도 돼","これ返さなくてもいいよ。","이거 돌려 주지 않아도 돼."]],"q":[["왜 우리 집 인형은 모두 거꾸로 되어 있는 거야?","どうして、うちの照る照る坊主は、みんな逆さまなの？"],["그렇구나, 타임 캡슬이구나.","へえ、タイムカプセルか。"],["하지만 어디에 묻었는지 까먹어버렸어.","でも、どこに埋めたか、分からなくなっちゃったんだ。"],["이대로, 기억 이 돌아오지 않아도 돼.","このまま、記境が戻らなくてもいいの。"],["어쩐지 이상한 기분이야.","なんだか、不思議な気分。"]]},{"no":16,"title":"타쿠미의 병","summary":"비가 오는 날, 비를 맞으며 자전거를 타고 귀가한 타쿠미는 쓰러지고 만다.","kw":[["梅雨","장마",""],["長引く","오래 가다",""],["心配かける","걱정 끼치다",""],["一度","한번",""],["別れる","헤어지다",""]],"s":[["타쿠미","これ、確認お願いします。","이거 확인 부탁합니다."],["타쿠미","金子さん、これもできてますんで。","카네코씨, 이것도 다 되어 있어서."],["기상캐스터","この前線の活動が活発になっています。","이 전선의 활동이 활발해지고 있습니다."],["기상캐스터","ということは、今年の梅雨は長引く恐れが出てきたんですね。","그렇다면, 올해 장마는 길어질 우려가 있군요."],["타쿠미","やった…","잘 됐다..."],["나가세","うれしいんですか。","기쁘세요?"],["타쿠미","はい。うれしいんです。","네. 기뻐요."],["유지","あった！","찾았다."],["미오","アーカイブ星？","아카이 브 별?"],["유지","ママ！あったよ、タイムカプセル！ほら！","엄마! 찾았어, 타임캡슐. 이거 봐."],["미오","へえ、これか。開けてみようか。","음~ 이거구나. 열어볼까?"],["유지","たっくん！","탁군!"],["미오","巧さん、巧さんどうしたの！巧さん！","타쿠미씨! 타쿠미씨, 어떻게 된 거예요? 타쿠미씨!"],["미오","大丈夫？","괜찮아?"],["타쿠미","ごめん、たまにあるんだ。","미안, 가끔 이러거든."],["미오","どうして言ってくれなかったの？体のこと。","왜 말 안 해 줬 어? 몸 상태에 대해서."],["타쿠미","君に、心配かけたくなかったから。","너에게 걱정 끼치고 싶지 않았으니까."],["미오","ばか。","바보."],["타쿠미","ごめん。","미안."],["미오","そっち行っていい？","그쪽으로 가도 돼?"],["타쿠미","どうぞ。","응, 이리 와."],["미오","じゃあ、お了邪魔します。","그럼 실례할게요."],["미오","ねえ、このあいだの続き教えて。","있잖아, 지난번의 다음 이야기 들려줘."],["미오","次のデートの話。","다음 데이트 이야기."],["타쿠미","実は、二度目のデートはなかったんだ。","실은 두 번째 데이트는 없었거든."],["타쿠미","僕らは、一度別れたんだ。","우리는한번헤어졌어."],["미오","私たちに何があったの？","우리에게 무슨 일이 있었던 거야?"],["타쿠미","この体のせいなんだ。","이 몸 때문이야."]],"r":[["〜てみようか","~해볼까","今度、遊びに行ってみようか。","다음에 놀러 가볼까?"],["たくない","~고 싶지 않다","明日は、出勤したくないな。","내일은 출근하고 싶지 않구나."],["のせい(で)","~때문(에)","雨のせいで、遅れてしまった。","비 때문에 늦어버렸어."]],"q":[["이거 확인 부탁합니다.","これ、確認お願いします。"],["열어볼까?","開けてみようか。"],["왜 말 안 해줬어?","どうして言ってくれなかったの？"],["너에게 걱정 끼치고 싶지 않았으니까.","君に、心配かけたくなかったから。"],["우리에게 무슨 일이 있었던 거야?","私たちに何があったの？"]]},{"no":17,"title":"타쿠미의 선택","summary":"자신의 처 지에 낙심 한 타쿠미는 어떤 결심을 하게 되 는데...","kw":[["切れる","끊기다",""],["コントロール","컨트롤",""],["人込み","사람 많은 곳",""],["乗り物","탈 것",""],["絶望","절망",""],["見通し","전망, 예측",""]],"s":[["타쿠미","高校の頃からのトレーニングのしすぎで、","고등학교 때부터의 지나친 훈련 때문에,"],["타쿠미","僕の体のねじは少しずつおかしくなっていってたんだ。","내 몸의 나사는 조금씩 이상해져 가고 있었어."],["타쿠미","そして、大学2年の春、とうとうパチンと音をたてて切れてしまった。","그리고 대학교 2학년 봄에 드디어 탁 소리를 내며 끊어져버렸어."],["타쿠미","いくつもの病院で検査をされて、わかったことは、","몇 군데 병원에서 검사를 거쳐서 알게 된 건,"],["타쿠미","どうやら、僕の体をコントロールしている、脳の中の科学物質が","아무래도, 내 몸을 컨트롤 하고 있는, 뇌 속의 과학물질이"],["타쿠미","でたらめに分泌されるようになってしまったらしいってことだった。","엉망으로 분비되게 되어버린 것 같다는 얘기였어."],["타쿠미","走る事を取り上げられた。人込みや、乗り物もだめになった。","달리는 것을 빼앗겼어. 사람 많은 곳이나 탈 것도 못 타게 되었어."],["타쿠미","僕はすべてに絶望し、大学もやめてしまった。","나는 모든 것에 절망해, 대학도 그만둬버렸어."],["노구치","ゆっくりやりましょう。","천천히 합시다."],["노구치","ゆっくり、うまく付き合っていけばいいんですよ、病気と。","천천히, 자신의 병과 잘 어울려 지내면 돼요."],["노구치","大丈夫。君は必ずしも不幸せなわけではないですよ。","괜찮아요. 당신은 반드시 불행한 건 아니에요."],["미오","私は、そのことを教えてもらえなかったの？","나는... 그 얘기를 못 들은 거예요?"],["타쿠미","言い出せなくって…","말을꺼낼 수가 없어서..."],["타쿠미","普通の病気とは違っていたし。","보통 병하고는 다르기도 하고."],["타쿠미","僕は普通の人が出来る事の半分も満足に出来ない。","나는 보통 사람들이 할 수 있는 일의 반도 만족스럽게 하지 못 해."],["타쿠미","将来の見通しは暗かった。","미래가 깜깜했어."],["타쿠미","そんな僕の人生に君を付き合わせるわけにはいかない。","그런 나의 인생에 너를 끌어들일 수는 없어."],["타쿠미","だから、君の前から静かにいなくなろうと思ったんだ。","그래서네 앞에서 조용히 사라지려고 생각한거야."],["직원","あ、いらっしゃいませ。","아. 어서오세요."]],"r":[["〜すぎで","지나친 ~때문에","昨日、運動のしすぎで筋肉痛になりました。","어제 지나친 운동 때문에 근육통 걸렸어요."],["必ずしも~わけではない","반드시 ~한 건 아니다","必ずしも、もらえるわけではないんだって。","반드시 받을 수 있는 건 아니래."],["わけにはいかない","~일(할) 수는 없다","今さら諦めるわけにはいかないでしょ。","이제 와서 포기할 순 없잖아."]],"q":[["달리는 것을 빼앗겼어.","走る事を取り上げられた。"],["사람 많은 곳이나 탈 것도 못 타게 되었어.","人込みや、乗り物もだめになった。"],["당신은 반드시 불행한 건 아니에요.","君は必ずしも不幸せなわけではないですよ。"],["말을 꺼낼 수가 없어서...","言い出せなくって…"],["그래서네 앞에서 조용히 사라지려고 생각한거야.","だから、君の前から静かにいなくなろうと思ったんだ。"]]},{"no":18,"title":"작아지는 용기","summary":"미 오에게 모질게 대했지만, 보고 싶은 마음에 타쿠미는 미오를 만나러 도쿄로 찾아간다.","kw":[["迷惑","민폐, 방해",""],["同窓会","동창회",""],["言い聞かせる","타이르다, 설 득하나",""],["やりとり","주고받기, 교환",""],["自分勝手","제멋대로",""],["ふさわしい","어울리다",""]],"s":[["미오","秋穂君？","아이오?"],["미오","ごめんなさい突然。迷惑だった？","미안해요,갑자기.방해됐어?"],["미오","大学辞めたって聞いて…","대학 그만뒀다고 들어서..."],["타쿠미","いろいろ計画があるんだ。だからもう会えないんだ。","여러 가지 계획이 있거든. 그래서 이제 만날 수 없어."],["미오","どうして？","왜?"],["타쿠미","いつか、また会えるといいね。同窓会とかでさ。","언젠가 또 만날 수 있었으면 좋겠다. 동창회에서라든지 말야."],["타쿠미","お互い結婚してたりして。幸せになってもらいたいな、えのきださんには。","서로 결혼했다든지. 행복해졌으면 좋겠어, 에노키다씨는."],["미오","私の…","나의..."],["타쿠미","じゃ。","그럼 이만."],["타쿠미","僕は、ひどいことをしてしまった。","나는 심한 짓을 해버렸어."],["타쿠미","でも、これでいいんだ。そう自分に言い聞かせてた。","하지만 이걸로 됐어. 그렇게 스스로를 타일렀어."],["타쿠미","たった一度のデートと47通の手紙のやりとりで僕らの恋は終わろうとしていた。","단 한번의 데이 트와 47통의 편지를 주고 받고 우리의 사랑은 끝나려고 했어."],["타쿠미","でも、やっぱり君に会いたい。","하지만 역시 너를 만나고 싶어."],["타쿠미","自分勝手だけど、もう一度澪に会いたい。","제멋대로지만, 한번 더 미오를 만나고 싶어."],["타쿠미","一人で東京に行くなんて、もうその頃の僕には考えられないくらい、無理な行動だったんだ。","혼자서 도쿄로 간다니, 이미 그 때 나에게는 생각할 수도 없을 정도로 무리한 행동이었어."],["타쿠미","でも、どうしても我慢できなくて。","하지만 아무리 해도 참을 수 없어서."],["타쿠미","どうしても、澪に会いたくて。","어떻게든 미오를 만나고 싶어서."],["남자","澪ちゃん！","미오!"],["타쿠미","やっぱり自分じゃないんだ、澪にふさわしいのは…","역시 내가 아니구나, 미오에게 어울리는 건..."],["타쿠미","そう思ったんだ。僕じゃ無理なんだって。","그렇게 생각했어. 나로는 무리라고."]],"r":[["〜(よ)うとする","하려고 하다","そろそろ、出かけようとしているところです。","슬슬 나가려고 하는 중이에요."],["〜なんて","라니, 〜하다니","今では、スマホがないなんて考えられないことだよね。","이제는 스마트폰이 없다니 생각할 수 없는 일이지."],["くらい","정도(로)","日曜日だと思えないくらい、人が少ないですね。","일요일이라고 생각할 수 없을 정도로 사람이 적네요."]],"q":[["방해 됐어?","迷惑だった？"],["나는 심한 짓을 해버렸어.","僕は、ひどいことをしてしまった。"],["언젠가 또 만날 수 있었으면 좋겠다.","いつか、また会えるといいね。"],["어떻게든 미오를 만나고 싶어서.","どうしても、澪に会いたくて。"],["역시 내가 아니구나, 미오에게 어울리는 건...","やっぱり自分じゃないんだ、澪にふさわしいのは…"]]},{"no":21,"title":"미오의 부탁","summary":"미 오는 타쿠미의 회사 동료인 나가세를 만나러 카페로 향한다.","kw":[["混乱する","혼란스럽다",""],["現れる","나타나다",""]],"s":[["타쿠미","佑司、いろいろ、頑張ってるんだな。","유지 여러가지 열심히 하는구나."],["유지","うん。",""],["타쿠미","偉いんだな。","대단하구나."],["유지","ねえ、たっくん。","있잖아,탁군."],["유지","ママは雨の季節が終わったら、アーカイブ星に帰っちゃうんでしょ？","엄마는 비의 계절이 끝나면 아카이브별에 돌아가는 거지?"],["타쿠미","どうかな。でも、ママはそのこと忘れてるかもしれないな。","글쎄...? 하지만, 엄마는 그거 잊고 있을지도 모르겠네."],["유지","でも、ママが忘れてても、きっと誰かが迎えに来るよ。","하지만 엄마가 잊고 있어도 반드시 누가 데리러 올 거야."],["유지","だって、どんなお話でもみんなそうだもん。","왜냐면 어떤 이야기에서도 다 그러는 걸."],["타쿠미","そうか。","그렇구나."],["타쿠미","じゃ、大切にしないとな。一緒にいられる時間を。","그럼 소중히 해야겠네. 같이 있을 수 있는 시간을."],["유지","うん。",""],["미오","こめんなさい、かせて。","죄송해요, 놀라게 해서."],["나가세","澪さん…ですよね。","미오씨... 맞죠?"],["미오","はい。","네."],["나가세","だって…","하지만..."],["미오","ごめんなさい。話すと長くなるし、きっと混乱すると思うの。","미안해요. 이야기하자면 길어지는데다가, 분명 혼란스러울 거예요."],["미오","とにかく私のお願い聞いてくれますか。お願い。","어쨌든 제 부탁 들어줄 수 있나요? 부탁이에요."],["미오","お願いします。","부탁합니다."],["나가세","はい。分かりました。","네, 알겠어요."],["미오","ありがとう。","고마워요."],["미오","永瀬さんにお願いしたい事があって来ました。","나가세씨 에게 부탁하고 싶은 게 있어서 왔어요."],["나가세","私に？","저한테요?"],["미오","はい。巧と佑司のこと、お願いできませんか。","네. 타쿠미와 유지를 부탁할 순 없을까요?"],["나가세","お願いって…あ。","부 탁이라니... 아."],["나가세","この間、秋穂さん、素敵な人が現れたって…それって。","전에 아이오씨, 좋은 사람이 나타났다고... 그게 바로..."],["미오","でも、私は、もうすぐいなくなるんです。","하지만, 저는 이제 곧 사라질 거예요."],["미오","雨の季節が終わったら。","비의 계절이 끝나면."],["나가세","え？","네?"]],"r":[["〜ても","~해도, 이어도","間違えても、大丈夫だよ。","틀려도 괜찮아."],["〜ないと","~해야 한다","あ、急がないと。","아, 서둘러야 해."],["〜できませんか","할 수 없을까요?","今度、また一緒に食事できませんか。","다음에또 같이 식사할 수 없을까요?"]],"q":[["하지만 엄마가 잊고 있어도 반드시 누가 데리러 올 거야.","でも、ママが忘れてても、きっと誰かが迎えに来るよ。"],["그럼 소중히 해야겠네. 같이 있을 수 있는 시간을.","じゃ、大切にしないとな。一緒にいられる時間を。"],["이야기하자면 길어지는데다가, 분명 혼란스러울 거예요.","話すと長くなるし、きっと混乱すると思うの。"],["타쿠미와 유지를 부탁할 순 없을까요?","巧と佑司のこと、お願いできませんか。"],["하지만 저는 곧 사라질 거예요.","でも、私は、もうすぐいなくなるんです。"]]},{"no":22,"title":"모순된 마음","summary":"미 오는 둘만 남겨 질 타쿠미 와 유지가 걱정된 나머지 나가세를 찾아왔지만 되려 위로를 받게 된다.","kw":[["生きる","살다",""],["託す","맡기다",""],["面倒(を)みる","돌봐주다",""]],"s":[["미오","だから、巧と佑司のことを、誰かに託したくて。","그러니까, 타쿠미와 유지를, 누군가에게 맡기고 싶어서."],["미오","彼は生きてく上でのいろんな力が弱いから。","그는 살아가는데 있어서 여러가지로 서투르니까."],["미오","だから誰かに…誰かに託したくて…","그러니까 누군가에게... 누군가에게 맡기고 싶어서..."],["미오","お願いできませんか。二人を。","부탁드릴 수 없을까요? 두 사람을."],["미오","ごめんなさい。","미안해요."],["나가세","え？","네?"],["미오","私、そんなに立派な人間じゃないや…","나, 그렇게 훌륭한 인간은 아닌가봐..."],["미오","二人の事は心配だけど、巧が、誰かといるのは嫌だ。","둘은 걱정이지만, 타쿠미가 누군가와 있는 건 싫어."],["미오","他の誰かを、他の誰かを愛するようになったら、嫌だ。","다른 누군가를, 다른 누군가를 사랑하게 된다면, 싫어."],["미오","ごめんなさい。あ、忘れてください。","미안해요. 잊어주세요."],["나가세","大丈夫ですよ。","괜찮아요."],["나가세","心配しなくていいですよ。","걱정하지 않아도 돼요."],["나가세","彼が、私を女性として愛する事はないです。ありえない。","그가, 저를 여자로서 사랑할 리가 없어요. 말도 안돼요."],["나가세","きっとあなたしか、愛せない。秋穂さんは。","분명 당신 밖에 사랑할 출 몰라요. 아이오씨는."],["미오","ありがとう。","고마워요."],["나가세","私、澪さんとしゃべってるんですよね、今。","저, 미오씨랑 이야기 하고 있는 거죠? 지금."],["미오","はい。巧から聞いてます。","네. 타쿠미에게서 얘기 들었어요."],["미오","いつも、いろいろ面倒みていただいてるみたいで、ありがとうございます。","항상 여러 가지로 돌봐주시는 것 같아 감사합니다."],["나가세","いえ、そんな…","아뇨, 그런..."],["나가세","お久しぶりです。","오랜만이에요."],["미오","ごめんなさい。","미안해요."],["미오","私、あなたのこと、実は覚えてないの。","저, 당신을 사실은 기억 못 해요."],["나가세","へ？","네?"]],"r":[["〜上で","~하는 데에 있어서","人間関係は、仕事をしていく上で大切だと思う。","인간관계는 일을 하는 데에 있어서 중요하다고 생각한다."],["〜事はない","~일 리는 없다","まさか、そんな事はないでしょ。","설마 그럴 리는 없겠지요."],["〜しか","~밖에","せっかくのチャンスだから、やるしかないね。","모처럼 온 기회니까 할 수 밖에 없지."]],"q":[["그는 살아가는 데에 있어서 여러가지 서투르니까.","彼は生きてく上でのいろんな力が弱いから。"],["나, 그렇게 훌륭한 인간은 아닌가봐...","私、そんなに立派な人間じゃないや…"],["다른 누군가를, 다른 누군가를 사랑하게 된다면, 싫어.","他の誰かを、他の誰かを愛するようになったら、嫌だ。"],["그가, 저를 여자로서 사랑할 리가 없어요.","彼が、私を女性として愛する事はないです。"],["저, 사실은 당신을 기억 못해요.","私、あなたのこと、実は覚えてないの。"]]},{"no":23,"title":"생일케이크","summary":"유지의 생일파티로 즐거운 시간을 보내는 것도 잠시, 장마가 끝나간다.","kw":[["潰れる","무너지다, 망하다",""],["バースデーケーキ","생일 케이크",""],["普通","보통",""],["向く","향하다,보다",""]],"s":[["빵집아저씨","これでどうでしょう。","이걸로 어떨까요?"],["미오","はい。","네."],["미오","あの、確認したいんですけど。","저기...확인하고 싶은데요..."],["빵집 아저씨","はいはい、何でしょう。","네네, 뭐예요?"],["미오","この店、潰れたりする予定ありますか。","이 가게 문 닫을 예정이라도 있나요?"],["빵집 아저씨","はぁ？","뭐?"],["미오","大丈夫ですか。","괜찮아요?"],["빵집 아저씨","大丈夫ですよ、何言ってんだ、あんた。","괜찮아요, 무슨 말 하는 거야, 당신."],["미오","良かった、じゃ、予約をお願いしたいんですけど、バースデーケーキを。","다행이다, 그럼 예약을 부탁하고 싶은데요... 생일 케이크를."],["미오","そうだな、12年分。","그렇지...12년 분이요."],["미오","子供が18になるまで、毎年。","아이가 18살이 될 때까지, 매년."],["유지","すごい！","굉장해."],["타쿠미","すごいね。","굉장한데."],["미오","そう？普通だよ。","그래? 보통이지."],["유지","誕生ケーキだ！","생일 케이크다!"],["미오","そう、これは佑司のよ。","맞아, 이건 유지 거야."],["유지","やった！","앗싸~!"],["타쿠미","佑司の誕生日は来週だけど…","유지 생일은 다음주인데..."],["미오","いいの。どうしても今日やりたくなったの。","괜찮아. 어떻게든 오늘 하고 싶어졌단 말야."],["미오","はい、座って。","자, 앉아."],["미오","座って。","앉아."],["노래","ハッピーバースデートウーユーハッピーバースデートウーユー23ハッピーバースデーディア佑司ハッピーバースデートウゥウーユー8","생일 축하 합니다~ 생일 축하 합니다~ 사랑하는 유지 생일 축하 합니다~♬"],["미오","おめでとう。","축하해."],["타쿠미","はい、佑司、笑って。","자,유지웃어봐."],["타쿠미","こっち向いて。よ〜し。","이쪽 봐. 좋아."],["아야","秋穂君！","아이오!"],["선생님","どうした？","무슨 일이야?"],["유지","僕、帰らないと。","나 돌아가야 해."],["선생님","え？","어?"],["유지","僕、どうしても帰らないといけないんだ。","나 어떻게 든 집에 가야 한단 말이야."],["아야","先生。","선생님!"],["선생님","分かった。行きなさい。","알겠어. 가보렴."]],"r":[["〜どうでしょう","어떨까요?","じゃあ、来週でどうでしょう。","그럼 다음주로 어떨까요? ~인 거야,~란 말야"],["今日じゃなきゃダメなの。","","","오늘이아니면 안 되는 거야."],["〜なさい","~해,~하렴","本当のことを言いなさい。","진 실을 말하렴."]],"q":[["이걸로 어떨까요?","これでどうでしょう。"],["이 가게 문 닫을 예정이라도 있나요?","この店、潰れたりする予定ありますか。"],["괜찮아요, 무슨 말 하는 거야.","大丈夫ですよ、何言ってんだ。"],["괜찮아. 어떻게든 오늘 하고 싶어졌단 말야.","いいの。どうしても今日やりたくなったの。"],["나 어떻게든 집에 가야 한단 말이야.","僕、どうしても帰らないといけないんだ。"]]},{"no":24,"title":"장마의 끝","summary":"비의 계절이 끝나고, 숲에서 작별인사를 하는 유지와 미오.","kw":[["気象庁","기상청",""],["梅雨明け","장마가 끝남",""],["お別れ","이별",""],["これっぽっち","요만큼",""],["望まれる","바라다",""]],"s":[["유지","ママ！","엄마!"],["기상캐스터","今日、気象庁は、関東甲信地方の梅雨明けを発表しました。","오늘 기상청은 간토 고신 지방의 장마가 끝났다고 발표했습니다."],["나가세","秋穂さん！","아이오씨!"],["상사","あ、夏だな。","아~ 여름이구나."],["타쿠미","澪！","미오!"],["미오","佑司。ママの言う事、よく聞いて。いい？","유지. 엄마가 하는 말 잘 들어. 알았지?"],["미오","ママは…お別れなの。","엄마는... 헤어져야 해."],["미오","さよならしなきゃならないの。","“안녕? 하지 않으면 안되는거야."],["미오","佑司…","유지..."],["타쿠미","澪！","미오!"],["유지","ママ、ごめんなさい。","엄마 미안해요."],["미오","え？","어?"],["유지","ママは僕のせいで死んじゃったんでしょ？","엄마는 나 때문에 죽은 거잖아."],["미오","バカね。そんな風に思ってたの？","바보야. 그런 식으로 생각했던 거야?"],["유지","だって。","왜냐면."],["미오","そんなことない。","그렇지 않아."],["미오","これっぽっちもない。","요만큼도 그렇지 않아."],["미오","ママが信じられない？","엄마 못 믿 겠어?"],["미오","佑司は、望まれて望まれて生まれてきたの。","유지는 바라고 바라서 태어난 거야."],["미오","パパとママは、そのために出会ったのかもしれない。","아빠와 엄마는 그걸 위해서 만났을 지도 몰라."],["미오","佑司に会うためにね。","유지를 만나기 위해서 말이야."],["미오","佑司は、幸せを運んできたの。","유지는 행복을 가져온 거야."],["미오","ママを幸せにしてくれたの。分かる？","엄마를 행복하게 해준 거야, 알겠니?"],["미오","佑司、素敵な大人になってね。","유지, 멋진 어른이 되어줘."],["미오","パパの事、お願いね。","아빠를 부탁할게."]],"r":[["〜風(に)","식, 〜풍(으로)","今夜の夕食は、韓国風にしてみよう。","오늘 밤의 저녁식사는 한국풍으로 해보자."],["ために","위해서","週末、旅行に行くために、今日は残業だ。","주말에 여행 가기 위해서 오늘은 야근이다."],["〜てくる","해오다, 〜고 오다","ちょっと呼んできて。","잠깐 불러와."]],"q":[["엄마가 하는 말 잘 들어. 알았지?","ママの言う事、よく聞いて。いい？"],["엄마는 나 때문에 죽은 거잖아.","ママは僕のせいで死んじゃったんでしょ？"],["그런 식으로 생각했던 거야?","そんな風に思ってたの？"],["아빠와 엄마는 그걸 위해서 만났을 지도 몰라.","パパとママは、そのために出会ったのかもしれない。"],["유지는 행복을 가져온 거야.","佑司は、幸せを運んできたの。"]]},{"no":25,"title":"작별 인사","summary":"몸이안 좋은 타쿠미는 있는 힘껏 달려 미오를 찾아가 는데...","kw":[["間に合う","시 간에 맞다",""],["物凄く","엄청 나게",""],["親子","부모와자식",""],["居心地がいい","(있기에) 편하다",""]],"s":[["유지","たっくんと会わないの？","탁군이랑 안 만날 거야?"],["미오","うん…どうかな。","응... 글쎄..."],["미오","間に合うかな。","맞게 올 수 있을까?"],["유지","間に合わないよ。たっくんは遅いんだもん。","못 올 거야. 탁군은 느리단 말이야."],["유지","走るの遅いもん。","뛰는게느린걸."],["미오","でもね、佑司。パパは、本当は物凄く足が早かったの。","그런데 말이야, 유지. 아빠는 원래는 달리기가 엄청 빨랐단다."],["미오","とてもかっこよかったわよ。","아주 멋있었어."],["타쿠미","澪。","미오."],["유지","ないよ、ない。","없어, 없어."],["타쿠미","澪！","미오!"],["유지","たっくん！","탁군!"],["타쿠미","澪！","미오!"],["미오","間に合ったね。よかった。","안 늦었네. 다행이다."],["타쿠미","澪…","미오..."],["미오","はい。","네."],["타쿠미","ごめんね。","미안해."],["타쿠미","君を、幸せにしてあげたかった。","너를 행복하게 해주고 싶었어."],["타쿠미","僕は、澪を幸せに出来なかった。","나는 미오를 행복하게 해주지 못했어."],["타쿠미","ごめんね。","미안해."],["미오","何言ってんのよ。","무슨 소리를하는 거야."],["미오","よく似た親子だな。","똑 닮은 아빠와 아들이네."],["미오","幸せだったよ、私は。","행복했어, 나는."],["미오","ずっと幸せだった。","계속 행복했어."],["미오","あなたを好きになってから、ずっと。","당신을 좋아하게 되고 나서부터 계속."],["미오","私の幸せはね、あなたなのよ。","나의 행복은 말야, 당신인 거야."],["미오","あなたのそばにいられたことが、私にとっての幸せだったのよ。","당신 결에 있을 수 있었던 것이 나에게 있어서 행복이었거든."],["미오","出来るなら、ずっといつまでもあなたの隣にいたかった。","할 수 있다면, 계속 언제까지나 당신 결에 있고 싶었어."],["미오","佑司のこと、お願いね。","유지를 부탁할게."],["미오","私の分も愛してあげてね。","내 묶까지 사랑해줘."],["미오","秋穂君、寒いね。","아이오, 춤네."],["미오","ありがとう。","고마워."],["미오","あなたの隣は居心地がよかったです。","당신 옆 자리는 (있기에) 편안했어요."]],"r":[["〜てんの(よ)","고 있는 거야","ねぇ、私の話ちゃんと聞いてんの。","있잖아, 내 얘기 제대로 듣고 있는 거야?"],["〜なら","라면, 〜다면","今日の飲み会、みんな行くなら私も行きます。","오늘 회식 모두 간다면 저도 갈게요."],["にとって","~에게 있어서","あなたにとって、一番大切なものは何ですか。","당신에게 있어서 제일 중요한 것은 무엇입니까?"]],"q":[["응... 글쎄... 맞게 올 수 있을까?","うん…どうかな。間に合うかな。"],["아빠는 원래는 달리기가 엄청 빨랐단다.","パパは、本当は物凄く足が早かったの。"],["무슨 소리를 하는 거야.","何言ってんのよ。"],["똑 닮은 아빠와 아들이네.","よく似た親子だな。"],["당신 옆 자리는 (있기에) 편안했어요.","あなたの隣は居心地がよかったです。"]]},{"no":26,"title":"운명의 상대","summary":"타쿠미는 미오의 일기를 읽고 미오의 과거 속마음을 알게 된다.","kw":[["訪れる","찾아오다",""],["去る","떠나다",""],["惹かれる","끌리 다",""],["相手","상대",""],["気になる","신경 쓰이다",""]],"s":[["유지","あった！ママ、あったよ！","찾았어!엄마,찾았어!"],["유지","ママ…","엄마..."],["노구치","そうですか。","그렇군요."],["타쿠미","はい。","네."],["노구치","雨とともに訪れ、雨とともに去る…","비와 함께 찾아와, 비와 함께 떠난다..."],["노구치","アジサイのような人だねるえ。","수국 같은 사람이네."],["타쿠미","先生、本当に僕の話を信じてくれてるんですか。","선생님, 정말 제 얘기를 믿어주시는 거예요?"],["노구치","さあ、どうでしょう。","글쎄요, 어떨까요."],["타쿠미","でも僕は、もう一度澪に恋をしました。","하지만, 저는 다시 한번 미오를 사랑했어요."],["타쿠미","幸せでした。","행복했어요."],["노구치","そういう出会いを果たせる人は、この世にどれぐらいいるんでしょうね。","그런 만남을 이룰 수 있는 사람은 이 세상에 얼마나 있을까요?"],["노구치","出会ったら、必ず惹かれあってしまう。","만나면, 반드시 서로 끌리게 되어버리는."],["노구치","何度でも、何度でも。","몇 번이고 몇 번이라도."],["노구치","あなたたちは出会ってしまったんですね。","당신들은 만나버렸군요."],["노구치","そのたった一人の相手に。","그 단 한 명의 상대를."],["미오","6月24日。","6월24일."],["미오","今日、私は気になる人を見つけてしまった。","오늘 나는 신경 쓰이는 사람을 찾았다."],["미오","あ、あの。","저, 저기."],["미오","何だか、彼のことを思い出してばかりいる。","왠지 그의 생각만 하고 있어."],["미오","もしかしたら私は恋をしているのかもしれない。","어쩌면 나는 사랑을 하고 있을지도 몰라."],["미오","一年三組、出席番号一番、秋穂巧。","1학년3반 출석 번호 1번, 아이오 타쿠미."]],"r":[["のような","와 같은","あなたのような人は、初めてです。","당신 같은 사람은 처음이에요."],["たった","단, 단지, 겨우","久しぶりなのに、たった1時間しか会えなかったの。","오랜만인데 단 1시간밖에 만날 수 없었어."],["〜てばかり","~하기만,~할 뿐","さっきからずっと、あくびしてばかりだね。","아까부터 계속 하품만 하네."]],"q":[["수국 같은 사람이네.","アジサイのような人だねるえ。"],["하지만 저는 다시 한 번 미오를 사랑했어요.","でも僕は、もう一度澪に恋をしました。"],["당신들은 만나버렸군요.","あなたたちは出会ってしまったんですね。"],["오늘 나는 마음에 드는 사람을 찾았다.","今日、私は気になる人を見つけてしまった。"],["왠지 그의 생각만 하고 있어.","何だか、彼のことを思い出してばかりいる。"]]},{"no":27,"title":"미오의 진심","summary":"타쿠미를 좋아하고 있었던 미오, 마찬가지로 별다른 진전 없이 졸업식을 맞이하게 된다.","kw":[["反則","반칙",""],["納得","납득",""],["学級委員","학급 위원(반장)",""],["権力","권력",""],["行使","행사(어떤 행동을 함)",""]],"s":[["미오","行け！","가!"],["미오","あれは、明らかに反則だ。","저건 명백한 반칙이다."],["미오","納得できない。","납득할 수 없어."],["미오","おとろだけど、自分でも驚いている。","하지만 스스로도 놀라고 있어."],["미오","私は、なんであんなことをしちゃったんだろう。","나는 왜 그런 짓을 했을까."],["미오","やっぱり、私は彼のことが好きなんだ。","역시 나는 그를 좋아하는 거야."],["미오","でも、彼は私の気持ちを全然知らない。","하지만 그는 나의 마음을 전혀 몰라."],["미오","いわゆる、片思いってやつだ。","즉, 짝사랑이란 것이다."],["미오","学級委員の権力を行使して、やっと隣の席になれたのに。","학급위원의 권력을 써서 겨우 옆자리가 되었는데."],["미오","私は声もかけられない。","나는 말도 걸지 못해."],["미오","でも、隣にいられるだけでもいい。","하지만 옆에 있을 수 있는 것만으로도 좋아."],["미오","それだけで、ちょっと、幸せ。","그것 만으로도 조금 행복해."],["미오","秋穂君。あなたのことを知りたい。","아이오. 널 알고 싶어."],["미오","あなたは、何の本を読んでるの？","넌 무슨 책을 읽고 있어?"],["미오","どんな音楽が好き？どんな色が好き？","어떤 음악을 좋아해? 어떤 색을 좋아해?"],["미오","どんな…女の子が好き？","어떤... 여자애를 좋아해?"],["미오","私を好きになってはくれない？","나를 좋아해 주지는 않을래?"],["미오","何も始まらないまま、ついにお別れの日が来てしまった。","아무것도 시작 되지 않은 채 드디어 이별하는 날이 와버렸어."],["미오","どうしよう。","어떡하지."],["미오","どうしたらいいの？","어떡해야 하지?"],["미오","ごめんね。","미안."]],"r":[["〜ってやつ","란 것","もしかして、それプロポーズってやつですか。","혹시 그거 프로포즈란 거예요?"],["〜のに","~인데,~는데","買ったばかりなのに、もう壊れちゃったよ。","산지 얼마 안됐는데 벌써 망가졌어."],["だけでもいい","만이라도 좋다","ちょっとだけでもいいから、会えないかな。","잠깐이라도 좋으니까 만날 수 없을까?"]],"q":[["나는 왜 그런 짓을 했을까.","私は、なんであんなことをしちゃったんだろう。"],["즉 짝사랑이란 것이다.","いわゆる、片思いってやつだ。"],["하지만 옆에 있을 수 있는 것만으로도 좋아.","でも、隣にいられるだけでもいい。"],["나를 좋아해주지는 않을래?","私を好きになってはくれない？"],["어떡해야 하지?","どうしたらいいの？"]]},{"no":28,"title":"행운의 펜","summary":"좀처럼 용기를 내지 못하던 미오는, 타쿠미를 다시 만나게 된다.","kw":[["追いかける","쫓다, 뒤쫓아가다",""],["返す","돌려주다",""],["勇気","용기",""],["幸福","행복",""]],"s":[["미오","書いて。","써줘."],["타쿠미","「ありがとう…君の隣はいごこちがよかったです」-秋穂巧-","'고마워... 너의 옆자리는 있기에 편안했어.' -아이오 타쿠미-"],["미오","あの時、すぐに追いかければ、返せたの。","그 때 바로 쫓아갔으면 돌려줄수 있었어."],["미오","でも、私は行かなかった。","하지만 나는 가지 않았어."],["미오","だって、持っていれば、もう一度彼に会える。","왜냐면 가지고 있으면 한번 더 그를 만날 수 있어."],["미오","返したいって電話をすれば…彼に会えるから。","돌려주고 싶다고 전화를 하면... 그를 만날 수 있으니까."],["미오","電話をすればいい。「ペンを返します」って言うだけだ。","전화를 하면 돼. '펜을 돌려줄게요'라고 말할 뿐이야."],["미오","でも、その勇気が出ない。","하지만 그 용기가 나지 않아."],["미오","いいえ、ごめんなさい。大事なペンを。","아니요, 미안해요. 중요한 펜을."],["미오","たぶん、あると思います。","아마 있을 거예요."],["미오","驚いた。彼のほうから電話をくれるなんて。","놀랐어. 그쪽에서 먼저 전화를 주다니."],["미오","「はい、わかりました。」","네, 알겠어요."],["미오","会えるんだ。これは、幸福を呼ぶペン。","만날 수 있다. 이건 행복을 부르는 펜."],["미오","はい。","자."],["타쿠미","ありがとう。","고마워."],["타쿠미","久しぶりだね。元気だった？","오랜만이네. 잘 지냈어?"],["미오","ええ。","네."],["타쿠미","あ…そう。","아... 그래."],["타쿠미","じゃ。","그럼 이만."],["미오","じゃ。","그럼 이만."]],"r":[["すぐに","곧, 바로","すぐに戻ります。","바로 돌아갈(올)게요. ~다고,~라고"],["日曜日、私も行くって言いました。","","","일요일, 나도 간다고 했어요."],["〜すれば","하면","運動すれば、今より健康になるかもしれない。","운동하면 지금보다 건강해질 지도 몰라."]],"q":[["그 때 바로 쫓아갔으면 돌려줄 수 있었어.","あの時、すぐに追いかければ、返せたの。"],["왜냐면 가지고 있으면 한번 더 그를 만날 수 있어.","だって、持っていれば、もう一度彼に会える。"],["'펜을 돌려줄게요'라고 말할 뿐이야.","「ペンを返します」って言うだけだ。"],["아마 있을 거예요.","たぶん、あると思います。"],["그쪽에서 먼저 전화를 주다니.","彼のほうから電話をくれるなんて。"]]},{"no":29,"title":"마지막 편지","summary":"어느 날 갑자기 타쿠미에게서 온 편지를 보고 미오는 타쿠미를 만나러 간다.","kw":[["温かい","따뜻하다",""],["届く","도 착하다 (편지나 물건)",""],["〜行","~줄",""]],"s":[["미오","ダメだ、私は。","틀렸어,난."],["미오","あんなに会いたかったくせに、このまま帰っちゃうの？","그렇게 만나고 싶어했으면서 이대로 돌아가는 거야?"],["미오","それでいいの？","그걸로 괜찮은거야?"],["타쿠미","あの。","저기."],["타쿠미","コーヒーとか飲む時間ない？","커피라든지 마실 시간 없어?"],["미오","ある。","있어."],["미오","まるで、ダムが決壊したみたいに、あなたはしゃべり続けてた。","마치 댐이 무너지는 것처럼 당신은 계속 얘기를 했어."],["미오","私は何も話せなかった。","나는 아무 얘기도 못했어."],["미오","でも、すごく幸せだった。","하지만 엄청 행복했어."],["미오","あなたの隣にいられることが。","당신 옆에 있을 수 있는 것이."],["미오","ずっとこの時間が続けばいいのに。","이 시간이 계속 됐으면 좋을 텐데..."],["미오","あなたの手は、とても温かかった。","당신의 손은 아주 따뜻했어."],["미오","でも、春が来て、あなたから手紙が届いた。","하지만 봄이 오고, 당신한테 편지가 왔어."],["미오","たった三行の。","단 3줄의."],["미오","どうして？","어째서?"],["타쿠미","また会えるといいね。同窓会とかでさ。","또 만날 수 있었으면 좋겠네. 동창회라든지에서 말야."],["타쿠미","お互い結婚してたりして。","서로 결혼했다든지."],["타쿠미","幸せになってほしいな。えのきださんには。","행복해졌으면 좋겠어. 에노키다씨는."],["미오","私の…","나의..."],["타쿠미","じゃ。","그럼 이만."],["미오","私の幸せはあなたの隣にいることなのに。","나의 행복은 당신 옆에 있는 건데."],["미오","ずっとあなたと一緒にいたい。それだけなのに。","계속 당신과 함께 있고 싶어. 그것 뿐인데."],["미오","本当に、私たちはこれで終わりなの？","정말 우리는 이걸로 끝나는 거야?"]],"r":[["まるで","마치","まるで、私のせいみたいに言わないでください。","마치 나 때문인 것처럼 말하지 마세요."],["〜ばいいのに","하면 좋을 텐데","一緒に行けばいいのに。","같이 가면 좋을 텐데."],["てほしい","했으면 좋겠다, 〜하길 바라다","私の気持ち分かってほしいなぁ。","내 마음을 이해했으면 좋겠구나."]],"q":[["그렇게 만나고 싶어 했으면서 이대로 돌아가는 거야?","あんなに会いたかったくせに、このまま帰っちゃうの？"],["나는아무얘기도못했어.","私は何も話せなかった。"],["이 시간이 계속 됐으면 좋을 텐데...","ずっとこの時間が続けばいいのに。"],["나의 행복은 당신 옆에 있는 건데.","私の幸せはあなたの隣にいることなのに。"],["정말 우리는 이걸로 끝나는 거야?","本当に、私たちはこれで終わりなの？"]]},{"no":30,"title":"밝혀진 비밀","summary":"도 쿄로 찾아온 타쿠미를 멀리서 알아본 미오는 그를 뒤쫓는다.","kw":[["たまらない","견딜 수 없다",""],["抱かれる","안기다",""],["未来","미래",""]],"s":[["미오","私は会いたい。","나는 만나고 싶어."],["미오","秋穂君に会いたい。","아이 오를 만나고 싶어."],["미오","たまらなく会いたい。","못 견디게 만나고 싶어."],["미오","秋穂君？","아이오?"],["미오","ごめんなさい。","미안해요."],["미오","秋穂君！","아이오!"],["미오","巧！","타쿠미! 유지 ： ! 엄마!"],["타쿠미","澪。","미오."],["타쿠미","おはよう。","좋은 아침."],["미오","おはよう。","좋은 아침."],["미오","たぶん、誰に言っても信じてもらえないだろう。","아마 누구에게 말해도 믿어 주지 않겠지."],["미오","自分でも、まだ信じられない。","스스로도 아직 믿기지 않아."],["미오","20歳の私は、29歳のあなたに出会い、恋をして、抱かれたの。","20살의 나는 29살의 당신과 만나서 사랑을 하고 품에 안겼어."],["미오","私は、未来へジャンプした。","나는 미래로 점프했어."],["미오","9年後の雨の季節に。","9년 후 비의 계절로."],["미오","私は巧と結ばれていて、私たちの間には、佑司という可愛い男の子がいた。","나는 타쿠미와 결혼했고, 우리 사이에는 유지라는 귀여운 남자 아이가 있었다."],["미오","幸せだった。","행복했어."],["미오","幸せな暮らしだった。","행복한 시간이었어."],["미오","あなたにもう一度恋をしたわ。","당신에게 한번 더 사랑을 했지."],["미오","でも、私は知ってしまった。","하지만 나는 알아버렸어."],["미오","本当の私は、1年前に死んでしまっている事を。","진짜 나는 1년 전에 죽어버렸다는 것을."],["미오","私は死んでしまう。","나는 죽어버린다."],["미오","28歳で。","28살로."],["미오","愛する巧と佑司を残して。","사랑하는 타쿠미와 유지를 남겨두고."],["미오","死んでしまうんだ、私は。","죽어 버리는구나, 나는."],["미오","1年後の雨の季節に戻ってくると約束して。","1년 후 비의 계절에 돌아온다고 약속하고."]],"r":[["〜てもらえない","~해 받을 수 없다,~주지 않는다","やっぱり、許してもらえないですよね。","역시 용서해주지 않겠죠?"],["〜の間","사이","最近、学生たちの間で流行ってるんです。","요즘 학생들 사이에서 유행하고 있어요."],["〜わ","~지, ~요, ~래","もうすぐ会えるわ。","이제 곧 만날 수 있지."]],"q":[["아마 누구에게 말해도 믿어주지 않겠지.","たぶん、誰に言っても信じてもらえないだろう。"],["20살의 나는 29살의 당신과 만나서 사랑을 하고 품에 안겼어.","20歳の私は、29歳のあなたに出会い、恋をして、抱かれたの。"],["당신에게 한번 더 사랑을 했지.","あなたにもう一度恋をしたわ。"],["진짜 나는 1년전에 죽어버렸다는 것을.","本当の私は、1年前に死んでしまっている事を。"],["1년 후 비의 계절에 돌아온다고 약속하고.","1年後の雨の季節に戻ってくると約束して。"]]},{"no":31,"title":"영원히 함께","summary":"미래를모두 알아버린 미오는 고민에 빠지게 된다.","kw":[["(人生を)送る","(인생 을) 보내다",""],["産む","낳다",""],["選ぶ","선택하다",""],["迎え入れる","맞아들이다",""]],"s":[["미오","秋穂君？巧？","아이오? 타쿠미?"],["미오","もし、このまま、あなたと会わなければ、私は違う誰かと結ばれて、違う人生を送るの？","만약 이대로 당신과 만나지 않으면 나는 다른 누군가와 결혼해서 다른 인생을 사는 걸까?"],["미오","28歳で死んだりしない、未来が…待ってるの？","28살로 죽거나 하지 않는 미래가... 기다리는 거야?"],["미오","でも、私は嫌。","하지만 나는 싫어."],["미오","あなたを愛しているから。","당신을 사랑하니까."],["미오","あなたとの未来を知ってしまったから。","당신과의 미래를 알아버렸으니까."],["미오","あなたと会って、結ばれて、佑司という子供を産む人生を選びたい。","당신과 만나서 결혼을 하고 유지라는 아이를 낳는 인생을 선택하고 싶어."],["미오","佑司を、この世界に迎え入れてあげたい。","유지를 이 세상에 태어나게 해주고 싶어."],["미오","どうしても、そうしたい。","어 떻게든 그러고 싶어."],["미오","もしもし、秋穂君？","여보세요, 아이오?"],["미오","私、会いに行ってもいい？","나 만나러 가도 돼?"],["미오","たとえ短くても、愛するあなたたちと一緒にいる未来を、私は選びたい。","설령 짧다고 하더라도 사랑하는 당신들과 함께 있는 미래를 나는 선택하고 싶어."],["미오","秋穂君。巧。佑司。","아이오. 타쿠미. 유지."],["미오","待っていてください。","기다려주세요."],["미오","いま、会いにゆきます。","지금 만나러 갑니다."]],"r":[["〜なければ","하지 않으면","彼女に言わなければ、噂にならなかったのに。","그녀에게 말하지 않으면 소문 나지 않았을 텐데."],["てあげたい","~해주고 싶다","彼の事、応援してあげたいんです。","그를 응원해주고 싶거든요."],["たとえ〜ても","설령 ~하더라도","たとえ辛くても、最後まで諦めないで。","설령 힘들더라도 끝까지 포기하지 마."]],"q":[["28살로 죽거나 하지 않는 미래가... 기다리는 거야?","28歳で死んだりしない、未来が…待ってるの？"],["당신과의 미래를 알아버렸으니까.","あなたとの未来を知ってしまったから。"],["유지를 이 세상에 태어나게 해주고 싶어.","佑司を、この世界に迎え入れてあげたい。"],["설령 짧다고 하더라도 사랑하는 당신들과 함께 있는 미래를 나는 선택하고 싶어.","たとえ短くても、愛するあなたたちと一緒にいる未来を、私は選びたい。"],["지금 만나러 갑니다.","いま、会いにゆきます。"]]},{"no":32,"title":"12년 후","summary":"미 오와 타쿠미는 다시 만나 영원한 사랑을 약속하게 되고, 기적이 일어난 후 12년이 흐른다.","kw":[["背(が)伸びる","키(가) 크다, 자라다",""],["背伸びする","까치 발 들다, 뒤꿈치 들다",""]],"s":[["미오","もう、なんて顔してるの。","아이참, 표정이 왜그래."],["타쿠미","だってさ。","왜냐면."],["미오","そんな顔しないの。","그런 표정 짓지 마."],["타쿠미","72ㅇ、僕は澪にはふさわしくないと思うから…","왜냐면 난 미오에게 어울리지 않다고 생각하니까."],["미오","そんなことない、バカね。","그렇지 않아, 바보구나."],["미오","大丈夫よ。大丈夫、私たちは。","괜찮아. 괜찮을 거야, 우리는."],["미오","私とあなたはずっと一緒なの。","나와 당신은 계속 함께 할 거야."],["미오","そう決められてるのよ。","그렇게 정해져 있는 거야."],["타쿠미","決められて？","정해져 있다고?"],["미오","そう、たったひとりの相手なのよ。","그래, 단 하나뿐인 상대란 말이야."],["미오","好きよ。","좋아해."],["유지","たっくん。","탁군."],["타쿠미","うん？","응?"],["유지","そろそろ始めよっか。","슬슬 시 작할까?"],["타쿠미","うん。誕生日なのに、カレーでいいの？","생일인데, 카레로 되 겠어?"],["유지","いいよ。たっくんのカレー好きだもん。","괜찮아. 탁군이 만든 카레 좋아하는 걸."],["유지","はい。","자."],["타쿠미","おぉ、また背伸びたんじゃないの？","오~, 또 키 큰 거 아냐?"],["타쿠미","後ろ向いて、ほら。","뒤 돌아봐, 얼른."],["타쿠미","背伸びしちゃだめだって。","뒤꿈치들면SE된다니까."],["유지","してないよ。","안 했다니까."]],"r":[["〜(よ)っか","~할까?","じゃ、一緒に食べよっか。","그럼 같이 먹을까?"],["って","~라니까,~다니까","だから、私も知らないって。","그러니까 나도 모른다니까."],["〜てない","~지 않았다","ご飯、まだ食べてないんです。","밥, 아직 안 먹었어요."]],"q":[["그런 표정 짓지마.","そんな顔しないの。"],["나와 당신은 계속 함께 할 거야.","私とあなたはずっと一緒なの。"],["그래, 단 하나뿐인 상대란 말이야.","そう、たったひとりの相手なのよ。"],["생일인데, 카레로 되겠 어?","誕生日なのに、カレーでいいの？"],["뒤꿈치 들면 안 된다니까.","背伸びしちゃだめだって。"]]}],"id":"v1","volume":"1","title":"지금 만나러 갑니다","ja_title":"いま、会いにゆきます","year":"2004","description":"비의 계절에 돌아온 엄마, 그리고 6주간의 기적. 다정한 가족 대화로 배우는 일본어."},{"lessons":[{"no":1,"title":"오노데라家","summary":"남동생인 스스무의 과거 회상 장면부터 영화가 시작된다.","kw":[["ひどい目にあう","심한 일을 당하다",""],["耳元","귓가",""],["(悲しみに)暮れる","(슬픔에) 잠기다",""]],"s":[["스스무","姉に、殺意を抱いたことが、これまでに三度ある。","누나에게 살인 충동을 느낀 적이 지금까지 세 번 있다."],["스스무","一度目は幼稚園児だった俺に、","첫 번째는 유치 원생이었던 나에게"],["스스무","唐辛子を「かりんとうのようなもの」だと食べさせたあの日。","고추를 '과자 같은 거'라며 먹였던 그 날."],["스스무","軽いいたずらなのだろうが、とにかくひどい目にあった。","가벼운 장난이었겠지만 어쨌든 심한 일을 당했다."],["스스무","二度目の殺意は小2の夏休み。","두 번째 살인 충동은 초등학교 2학년 여름방학 때."],["스스무","ヒーローショーを観てはしゃぐ俺の耳元で、","히어로 쇼를 보고 신난 나의 귓가에서,"],["요리코","アレ、中の人、アルバイト。お金の為にやってんだよ。","저거, 안에 있는 사람, 아르바이트생. 돈 때문에 하는 거야."],["스스무","と、聞きたくもない現実をささやかれた瞬間…","라고 듣고 싶지도 않은 현실을 속삭였던 순간."],["스스무","そして、ショックを受け、悲しみに暮れる俺に","그리고 충격을 받아 슬픔에 잠긴 나에게"],["요리코","ついでに言っとくけど、サンタクロース ~ 당신의 어프로치."],["요리코","初めて会った日から、猛アタックで大変だったんですよ。","처음 만난 날부터 엄청나게 들이대서 힘들었거든요."],["요리코","顔合わせるたんびに、デートしようって人迫ってきて。","얼굴 마주칠 때마다 데이트하자고 다가와서."],["요리코","でも、私も遊び半分で恋愛できる年じゃないじゃないですか？","근데 저도 심심 풀이로 연애할 수 있는 나이가 아니잖아요."],["요리코","だから断り続けてたんですよ。","그래서 계속 거절했었거든요."],["요리코","そしたら、仕事終わりに花束持って現れて、人目も気にせず大声で告白。","그랬더니 일 끝나고 꽃다발 들고 나타나서 남의 눈도 신경 안 쓰고 큰소리로 고백..."]],"r":[["猛アタック","열렬 대시","",""],["猛スピード","과속","",""],["猛ダッシュ","전력 돌진","",""],["続ける","동사 + 계속 〜하다","",""],["り続ける","빠 계속 거절하다","",""],["謝り続ける","계속 사과하다","",""],["待ち続ける","계속 기다리다","",""],["人目","남의 눈","",""],["人目を気にする","남의 눈을 신경 쓰다","",""],["人目につく","남의 눈에 띄다","",""],["人目をひく","사람들 시선을 끌다","",""]],"q":[["또 만나면 귀찮으니까 오늘은 이만 돌아가.","また会ったら面倒だから、今日はもう帰って。"],["중학교 동창 오노데라.","中学の小野寺。"],["처음 만난 날부터 엄청나게 들이대서 힘들었거든요.","初めて会った日から、猛アタックで大変だったんですよ。"],["그래서 계속 거절했었거든요.","だから断り続けてたんですよ。"],["그랬더니 일 끝나고 꽃다발 들고 나타나서 남의 눈도 신경 안 쓰고 큰소리로 고백...","そしたら、仕事終わりに花束持って現れて、人目も気にせず大声で告白。"]]},{"no":31,"title":"콤플렉스","summary":"코다마의 별명 맛치가 어쩐지 낯이 익은 스스무.","kw":[["ー目","첫눈, 한눈",""],["ごぼう抜き","(우엉을 뽑듯) 쉽게 앞서감",""]],"s":[["요리코","後で聞いたら、一目惚れだったって。ねぇ？","나중에 물어보니까 첫눈에 반했다고. 그치?"],["부인","いいわねぇ。","좋겠네~"],["코다마","まさか、まさかだよ、あのデカベン小野寺がこんなイケメンと…","설마 설마 말이야, 그 데카벤(왕도시락) 오노데라가 이런 훈남이랑..."],["부인","え、デカベン？","뭐, 데카벤(왕도시락)?"],["코다마","あだ名だよ。ㅎㅎ重箱みたいなでっかい弁当箱持って来ててさ。","별 명이야. 항상 찬합 같은 엄청 큰 도시락 갖고 와서 말이야."],["요리코","やめてよ、恥ずかしい。","그만해~부끄러워."],["코다마","どれだけバカにされても使い続けてたんだよ。","아무리 놀림을 당해도 계속 썼었거든."],["코다마","弟が選んでくれたやつだからって。","남동생이 골라준 거라고."],["요리코","もう、昔の話はやめてよ。マッチ。","옛날 얘기는 이제 그만해. 맛치."],["스스무","マッチ？","맛치?"],["부인","あなたのあだ名？","당신 별명이야?"],["코다마","そうそう。","그래 그래."],["부인","えー","뭐야~"],["코다마","アイドルのあの人は関係なくて、","아이돌인 그 사람은 관계 없고,"],["코다마","俺児玉だからコダマッチになってマッチだけが残る、","나 코다마니까 “코다맛치`가 돼서 맛치만 남은,"],["코다마","原型が無くなったパターンだよ。","원형이 없어진 패턴이야."],["스스무","…マッチ。","맛치."],["요리코","マッチ、面白いんだよ。","맛치 재미있어."],["요리코","授業中にさ、滝廉太郎が三宅くんに似てるって言い出してさ、","수업 중에 타키렌타로가 미야케랑 닮았다고 말해서"],["요리코","もう先生もうけちゃって全然授業になんなくなっちゃって。","선생 님도 웃겨서 전혀 수업을 못하게 되어버려서."],["스스무","そいつの話ばっかり…","그 녀석 얘기뿐..."],["요리코","あ、あとね、マッチ、すっごい足速いの。","아, 그리고 맛치 되게 달리기 잘해."],["요리코","リレーで5人ごぼう抜きしてすごかったんだよ。","릴레이에서 5명을 쉽게 앞지르고 대단했거든."],["요리코","あ、あとマッチさ。","아 그리고 맛치 말이야."],["요리코","え！ちょ、やめてよ進！進やめて！放して！進！","야! 잠깐, 그만해 스스무! 스스무 하지마! 놔줘! 스스무!"],["요리코","進、大丈夫？","스스무, 괜찮아?"],["요리코","大丈夫？怪我ない？","괜찮아? 다친 데 없어?"],["스스무","ごめんなさい！ごめんなさい！","미안해요. 미안해요."],["요리코","ちゃんとごめんなさい出来て偉いね。","제대로 사과할 줄 알고 기특하네."]],"r":[["一目","한번 봄, 잠깐 봄","",""],["パッと見","언뜻 봄, 잠깐 봄","",""],["ちら見","언뜻 봄, 힐끔 봄","",""],["ウケる(受ける)","웃기다, 재미있다","",""],["スべる(滑る)","분위기가 썰렁해지다","",""],["モテる(持てる)","인기가많다","",""],["抜き","뱀, 제외함","",""],["ごぼう抜き","(우엉을 뽑듯이) 쉽게 앞서감","",""],["(わ)さび抜き","와사비 빼기","",""],["染み抜き","얼룩 빼기","",""]],"q":[["나중에 물어보니까 첫눈에 반했다고. 그치?","後で聞いたら、一目惚れだったって。ねぇ？"],["별 명이야. 항상 찬합 같은 엄청 큰 도시락 갖고 와서 말이야.","あだ名だよ。ㅎㅎ重箱みたいなでっかい弁当箱持って来ててさ。"],["옛날 얘기는 이제 그만해. 맛치.","もう、昔の話はやめてよ。マッチ。"],["원형이 없어진 패턴이야.","原型が無くなったパターンだよ。"],["릴레이에서 5명을 쉽게 앞지르고 대단했거든.","リレーで5人ごぼう抜きしてすごかったんだよ。"]]},{"no":32,"title":"폭로","summary":"히라마츠 선생님을 오랜만에 만나게 된 오노데라 남매.","kw":[["大人気","인기 많음",""],["教え子","가르치는 아이, 제자",""],["笑い方","웃는 방법(모습)",""]],"s":[["코다마","小野寺もさぁ〜、昔からひょうきんな奴でさ。","오노데라도 말이야~ 옛날부터 재미있는 애라서,"],["코다마","変な顔して笑かせたりして。","이상한 표정해서 웃겨주기도 하고."],["요리코","こういうのよくやってた。ほら、ジョーズ。","이런 거 자주 했었지. 그거 있잖아, 죠스."],["코다마","出た！映画のポスター！","나왔다! 영화 포스터!"],["요리코","ここに目書いたりして。","여기에 눈 그리기도 하고."],["코다마","大人気だよ。他のクラス回ったもんな。","인기 많지. 다른 반에도 돌아다녔지."],["요리코","回ってた、回ってた。","돌아다녔었지~"],["코다마","退院したらさ、二人でうち遊び来いよ。","퇴원하면 둘이서 우리 집에 놀러 와라."],["부인","あぁ、是非いらして下さい。","아~ 꼭 오세요."],["요리코","もちろん。ね？","물론이지, 그치?"],["스스무","ええ…","네..."],["코다마","もう、仲いいなあ。","참 사이 좋네."],["코다마","じゃな。","갈게."],["코다마","平松先生！","히라마츠 선생님."],["코다마","先生、覚えてますよね？","선생님,기억하시죠?"],["코다마","小野寺、中学の時同じクラスだった。","오노데라, 중학교 때 같은 반이었던."],["히라마츠","あぁ、小野寺か、久しぶりだなぁ。","어~ 오노데라구나, 오랜만이구나."],["히라마츠","おおぉお。33も一緒か。","오! 남동생도 같이 있구나."],["코다마","え？？","뭐? 히라마츠: いや、小野寺の 로 も担任したんだ、な?久しぶり。 아니, 오노데라 동생도 담임했었어, 그치? 오랜만이야."],["코다마","そうか…それは、悪いことしたなぁ。","그렇구나... 그건 미안한 짓을 했네."],["요리코","いえ、私が悪いんです。","아뇨... 제가 잘못한 거예요."],["히라마츠","小野寺の弟もよく付き合ってやったな。","오노데라 동생도 잘 맞춰줬네."],["스스무","まぁあ。","뭐 그냥..."],["히라마츠","え、しかし、こうして教え子と会えるのは嬉しいが、","그런데 이렇게 제자를 만나는 건 기쁘지만"],["히라마츠","それが病院っていうのはなぁ。","그게 병원이란 게 좀..."],["스스무","先生はどうして？","선생님은 어째서?"],["히라마츠","あれだ、あの、心臓結石。","그거야, 그 심장결석."],["스스무","腎臓結石？","신장결석?"],["히라마츠","それ。","그거."],["요리코","心臓に石溜まったら大変ですよ先生。","심장에 돌 쌓이면 큰일이죠~ 선생님."],["요리코","相変わらずですね。","여전하시네요."],["히라마츠","君も相変わらずだね。","너도 여전하네~"],["요리코","え？","네?"],["히라마츠","その笑い方。","그 웃는 모습."]],"r":[["大〜","많은~","",""],["大人気","인기 많음","",""],["大好評","대호평","",""],["大ヒット","대히트","",""],["〜子","한 아이, 사람","",""],["教え子","가르치는 아이, 제자","",""],["末っ子","막내","",""],["売れっ子","인기 많은 사람(연예인)","",""],["〜方","방법, 〜한 모습","",""],["笑い方","웃는 방법(모습)","",""],["泣き方","우는 방법(모습)","",""],["話し方","말하는 방법, 말투","",""]],"q":[["오노데라도 말이야~ 옛날부터 재미있는 애라서,","小野寺もさぁ〜、昔からひょうきんな奴でさ。"],["여기에 눈 그리기도 하고.","ここに目書いたりして。"],["인기 많지. 다른 반에도 돌아다녔지.","大人気だよ。他のクラス回ったもんな。"],["그런데 이렇게 제자를 만나는 건 기쁘지만","え、しかし、こうして教え子と会えるのは嬉しいが、"],["그 웃는 모습.","その笑い方。"]]},{"no":33,"title":"술 한잔","summary":"길에서 우연히 만난 친구와 함께 술을 한잔 하는 스스무.","kw":[["様になる","잘 어울리고 멋있다, 그럴 듯 하다",""],["くたびれる","피곤하다, 지치다, 오래 되다",""],["昼ドラ","낮 드라마",""]],"s":[["친구","おう！おい、小野寺！","야!어이, 오노데라!"],["스스무","えー！どしたの、それ。","어~! 어떻게 된 거야? 그거..."],["스스무","え？","어?"],["친구","いやいやいやいや、俺が就職するわけねぇじゃん。","아니아니아니아니, 내가 취직할 리가 없잖아."],["스스무","紛らわしい…","헷갈리게..."],["친구","結構サマんなってんだろ？","꽤 그럴 듯 하지?"],["스스무","すいません。おかわり。","여기요, 리필이요."],["점원","はーい。","네~"],["친구","次の舞台、くたびれた会社員役なんだよ。","다음 무대가 지친 회사원 역할이거든."],["친구","だからまずスーツをくたびれさせようと思ってざさ。","그래서 우선 양복을 지치게 만들려고."],["스스무","くたびれた会社員…","지친 회사원..."],["친구","俺も普通に就職してサラリーマンやってたら、","나도 평범하게 취직해서 회사원 했으면"],["친구","そろそろくたびれてくる歳になってんだよなぁあ。","슬슬 지치게 될 나이가 되어 있었겠지..."],["친구","たまに悩むんだよなぁ…このままでいいのか。","가끔 고민 된단 말이야. 이대로 괜찮을지."],["친구","三十過ぎて売れない役者って…","서른 넘어서 무명 배우라니..."],["친구","まぁ、幸せの定義なんてないからな。","뭐, 행복의 정의라는 건 없으니까."],["친구","すみません、肉じゃが。","여기요~ 니쿠쟈가(감자 조림)."],["점원","はい。","네."],["친구","でよぉ！お前はどうなのよ。","그래서! 넌 어떠냐?"],["스스무","え？","뭐?"],["친구","彼女いない歴、どこまで更新する気だよ。","여자친구 없는 기록을 어디까지 갱신할 생각인 거야?"],["스스무","今は恋愛とか…","지 금은 연애 같은 건..."],["친구","まだ好美ちゃんのこと引きずってんだろ？","아직 요시미에게 미련이 남아 있는 거지?"],["친구","情けないな、小野寺も意外と。","한심하구만, 오노데라도 의외로."],["친구","前の恋が忘れられないなんて、昼ドラの主人公か！違うか？","옛 사랑을 못 잊다니, 낮 드라마 주인 공이냐! 아니야?"],["스스무","だからそういうんじゃない。","그러니까 그런 게 아니야."],["친구","嘘つけ！未だに好美ちゃん…","거짓말쟁이! 아직 요시미..."],["스스무","本当に違うって！！","정말 아니라니까!!!"],["친구","おい…","야..."],["스스무","確かに好美は大事な人だったけど。","확실히 요시미는 소중한 사람이었지만..."],["스스무","引きずってるわけじゃない。","미 련이 남아 있는 건 아냐."],["스스무","別れるしかなかったから。","헤어질 수밖에 없었으니까."]],"r":[["様になる","유의어 그럴 듯 하다, 잘 어울리고 멋있다","",""],["似合う","어울리다","",""],["決まる","틀(모양)이 잡히다","",""],["かっこいい","멋있다","",""],["くたびれる","피곤하다, 지치다, 오래 되다","",""],["くたびれる","피곤하다","",""],["待ちくたびれる","기다리다 지치다","",""],["くたびれた服","오래된옷","",""],["ドラマ","종류","",""],["朝ドラ","아침 드라마","",""],["昼ドラ","낮 드라마","",""],["連ドラ","연속 드라마","",""]],"q":[["다음 무대가 지친 회사원 역할이거든.","次の舞台、くたびれた会社員役なんだよ。"],["그래서 우선 양복을 지치게 만들려고.","だからまずスーツをくたびれさせようと思ってざさ。"],["지친 회사원...","くたびれた会社員…"],["슬슬 지치게 될 나이가 되어 있었겠지...","そろそろくたびれてくる歳になってんだよなぁあ。"],["옛 사랑을 못 잊다니, 낮 드라마 주인 공이냐! 아니야?","前の恋が忘れられないなんて、昼ドラの主人公か！違うか？"]]},{"no":34,"title":"헤어짐","summary":"스스무와 요시미가 헤어지게 된 계기는...","kw":[["姉弟","남매(누나, 남동생)",""],["世話","신세, 보살핌, 도와줌",""],["面倒","돌봄, 보살핌",""]],"s":[["요시미","じゃあ、私の部屋に住んじゃえば？","그럼 내방에 사는 건 어때?"],["스스무","だったら、好美がうちに住めばいいだろ？","그러면 요시미가 우리 집에 살면 되잖아."],["요시미","うん。",""],["스스무","え、そんなにうちで暮らすのいや？","어, 그렇게 우리 집 에서 사는 게 싫어?"],["요시미","別にそうじゃないけど。","딱히 그런 건 아니지만."],["스스무","けど、なんだよ。","아니지만, 뭐야?"],["요시미","もういい。この話。","이제 됐어. 이 얘기는."],["스스무","同棲したいって言いだしたの、好美だろ？","동거하고 싶다고 말 꺼낸 건 요시미잖아."],["요시미","だって、違うじゃん。","왜냐면... 틀리잖아."],["스스무","え？違うってなんだよ。","뭐? 틀리다는 게 뭐야?"],["요시미","もういいよ。","이제 됐어."],["스스무","もしかして…姉ちゃんと一緒が嫌なの？","혹시... 누나랑 같이 사는 게 싫어?"],["요시미","嫌なんて言ってない。","싫다고는 안 했어."],["스스무","でも、姉ちゃんのいるここには住みたくないんだろ。","그런데 누나가 있는 여기에는 살기 싫은 거잖아."],["요시미","このままだとお姉さんの為にもならないし。","이대로라면 누나에게도 도움이 안 될거고."],["스스무","は？","뭐?"],["요시미","だってそうでしょ？","그게 그렇잖아."],["요시미","姉いつまでも一緒にいられる訳じゃないし。","남매가 언제까지 같이 있을 수는 없잖아."],["요시미","一人に慣れてもらわないと。","혼자인 거에 익숙해져야지."],["스스무","姉ちゃんが、ずっと一人って決めつけんなよ。","누나가 계속 혼자일거라고 단정짓지 마."],["스스무","前にも話したよね？","전에도 얘기했지?"],["스스무","姉ちゃんには色々世話になってんだよ。","누나한테는 여러 가지 신세를 지고 있단 말이야."],["스스무","親早くに死んじゃって、中学くらいから俺の面倒でたくさん我慢させて。","부모님이 일찍 돌아가시고 중학교 때부터 나를 돌보느라 많이 참게 하고."],["스스무","だから、まずは、姉ちゃんに幸せになってもらいたいって…","그러니까 우선 누나가 행복해졌으면 한다고..."],["요시미","じゃあ、私は…ずっと待ってなきゃいけないの？","그럼 나는... 계속 기다리고 있어야 하는 거야?"],["스스무","いや、ずっとじゃないって。","아니, 계속이 아니라니까."],["요시미","こんな質問するの嫌だけど。","이런 질문하기 싫은데..."],["요시미","私とお姉さん、どっちが大事？","나랑 누나, 누가 더 중요해?"],["요시미","ちょっと変だよね。進とお姉さんって。","좀 이상해. 스스무랑 누나는."],["요시미","ごめん。ごめんね、いやなこと言って。","미안. 미안해... 싫은 소리 해서."],["요시미","もういいよ。うん、もういい。","이제 됐어... 응, 됐어."]],"r":[["姉弟","남매(누나, 남동생)","",""],["兄弟","형제","",""],["姉妹","자매","",""],["兄妹","남매(오빠, 여동생)","",""],["世話","신세, 보살핌, 도와줌","",""],["世話になる","신세를 지다","",""],["世話をする","돌보다","",""],["世話を焼く","보살펴주다, 애쓰다","",""],["面倒","돌봄, 귀찮음, 폐","",""],["面倒くさい","귀찮다","",""],["面倒をかける","폐를 끼치다","",""],["面倒を見る","돌보아 주다","",""]],"q":[["그럼 내방에 사는 건 어때?","じゃあ、私の部屋に住んじゃえば？"],["이제 됐어. 이 얘기는.","もういい。この話。"],["혹시... 누나랑 같이 사는 게 싫어?","もしかして…姉ちゃんと一緒が嫌なの？"],["누나한테는 여러 가지 신세를 지고 있단 말이야.","姉ちゃんには色々世話になってんだよ。"],["부모님이 일찍 돌아가시고 중학교 때부터 나를 돌보느라 많이 참게 하고.","親早くに死んじゃって、中学くらいから俺の面倒でたくさん我慢させて。"]]},{"no":35,"title":"독선적","summary":"누나에게 늘 죄책감을 가지고 있던 스스무는 속마음을 친구에게 털어놓는다.","kw":[["元凶","원흉",""],["辞退","사퇴",""]],"s":[["스스무","お前だって知ってるだろ？","너도 알잖아."],["스스무","姉ちゃんの歯のこと。","누나 이 말이야."],["스스무","全部俺のせいっていうか…","전부 나 때문이랄까..."],["스스무","俺が姉ちゃんの歯、あんなふうにしちゃって…","내가 누나 이, 저렇게 만들어버려서..."],["스스무","姉ちゃん、ああなってから、好きな子の話一切しなくなってさ。","누나 저렇게 되고 나서부터 좋아하는 사람 얘기를 전혀 안 하게 돼서."],["스스무","それからもう、そういうの一切。","그리고 나서부터 그런 거 전혀..."],["스스무","元凶はあの歯なんだよ。あの歯。","원흉은 그 이인 거야. 그 이."],["스스무","それで、姉ちゃん今でも独りでいるのに、俺が先に幸せになるなんて。","그래서 누나가 지금도 혼자 있는데 내가 먼저 행복해지다니..."],["친구","本気でそう思ってんの？","진심으로 그렇게 생각해?"],["친구","それで小野寺の姉ちゃん喜ぶか？","그래서 오노데라 누나가 좋아할까?"],["친구","それ、お前の独りよがりってやつじゃないかな？","그게 너의 독선이란 게 아닐까?"],["친구","俺が小野寺の姉ちゃんだったらやだもん。","내가 오노데라 누나라면 싫은걸."],["친구","自分のせいで、お前が幸せ諦めたなんて。","자기 때문에 너가 행복을 포기했다니."],["히라마츠","ずっと、君のことは気になってたんだ。","계속 너는 신경 쓰였어."],["히라마츠","何でせっかく推薦されたのに、学級委員長になるのを辞退するんだ？","왜 모처럼 추천을 받았는데 반장 되는 걸 사퇴하는 거야?"],["요리코","私なんかより、他の人のほうが…","저 같은 것보다 다른 사람이..."],["히라마츠
