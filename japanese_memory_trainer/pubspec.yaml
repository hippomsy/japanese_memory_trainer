name: kioku_japanese
description: JLPT N5-N1 long-term vocabulary memory trainer.
publish_to: "none"
version: 1.0.51+68

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  flutter_tts: ^4.2.0
  just_audio: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
    - assets/illustrations/menu_chapters/
    - assets/illustrations/chapters/
    - assets/basicjl/
    - assets/basicjl_audio/
    - assets/reading/
    - assets/reading_audio/
    - assets/word_images/
    - assets/n4_word_images/
    - assets/data/
    - assets/kanji/
    - assets/sentences/
    - assets/news/
    - assets/screen/
    - assets/hyakupa/
    - assets/hyakupa_audio/
    - assets/grammar/
    - assets/jlpt_n5/
    - assets/jlpt_n5_audio/
    - assets/n4_wordbook/
    - assets/n4_wordbook_audio/
    - assets/jlpt_n4_mock/
    - assets/stories/
